<style>
:root{
  --bg:#F6F1E2;
  --surface:#FFFFFF;
  --surface2:#EFE7D5;
  --text:#242820;
  --muted:#77766D;
  --category:#1E6F4C;
  --categoryText:#FFFFFF;
  --price:#1E6F4C;
  --title:#1E6F4C;
  --button:#1E6F4C;
  --buttonText:#FFFFFF;
  --border:#DDD5C3;
  --shadow:0 8px 25px rgba(0,0,0,.07);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea{
  font-family:inherit;
}

#app{
  min-height:100vh;
}

.loading{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  color:var(--muted);
}

.error{
  min-height:100vh;
  padding:40px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.error h2{
  color:var(--text);
}

.error p{
  color:var(--muted);
  line-height:1.6;
}

.container{
  width:min(760px,100%);
  margin:auto;
  padding:20px 15px 100px;
}

.header{
  text-align:center;
  padding:18px 5px 25px;
}

.logo{
  width:110px;
  height:110px;
  object-fit:contain;
  border-radius:24px;
  display:block;
  margin:0 auto 15px;
}

.logo.hidden{
  display:none;
}

.cafe-name{
  margin:0;
  color:var(--title);
  font-size:32px;
  font-weight:800;
  letter-spacing:-.7px;
}

.subtitle{
  margin:8px 0 0;
  color:var(--muted);
  font-size:15px;
}

.category{
  margin-top:25px;
}

.category-title{
  background:var(--category);
  color:var(--categoryText);
  border-radius:15px;
  padding:14px 17px;
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}

.products{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.product{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  box-shadow:var(--shadow);
  display:flex;
  gap:13px;
  align-items:center;
}

.product-image{
  width:78px;
  height:78px;
  border-radius:12px;
  object-fit:cover;
  background:var(--surface2);
  flex:none;
}

.product-image.no-image{
  display:none;
}

.product-info{
  min-width:0;
  flex:1;
}

.product-name{
  margin:0;
  color:var(--text);
  font-size:17px;
  font-weight:750;
}

.product-description{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.4;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:9px;
}

.price{
  color:var(--price);
  font-size:17px;
  font-weight:850;
  white-space:nowrap;
}

.admin-button{
  position:fixed;
  right:18px;
  bottom:18px;
  width:55px;
  height:55px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface);
  box-shadow:0 8px 30px rgba(0,0,0,.18);
  font-size:24px;
  z-index:50;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  display:none;
  overflow:auto;
  padding:20px 12px;
}

.modal.show{
  display:block;
}

.panel{
  width:min(650px,100%);
  margin:30px auto;
  background:var(--surface);
  border-radius:22px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
}

.panel-header h2{
  margin:0;
  color:var(--text);
  font-size:23px;
}

.close{
  border:0;
  background:var(--surface2);
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
}

.login-box{
  padding:5px;
}

.input{
  width:100%;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  padding:14px;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:var(--text);
  font-weight:700;
  margin-bottom:7px;
}

.color-row{
  display:grid;
  grid-template-columns:55px 1fr;
  gap:10px;
  align-items:center;
}

.color{
  width:55px;
  height:45px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:3px;
  background:white;
}

.section{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid var(--border);
}

.section h3{
  margin:0 0 15px;
  color:var(--title);
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  font-weight:750;
  cursor:pointer;
}

.btn-primary{
  background:var(--button);
  color:var(--buttonText);
}

.btn-secondary{
  background:var(--surface2);
  color:var(--text);
}

.btn-danger{
  background:#B63B3B;
  color:white;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.category-editor,
.product-editor{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin-bottom:12px;
}

.editor-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.editor-title strong{
  color:var(--text);
}

.small-btn{
  border:0;
  border-radius:9px;
  padding:8px 10px;
  background:var(--surface2);
  color:var(--text);
  font-weight:700;
}

.product-editor{
  margin-left:12px;
}

.save-bar{
  position:sticky;
  bottom:0;
  margin:20px -20px -20px;
  padding:15px 20px;
  background:var(--surface);
  border-top:1px solid var(--border);
  border-radius:0 0 22px 22px;
}

.save-main{
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  background:var(--button);
  color:var(--buttonText);
  font-size:17px;
  font-weight:850;

.status{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;

@media(max-width:500px){
  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .cafe-name{
    font-size:28px;
  }

  .product{
    padding:12px;
  }

  .product-image{
    width:65px;
    height:65px;

/* =========================================================
   DATA
========================================================= */

let menuData = null;
let loggedIn = false;


/* =========================================================
   LOAD MENU
========================================================= */

async function loadMenu(){

  try{

    const {data,error} =
      await supabaseClient
      .from("menus")
      .select("data")
      .eq("id",MENU_ID)
      .single();

    if(error) throw error;

    if(data && data.data){

      menuData =
        normalizeData(data.data);

    }else{

      menuData =
        structuredClone(DEFAULT_DATA);

    }

    applyTheme();
    renderMenu();

  }catch(error){

    console.error(error);

    document.getElementById("app").innerHTML = `
      <div class="error">
        <h2>Menü yüklenemedi</h2>
        <p>
          ${escapeHtml(error.message || "Supabase bağlantı hatası")}
        </p>
        <p>
          Project ID: cwofalezjvuxppmwipmc
        </p>
      </div>
    `;
  }
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeData(data){

  const d =
    structuredClone(DEFAULT_DATA);

  if(typeof data !== "object" || !data)
    return d;

  Object.assign(d,data);

  d.theme =
    Object.assign(
      {},
      DEFAULT_DATA.theme,
      data.theme || {}
    );

  if(!Array.isArray(data.categories)){
    d.categories =
      structuredClone(DEFAULT_DATA.categories);
  }

  return d;
}


/* =========================================================
   THEME
========================================================= */

function applyTheme(){

  const t = menuData.theme;

  const root =
    document.documentElement;

  root.style.setProperty("--bg",t.bg);
  root.style.setProperty("--surface",t.surface);
  root.style.setProperty("--surface2",t.surface2);
  root.style.setProperty("--text",t.text);
  root.style.setProperty("--muted",t.muted);
  root.style.setProperty("--category",t.category);
  root.style.setProperty("--categoryText",t.categoryText);
  root.style.setProperty("--price",t.price);
  root.style.setProperty("--title",t.title);
  root.style.setProperty("--button",t.button);
  root.style.setProperty("--buttonText",t.buttonText);
  root.style.setProperty("--border",t.border);
}


/* =========================================================
   RENDER MENU
========================================================= */

function renderMenu(){

  const logo =
    menuData.logo
      ? `<img class="logo" src="${escapeAttr(menuData.logo)}"
              onerror="this.style.display='none'">`
      : "";

  let html = `
    <main class="container">

      <header class="header">

        ${logo}

        <h1 class="cafe-name">
          ${escapeHtml(menuData.cafeName || "")}
        </h1>

        <p class="subtitle">
          ${escapeHtml(menuData.subtitle || "")}
        </p>

      </header>
  `;

  (menuData.categories || [])
  .forEach(category=>{

    html += `
      <section class="category">

        <div class="category-title">
          ${escapeHtml(category.name || "")}
        </div>

        <div class="products">
    `;

    (category.items || [])
    .forEach(item=>{

      const image =
        item.image
          ? `<img class="product-image"
                  src="${escapeAttr(item.image)}"
                  onerror="this.style.display='none'">`
          : "";

      html += `
        <article class="product">

          ${image}

          <div class="product-info">

            <h3 class="product-name">
              ${escapeHtml(item.name || "")}
            </h3>

            ${
              item.description
              ? `<p class="product-description">
                   ${escapeHtml(item.description)}
                 </p>`
              : ""
            }

            <div class="product-bottom">

              <span class="price">
                ${escapeHtml(item.price || "")}
              </span>

            </div>

          </div>

        </article>
      `;

    });

    html += `
        </div>
      </section>
    `;

  });

  html += `
    </main>
  `;

  document.getElementById("app").innerHTML = html;
}


/* =========================================================
   ADMIN
========================================================= */

function openAdmin(){

  document
    .getElementById("adminModal")
    .classList.add("show");

  if(loggedIn){

    document.getElementById("loginArea")
      .style.display="none";

    document.getElementById("editorArea")
      .style.display="block";

  }else{

    document.getElementById("loginArea")
      .style.display="block";

    document.getElementById("editorArea")
      .style.display="none";

    setTimeout(()=>{
      document.getElementById("pinInput").focus();
    },100);

  }
}


function closeAdmin(){

  document
    .getElementById("adminModal")
    .classList.remove("show");
}


/* =========================================================
   PIN LOGIN
========================================================= */

async function loginAdmin(){

  const pin =
    document
    .getElementById("pinInput")
    .value
    .trim();

  const status =
    document.getElementById("loginStatus");

  if(!pin){

    status.textContent="PIN girin.";
    return;
  }

  status.textContent="Kontrol ediliyor...";

  try{

    const {data,error} =
      await supabaseClient
      .rpc(
        "check_menu_pin",
        {
          p_menu_id:MENU_ID,
          p_pin:pin
        }
      );

    if(error) throw error;

    if(data === true || data === "true"){

      loggedIn=true;

      status.textContent="";

      document.getElementById("loginArea")
        .style.display="none";

      document.getElementById("editorArea")
        .style.display="block";

      fillEditor();

    }else{

      status.textContent="PIN yanlış.";

    }

  }catch(error){

    console.error(error);

    status.textContent =
      "PIN kontrolü başarısız: " +
      (error.message || "");

  }
}


/* =========================================================
   EDITOR
========================================================= */

function fillEditor(){

  document.getElementById("logoInput").value =
    menuData.logo || "";

  document.getElementById("cafeNameInput").value =
    menuData.cafeName || "";

  document.getElementById("subtitleInput").value =
    menuData.subtitle || "";

  setColor("bgColor","bgText",menuData.theme.bg);
  setColor("surfaceColor","surfaceText",menuData.theme.surface);
  setColor("textColor","textText",menuData.theme.text);
  setColor("mutedColor","mutedText",menuData.theme.muted);
  setColor("titleColor","titleText",menuData.theme.title);
  setColor("categoryColor","categoryText",menuData.theme.category);

  setColor(
    "categoryTextOnlyColor",
    "categoryTextOnlyText",
    menuData.theme.categoryText
  );

  setColor("priceColor","priceText",menuData.theme.price);
  setColor("buttonColor","buttonText",menuData.theme.button);

  setColor(
    "buttonTextColor",
    "buttonTextOnlyText",
    menuData.theme.buttonText
  );

  setColor("borderColor","borderText",menuData.theme.border);

  renderCategoryEditor();
}


function setColor(colorId,textId,value){

  document.getElementById(colorId).value =
    validHex(value) ? value : "#000000";

  document.getElementById(textId).value =
    value || "#000000";
}


/* =========================================================
   COLOR LIVE EDIT
========================================================= */

[
  ["bgColor","bgText","bg"],
  ["surfaceColor","surfaceText","surface"],
  ["textColor","textText","text"],
  ["mutedColor","mutedText","muted"],
  ["titleColor","titleText","title"],
  ["categoryColor","categoryText","category"],
  ["categoryTextOnlyColor","categoryTextOnlyText","categoryText"],
  ["priceColor","priceText","price"],
  ["buttonColor","buttonText","button"],
  ["buttonTextColor","buttonTextOnlyText","buttonText"],
  ["borderColor","borderText","border"]
].forEach(([colorId,textId,key])=>{

  document.getElementById(colorId)
  .addEventListener("input",e=>{

    const value=e.target.value;

    document.getElementById(textId).value=value;

    menuData.theme[key]=value;

    applyTheme();

  });

  document.getElementById(textId)
  .addEventListener("input",e=>{

    let value=e.target.value.trim();

    if(validHex(value)){

      document.getElementById(colorId).value=value;

      menuData.theme[key]=value;

      applyTheme();

    }

  });

});


/* =========================================================
   CATEGORY EDITOR
========================================================= */

function renderCategoryEditor(){

  const box =
    document.getElementById("categoriesEditor");

  box.innerHTML="";

  menuData.categories.forEach((category,cIndex)=>{

    const div =
      document.createElement("div");

    div.className="category-editor";

    div.innerHTML=`

      <div class="editor-title">

        <strong>
          Kategori ${cIndex+1}
        </strong>

        <button
          class="small-btn"
          onclick="deleteCategory(${cIndex})">
          Sil
        </button>

      </div>

      <div class="field">

        <label>Kategori adı</label>

        <input
          class="input"
          value="${escapeAttr(category.name || "")}"
          oninput="updateCategoryName(${cIndex},this.value)"
        >

      </div>

      <div class="field">

        <label>Ürünler</label>

        <div id="products-${cIndex}"></div>

      </div>

      <button
        class="btn btn-secondary"
        onclick="addProduct(${cIndex})">
        + Ürün Ekle
      </button>
    `;

    box.appendChild(div);

    renderProductEditors(
      cIndex,
      div.querySelector(`#products-${cIndex}`)
    );

  });

}


function renderProductEditors(cIndex,box){

  box.innerHTML="";

  const category =
    menuData.categories[cIndex];

  (category.items || [])
  .forEach((item,pIndex)=>{

    const div =
      document.createElement("div");

    div.className="product-editor";

    div.innerHTML=`

      <div class="editor-title">

        <strong>
          Ürün ${pIndex+1}
        </strong>

        <button
          class="small-btn"
          onclick="deleteProduct(${cIndex},${pIndex})">
          Sil
        </button>

      </div>

      <div class="field">

        <label>Ürün adı</label>

        <input
          class="input"
          value="${escapeAttr(item.name || "")}"
          oninput="updateProduct(${cIndex},${pIndex},'name',this.value)"
        >

      </div>

      <div class="field">

        <label>Açıklama</label>

        <input
          class="input"
          value="${escapeAttr(item.description || "")}"
          oninput="updateProduct(${cIndex},${pIndex},'description',this.value)"
        >

      </div>

      <div class="field">

        <label>Fiyat</label>

        <input
          class="input"
          value="${escapeAttr(item.price || "")}"
          oninput="updateProduct(${cIndex},${pIndex},'price',this.value)"
        >

      </div>

      <div class="field">

        <label>Ürün görseli URL</label>

        <input
          class="input"
          value="${escapeAttr(item.image || "")}"
          placeholder="https://.../urun.jpg"
          oninput="updateProduct(${cIndex},${pIndex},'image',this.value)"
        >

      </div>
    `;

    box.appendChild(div);

  });

}


/* =========================================================
   CATEGORY ACTIONS
========================================================= */

function updateCategoryName(index,value){

  menuData.categories[index].name=value;

  renderMenu();
}


function addCategory(){

  menuData.categories.push({

    id:"category-"+Date.now(),

    name:"Yeni Kategori",

    items:[]

  });

  renderCategoryEditor();
  renderMenu();

}


function deleteCategory(index){

  if(!confirm("Bu kategoriyi silmek istiyor musunuz?"))
    return;

  menuData.categories.splice(index,1);

  renderCategoryEditor();
  renderMenu();

}


/* =========================================================
   PRODUCT ACTIONS
========================================================= */

function updateProduct(cIndex,pIndex,key,value){

  menuData
    .categories[cIndex]
    .items[pIndex][key]=value;

  renderMenu();

}


function addProduct(cIndex){

  menuData.categories[cIndex].items.push({

    id:"product-"+Date.now(),

    name:"Yeni Ürün",

    description:"",

    price:"0 ₺",

    image:""

  });

  renderCategoryEditor();
  renderMenu();

}


function deleteProduct(cIndex,pIndex){

  if(!confirm("Bu ürünü silmek istiyor musunuz?"))
    return;

  menuData
    .categories[cIndex]
    .items.splice(pIndex,1);

  renderCategoryEditor();
  renderMenu();

}


/* =========================================================
   SAVE
========================================================= */

async function saveEverything(){

  const status =
    document.getElementById("saveStatus");

  menuData.logo =
    document.getElementById("logoInput").value.trim();

  menuData.cafeName =
    document.getElementById("cafeNameInput").value.trim();

  menuData.subtitle =
    document.getElementById("subtitleInput").value.trim();

  status.textContent="Kaydediliyor...";

  try{

    const {data,error} =
      await supabaseClient
      .rpc(
        "save_menu",
        {
          p_menu_id:MENU_ID,
          p_data:menuData
        }
      );

    if(error) throw error;

    status.textContent="✓ Kaydedildi";

    applyTheme();
    renderMenu();

    setTimeout(()=>{
      status.textContent="";
    },2500);

  }catch(error){

    console.error(error);

    status.textContent =
      "Kaydetme hatası: " +
      (error.message || "");

  }

}


/* =========================================================
   CHANGE PIN
========================================================= */

async function changePin(){

  const oldPin =
    document.getElementById("oldPin")
    .value.trim();

  const newPin =
    document.getElementById("newPin")
    .value.trim();

  const status =
    document.getElementById("pinStatus");

  if(!oldPin || !newPin){

    status.textContent=
      "Eski ve yeni PIN'i girin.";

    return;
  }

  if(newPin.length < 4){

    status.textContent=
      "Yeni PIN en az 4 haneli olmalı.";

    return;
  }

  status.textContent=
    "PIN değiştiriliyor...";

  try{

    const {data,error} =
      await supabaseClient
      .rpc(
        "change_menu_pin",
        {
          p_menu_id:MENU_ID,
          p_old_pin:oldPin,
          p_new_pin:newPin
        }
      );

    if(error) throw error;

    if(data === true || data === "true"){

      status.textContent=
        "✓ PIN başarıyla değiştirildi.";

      document.getElementById("oldPin").value="";
      document.getElementById("newPin").value="";

    }else{

      status.textContent=
        "Eski PIN yanlış.";

    }

  }catch(error){

    console.error(error);

    status.textContent=
      "PIN değiştirme hatası: " +
      (error.message || "");

  }

}


/* =========================================================
   HELPERS
========================================================= */

function validHex(value){

  return /^#[0-9A-Fa-f]{6}$/.test(value || "");

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* =========================================================
   START
========================================================= */

loadMenu();

</script>
