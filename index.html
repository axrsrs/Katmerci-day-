<style>

   RENKLER

<body>


<div id="app">

  <div class="loading">
    Menü yükleniyor...
  </div>

</div>


<div
  class="admin-dot"
  id="adminDot"
>
  ⚙️
</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://cwofalezjvuxppmwipmc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n9xGFNX-fwl4C-BFLBGmeg_hsKy9GtU";

const MENU_ID =
"00000000-0000-0000-0000-000000000001";


let menuData = null;

let activeCatId = null;

let unlocked = false;

let currentPin = "";


/* =====================================================
   API
===================================================== */

async function api(path,options={}){

  const response =
    await fetch(
      SUPABASE_URL + path,
      {
        ...options,

        headers:{
          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Accept":
            "application/json"
        }
      }
    );


  const text =
    await response.text();


  let data = null;


  try{

    data =
      text
      ? JSON.parse(text)
      : null;

  }catch{

    data = text;

  }


  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error ||
      text ||
      "Supabase hatası"
    );

  }


  return data;

}


/* =====================================================
   RPC
===================================================== */

async function rpc(name,args){

  return await api(
    "/rest/v1/rpc/" + name,
    {
      method:"POST",

      body:
        JSON.stringify(args)
    }
  );

}


/* =====================================================
   MENÜYÜ YÜKLE
===================================================== */

async function loadMenu(){

  const app =
    document.getElementById("app");


  try{

    const rows =
      await api(
        "/rest/v1/menus?id=eq." +
        MENU_ID +
        "&select=id,data"
      );


    if(
      !rows ||
      !rows.length
    ){

      throw new Error(
        "Menü kaydı bulunamadı."
      );

    }


    menuData =
      normalize(rows[0].data);


    activeCatId =
      menuData.categories[0]?.id ||
      null;


    render();

  }
  catch(error){

    console.error(error);


    app.innerHTML = `

      <div
        style="
          min-height:100vh;
          background:#17120F;
          color:#F5EBDD;
          display:flex;
          align-items:center;
          justify-content:center;
          text-align:center;
          padding:25px;
        "
      >

        <div>

          <h2
            style="
              font-family:Georgia,serif;
            "
          >
            Menü yüklenemedi
          </h2>

          <p
            style="
              color:#B9AC9A;
              font-size:13px;
            "
          >
            ${escapeHTML(error.message)}
          </p>

          <button
            onclick="location.reload()"
            style="
              background:#C69A57;
              color:#17120F;
              border:0;
              padding:11px 18px;
              border-radius:10px;
              font-weight:bold;
            "
          >
            Tekrar Dene
          </button>

        </div>

      </div>

    `;

  }

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(data){

  const d =
    data || {};


  return{

    cafeName:
      d.cafeName ||
      "Katmerci Dayı",

    subtitle:
      d.subtitle ||
      "Gaziantepten gelen lezzet",

    logo:
      d.logo ||
      "",

    theme:
      d.theme ||
      {},

    categories:
      Array.isArray(d.categories)
      ? d.categories
      : []

  };

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(char){

        return{

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[char];

      }
    );

}


/* =====================================================
   FİYAT
===================================================== */

function money(value){

  return(
    Number(value) || 0
  ).toLocaleString(
    "tr-TR"
  ) + " ₺";

}


/* =====================================================
   TEMA
===================================================== */

function applyTheme(theme){

  if(!theme)
    return;


  const root =
    document.documentElement;


  const map = {

    background:
      "--bg",

    header:
      "--header",

    surface:
      "--surface",

    categoryBg:
      "--green",

    categoryText:
      "--cream",

    text:
      "--cream",

    mutedText:
      "--muted",

    price:
      "--price",

    button:
      "--gold",

    border:
      "--border",

    tabActive:
      "--gold"

  };


  Object.entries(map)
    .forEach(
      ([key,css]) => {

        if(theme[key]){

          root.style.setProperty(
            css,
            theme[key]
          );

        }

      }
    );

}


/* =====================================================
   ANA SAYFA
===================================================== */

function render(){

  if(!menuData)
    return;


  applyTheme(
    menuData.theme
  );


  const cats =
    menuData.categories || [];


  let active =
    cats.find(
      cat =>
        cat.id === activeCatId
    );


  if(!active){

    active =
      cats[0];

    activeCatId =
      active?.id ||
      null;

  }


  /* SEKME */

  const tabs =
    cats
      .map(
        cat => `

          <button
            class="tab-btn ${
              cat.id === active?.id
              ? "active"
              : ""
            }"
            data-cat="${escapeHTML(cat.id)}"
          >
            ${escapeHTML(cat.name)}
          </button>

        `
      )
      .join("");


  /* ÜRÜNLER */

  const items =
    (active?.items || [])
      .map(
        item => `

          <div
            class="item-row"
          >

            ${
              item.image
              ?

              `

                <img
                  class="item-thumb"
                  src="${escapeHTML(item.image)}"
                  alt=""
                  onerror="this.style.display='none'"
                >

              `

              :
              ""
            }


            <div
              class="item-text-row"
            >


              <div
                class="item-name-wrap"
              >

                <div
                  class="item-name ${
                    item.available === false
                    ? "unavailable"
                    : ""
                  }"
                >

/* =====================================================
   TOAST
===================================================== */

function toast(message){

  const el =
    document.getElementById(
      "toast"
    );


  el.textContent =
    message;


  el.style.display =
    "block";


  clearTimeout(
    window.__toast
  );


  window.__toast =
    setTimeout(
      () => {

        el.style.display =
          "none";

      },
      2200
    );

}


/* =====================================================
   PIN
===================================================== */

function openPin(){

  if(unlocked){

    openAdmin();

    return;

  }


  const overlay =
    document.createElement(
      "div"
    );


  overlay.className =
    "overlay";


  overlay.innerHTML = `

    <div
      class="panel"
    >

      <h2>
        Yönetim Girişi
      </h2>


      <label>
        PIN
      </label>


      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        placeholder="PIN kodu"
      >


      <div
        id="pinMsg"
        class="status-msg"
      ></div>


      <button
        id="pinButton"
        class="btn btn-main btn-block"
      >
        Giriş Yap
      </button>


      <button
        id="pinCancel"
        class="btn btn-ghost btn-block"
      >
        İptal
      </button>

    </div>

  `;


  document.body.appendChild(
    overlay
  );


  overlay.querySelector(
    "#pinCancel"
  ).onclick =
    () => {

      overlay.remove();

    };


  const login =
    async() => {

      const pin =
        overlay.querySelector(
          "#pinInput"
        ).value.trim();


      const msg =
        overlay.querySelector(
          "#pinMsg"
        );


      if(!pin){

        msg.textContent =
          "PIN gir.";

        return;

      }


      msg.textContent =
        "Kontrol ediliyor...";


      try{

        const result =
          await rpc(
            "check_menu_pin",
            {

              p_menu_id:
                MENU_ID,

              p_pin:
                pin

            }
          );


        const ok =

          result === true ||
          result === "true" ||
          result?.[0] === true ||
          result?.result === true;


        if(!ok){

          msg.textContent =
            "Hatalı PIN.";

          return;

        }


        unlocked =
          true;

        currentPin =
          pin;


        overlay.remove();


        openAdmin();

      }
      catch(error){

        msg.textContent =
          error.message;

      }

    };


  overlay.querySelector(
    "#pinButton"
  ).onclick =
    login;


  overlay.querySelector(
    "#pinInput"
  ).onkeydown =
    e => {

      if(e.key === "Enter")
        login();

    };


  setTimeout(
    () => {

      overlay.querySelector(
        "#pinInput"
      ).focus();

    },
    100
  );

}


/* =====================================================
   RENK ALANI
===================================================== */

function colorField(
  id,
  title,
  value
){

  const v =
    value ||
    "#FFFFFF";


  return `

    <div
      class="color-item"
    >

      <label>
        ${title}
      </label>


      <input
        class="color-swatch"
        type="color"
        id="${id}"
        value="${v}"
      >


      <input
        class="hex-input"
        id="${id}Hex"
        value="${v}"
        maxlength="7"
      >

    </div>

  `;

}

          .join("")
      }


      <button
        class="btn btn-ghost btn-block"
        id="addCategory"
        style="margin-top:12px"
      >
        + Yeni Kategori
      </button>


      <div
        id="saveMsg"
        class="status-msg"
      ></div>


      <button
        id="saveButton"
        class="btn btn-main btn-block save-button"
      >
        💾 Kaydet
      </button>


      <button
        id="closeAdmin"
        class="btn btn-ghost btn-block"
      >
        Kapat
      </button>

    </div>

  `;


  /* =====================================================
     ANA BİLGİLER
  ===================================================== */

  overlay.querySelector(
    "#adminName"
  ).oninput =
    e => {

      menuData.cafeName =
        e.target.value;

    };


  overlay.querySelector(
    "#adminSubtitle"
  ).oninput =
    e => {

      menuData.subtitle =
        e.target.value;

    };


  overlay.querySelector(
    "#adminLogo"
  ).oninput =
    e => {

      menuData.logo =
        e.target.value;

    };


  /* =====================================================
     RENKLER
  ===================================================== */

  const colors = {

    bgColor:
      "background",

    headerColor:
      "header",

    surfaceColor:
      "surface",

    greenColor:
      "categoryBg",

    creamColor:
      "text",

    mutedColor:
      "mutedText",

    priceColor:
      "price",

    goldColor:
      "button",

    borderColor:
      "border",

    tabColor:
      "tabActive"

  };


  Object.entries(colors)
    .forEach(
      ([id,key]) => {

        const color =
          overlay.querySelector(
            "#" + id
          );


        const hex =
          overlay.querySelector(
            "#" + id + "Hex"
          );


        color.oninput =
          e => {

            const value =
              e.target.value.toUpperCase();


            hex.value =
              value;


            menuData.theme =
              menuData.theme || {};


            menuData.theme[key] =
              value;


            applyTheme(
              menuData.theme
            );

          };


        hex.oninput =
          e => {

            let value =
              e.target.value.trim();


            if(
              !value.startsWith("#")
            ){

              value =
                "#" + value;

            }


            if(
              /^#[0-9A-Fa-f]{6}$/
              .test(value)
            ){

              value =
                value.toUpperCase();


              color.value =
                value;


              menuData.theme =
                menuData.theme || {};


              menuData.theme[key] =
                value;


              applyTheme(
                menuData.theme
              );

            }

          };

      }

    "#darkTheme"

        surface:
          "#241C16",

        categoryBg:
          "#7C875A",

        categoryText:
          "#F5EBDD",

        text:
          "#F5EBDD",

        mutedText:
          "#B9AC9A",

        price:
          "#D1A45C",

        button:
          "#C69A57",

        border:
          "#59452D",

        tabActive:
          "#C69A57"

      };

        menuData.theme

      renderAdmin();


      toast(
        "Koyu tema uygulandı ✓"

    };


  /* =====================================================
     KATEGORİ
  ===================================================== */

  overlay
    .querySelectorAll(
      "[data-cat-name]"
    )
    .forEach(
      input => {

          e => {

     ÜRÜN ADI
  ===================================================== */

    .forEach(

          e => {

  ===================================================== */

  ===================================================== */

/* =====================================================
   ÜRÜN BUL
===================================================== */

function findItem(id){

  for(
    const cat of
    menuData.categories
  ){

    const item =
      cat.items.find(
        x =>
          x.id === id
      );


    if(item)
      return item;

  }


  return null;

}
