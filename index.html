<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E6F4C">
<title>Kafe Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e2;--surface:#fff;--surface-raised:#ece2c7;--accent:#1e6f4c;--accent-text:#134a32;--ink:#20261d;--ink-muted:#6e6a52;--ink-faint:#a39f84;--danger:#a9433a;--border-soft:rgba(46,38,33,.14)}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}.stains{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.stain{position:absolute;border-radius:50%;border:2px solid var(--ink-faint);opacity:.05}.s1{width:340px;height:340px;top:-80px;left:-100px;border-width:14px}.s2{width:180px;height:180px;top:220px;right:-60px;border-width:10px}.s3{width:120px;height:120px;bottom:140px;left:20px;border-width:6px}.s4{width:260px;height:260px;bottom:-100px;right:-80px;border-width:16px}.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-bottom:100px}header.hero{padding:48px 24px 28px;text-align:center;border-bottom:1px solid var(--border-soft)}.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent-text);margin-bottom:14px}h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(34px,9vw,52px);margin:0 0 10px;line-height:1.05;color:var(--ink)}.subtitle{color:var(--ink-muted);font-size:15px;max-width:420px;margin:auto;line-height:1.5}nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:18px 20px;scrollbar-width:none;position:sticky;top:0;background:linear-gradient(var(--bg) 78%,transparent);z-index:5}nav.tabs::-webkit-scrollbar{display:none}.tab-btn{flex:0 0 auto;font:500 12.5px 'IBM Plex Mono',monospace;padding:9px 16px;border-radius:999px;border:1px solid var(--border-soft);background:var(--surface);color:var(--ink-muted);white-space:nowrap}.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fbf7ea}.category-block{padding:6px 22px 8px}.category-title{font:500 22px Fraunces,serif;color:var(--accent-text);margin:22px 0 4px}.steam-divider{width:100%;height:14px;margin:6px 0 14px;opacity:.5}.item-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--border-soft)}.item-thumb{width:54px;height:54px;flex:0 0 auto;border-radius:10px;object-fit:cover;border:1px solid var(--border-soft);background:var(--surface-raised)}.item-text-row{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}.item-name-wrap{min-width:0}.item-name{font-size:16px;font-weight:600}.item-name.unavailable{color:var(--ink-faint);text-decoration:line-through}.item-desc{font-size:12.5px;color:var(--ink-muted);margin-top:2px;line-height:1.4}.leader{flex:1;border-bottom:1px dotted var(--border-soft);height:0;margin:0 2px 5px;min-width:12px}.item-price{font:15px 'IBM Plex Mono',monospace;color:var(--accent-text);white-space:nowrap}.item-price.unavailable{color:var(--ink-faint)}.sold-out-tag{font:10px 'IBM Plex Mono',monospace;color:#a94444;letter-spacing:.08em;margin-left:6px}footer{text-align:center;padding:36px 24px 10px;color:var(--ink-faint);font:11.5px 'IBM Plex Mono',monospace}.admin-dot{position:fixed;bottom:18px;right:18px;width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 2px 10px rgba(46,38,33,.12)}.overlay{position:fixed;inset:0;background:rgba(46,38,33,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.panel{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:26px 20px 30px}.panel h2{font:24px Fraunces,serif;margin:0 0 18px;color:var(--accent-text)}.panel label{display:block;font:10.5px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin:14px 0 5px}.panel input,.panel textarea{width:100%;background:var(--surface-raised);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;color:var(--ink);font:14.5px 'Work Sans',sans-serif}.row-2{display:flex;gap:10px}.row-2>*{flex:1}.btn{font:12.5px 'IBM Plex Mono',monospace;padding:10px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer}.btn-gold{background:var(--accent);color:#fbf7ea;font-weight:600}.btn-ghost{background:var(--surface);border-color:var(--border-soft);color:var(--ink)}.btn-danger{background:var(--surface);border-color:var(--danger);color:var(--danger)}.btn-block{width:100%;display:block;margin-top:8px}.item-edit-card{background:var(--surface-raised);border:1px solid var(--border-soft);border-radius:10px;padding:14px;margin-top:12px}.cat-header{display:flex;align-items:center;gap:10px;margin-top:26px;padding-bottom:8px;border-bottom:1px solid var(--border-soft)}.cat-header input{font:18px Fraunces,serif;border:none;background:transparent;padding:2px 0}.avail{display:flex!important;align-items:center;gap:6px;font-size:12px!important}.avail input{width:auto}.actions{display:flex;gap:8px;margin-top:10px}.status{font:11.5px 'IBM Plex Mono',monospace;color:var(--accent-text);margin-top:10px;min-height:16px}.close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--ink-muted);font-size:20px}.color-field{display:flex;align-items:center;gap:10px;background:var(--surface-raised);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px}.color-field input{width:42px;height:36px;padding:0;border:0}.img-row{display:flex;gap:12px;align-items:flex-start}.admin-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--border-soft)}.img-controls{flex:1}.img-controls input{margin-bottom:6px}.empty{text-align:center;padding:30px;color:var(--ink-muted)}
@media(min-width:640px){.overlay{align-items:center}.panel{border-radius:18px}}
</style>
</head>
<body>
<div class="stains"><div class="stain s1"></div><div class="stain s2"></div><div class="stain s3"></div><div class="stain s4"></div></div>
<div class="wrap" id="app"><div class="empty">Menü yükleniyor…</div></div>
<div class="admin-dot" id="adminDot" title="Yönetim">⚙</div>
<script>
const KEY='cafe-menu-data-v2', PINKEY='cafe-admin-pin-v2', DEFAULT_PIN='1234';
let data,active=0,unlocked=false;

function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function defaults(){return {cafeName:'Kahve Durağı',subtitle:"Taze demlenmiş kahve ve ev yapımı tatlılar — İnegöl'ün köşe başında.",theme:{baseColor:'#1E6F4C'},categories:[
{name:'Sıcak İçecekler',items:[['Türk Kahvesi','Az / orta / şekerli',90],['Filtre Kahve','Günün çekirdeği',110],['Latte','Espresso, buharda süt',140],['Cappuccino','Bol köpüklü',130],['Sıcak Çikolata','Bitter, ev yapımı',120],['Çay','Bardak',40]]},
{name:'Soğuk İçecekler',items:[['Ice Latte','',150],['Frappe','Buzlu, köpüklü',160],['Limonata','Ev yapımı, nane',90],['Soğuk Çay','Şeftali / limon',80]]},
{name:'Tatlılar',items:[['Cheesecake','Meyve soslu',180],['Brownie','Sıcak servis, dilerseniz dondurmalı',150],['Kazandibi','',140],['Sufle','Sıcak çikolatalı',170]]},
{name:'Atıştırmalıklar',items:[['Tost','Kaşarlı',130],['Sandviç','Günün seçenekleri',160],['Kruvasan','',110],['Kurabiye','İki adet',70]]}
].map(c=>({id:uid(),name:c.name,items:c.items.map(x=>({id:uid(),name:x[0],desc:x[1],price:x[2],available:true,image:''}))}))}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function mix(h,a){try{let [r,g,b]=rgb(h);return '#'+[r+(255-r)*a,g+(255-g)*a,b+(255-b)*a].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('')}catch{return h}}
function dark(h,a){try{let [r,g,b]=rgb(h);return '#'+[r*(1-a),g*(1-a),b*(1-a)].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('')}catch{return h}}
function theme(){let c=data.theme.baseColor,r=document.documentElement.style;r.setProperty('--bg',mix(c,.93));r.setProperty('--surface-raised',mix(c,.83));r.setProperty('--accent',c);r.setProperty('--accent-text',dark(c,.32));r.setProperty('--ink',dark(c,.72));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Kaydetme engellendi. Safari özel sekmesini kapatıp tekrar deneyin.');return false}}
function money(n){return Number(n||0).toLocaleString('tr-TR')+' ₺'}
function steam(){return '<svg class="steam-divider" viewBox="0 0 300 14" preserveAspectRatio="none"><path d="M0 7 Q15 0 30 7 T60 7 T90 7 T120 7 T150 7 T180 7 T210 7 T240 7 T270 7 T300 7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>'}

function render(){
let c=data.categories[active]||data.categories[0];
if(!c){document.getElementById('app').innerHTML='<div class="empty">Henüz kategori yok.</div>';return}
document.getElementById('app').innerHTML='<header class="hero"><div class="eyebrow">Menü</div><h1>'+esc(data.cafeName)+'</h1><p class="subtitle">'+esc(data.subtitle)+'</p></header><nav class="tabs">'+data.categories.map((x,i)=>'<button class="tab-btn '+(i===active?'active':'')+'" data-tab="'+i+'">'+esc(x.name)+'</button>').join('')+'</nav><div class="category-block"><div class="category-title">'+esc(c.name)+'</div>'+steam()+c.items.map(it=>'<div class="item-row">'+(it.image?'<img class="item-thumb" src="'+esc(it.image)+'" alt="">':'')+'<div class="item-text-row"><div class="item-name-wrap"><div class="item-name '+(it.available?'':'unavailable')+'">'+esc(it.name)+(it.available?'':'<span class="sold-out-tag">TÜKENDİ</span>')+'</div>'+(it.desc?'<div class="item-desc">'+esc(it.desc)+'</div>':'')+'</div><div class="leader"></div><div class="item-price '+(it.available?'':'unavailable')+'">'+money(it.price)+'</div></div></div>').join('')+'</div><footer>QR ile açıldı · fiyatlara KDV dahildir</footer>';
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=+b.dataset.tab;render()})
}

function openGate(){
if(unlocked)return admin();
let o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel"><button class="close" id="x">✕</button><h2>Yönetim Girişi</h2><label>PIN kodu</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••"><div class="status" id="msg"></div><button class="btn btn-gold btn-block" id="go">Giriş yap</button></div>';document.body.appendChild(o);
o.querySelector('#x').onclick=()=>o.remove();let check=()=>{if(o.querySelector('#pin').value===(localStorage.getItem(PINKEY)||DEFAULT_PIN)){unlocked=true;o.remove();admin()}else o.querySelector('#msg').textContent='Hatalı PIN.'};o.querySelector('#go').onclick=check;o.querySelector('#pin').onkeydown=e=>{if(e.key==='Enter')check()}
}

function admin(){
let o=document.createElement('div');o.className='overlay';
function draw(){
o.innerHTML='<div class="panel"><button class="close" id="x">✕</button><h2>Yönetim Paneli</h2><label>Kafe adı</label><input id="cn" value="'+esc(data.cafeName)+'"><label>Alt başlık</label><input id="sub" value="'+esc(data.subtitle)+'">'+data.categories.map((c,ci)=>'<div class="cat-header"><input data-cat="'+ci+'" value="'+esc(c.name)+'"><button class="btn btn-danger" data-dcat="'+ci+'">Sil</button></div>'+c.items.map((it,ii)=>'<div class="item-edit-card"><label>Ürün adı</label><input data-name="'+ci+','+ii+'" value="'+esc(it.name)+'"><label>Açıklama</label><input data-desc="'+ci+','+ii+'" value="'+esc(it.desc)+'"><div class="row-2"><div><label>Fiyat (₺)</label><input type="number" min="0" data-price="'+ci+','+ii+'" value="'+it.price+'"></div></div><label>Görsel</label><div class="img-row"><img class="admin-thumb" src="'+(it.image||'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=')+'"><div class="img-controls"><input type="file" accept="image/*" data-file="'+ci+','+ii+'"><input placeholder="Görsel linki" data-url="'+ci+','+ii+'" value="'+(it.image&&it.image.startsWith('http')?esc(it.image):'')+'"></div></div><label class="avail"><input type="checkbox" data-av="'+ci+','+ii+'" '+(it.available?'checked':'')+'> Stokta / satışta</label><button class="btn btn-danger" data-di="'+ci+','+ii+'">Ürünü sil</button></div>').join('')+'<button class="btn btn-ghost btn-block" data-add="'+ci+'">+ Ürün ekle</button>').join('<hr style="border:0;border-top:1px solid var(--border-soft);margin:22px 0">')+'<button class="btn btn-ghost btn-block" id="addcat">+ Yeni kategori</button><hr style="border:0;border-top:1px solid var(--border-soft);margin:24px 0"><label>Tema rengi</label><div class="color-field"><input type="color" id="color" value="'+data.theme.baseColor+'"><span>Menünün ana rengini değiştir.</span></div><label>Yeni PIN</label><div class="row-2"><input id="newpin" type="password" placeholder="En az 4 hane"><button class="btn btn-ghost" id="pinchange">Değiştir</button></div><div class="status" id="status"></div><button class="btn btn-gold btn-block" id="save">Kaydet ve menüye dön</button></div>';
bind();
}
function bind(){
o.querySelector('#x').onclick=()=>o.remove();
o.querySelector('#cn').oninput=e=>data.cafeName=e.target.value;o.querySelector('#sub').oninput=e=>data.subtitle=e.target.value;
o.querySelectorAll('[data-cat]').forEach(x=>x.oninput=e=>data.categories[+x.dataset.cat].name=e.target.value);
o.querySelectorAll('[data-name]').forEach(x=>x.oninput=e=>{let[a,b]=x.dataset.name.split(',');data.categories[a].items[b].name=e.target.value});
o.querySelectorAll('[data-desc]').forEach(x=>x.oninput=e=>{let[a,b]=x.dataset.desc.split(',');data.categories[a].items[b].desc=e.target.value});
o.querySelectorAll('[data-price]').forEach(x=>x.oninput=e=>{let[a,b]=x.dataset.price.split(',');data.categories[a].items[b].price=+e.target.value});
o.querySelectorAll('[data-av]').forEach(x=>x.onchange=e=>{let[a,b]=x.dataset.av.split(',');data.categories[a].items[b].available=e.target.checked});
o.querySelectorAll('[data-url]').forEach(x=>x.oninput=e=>{let[a,b]=x.dataset.url.split(',');data.categories[a].items[b].image=e.target.value});
o.querySelectorAll('[data-file]').forEach(x=>x.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let[a,b]=x.dataset.file.split(',');data.categories[a].items[b].image=r.result;draw()};r.readAsDataURL(f)});
o.querySelectorAll('[data-di]').forEach(x=>x.onclick=()=>{let[a,b]=x.dataset.di.split(',');data.categories[a].items.splice(b,1);draw()});
o.querySelectorAll('[data-dcat]').forEach(x=>x.onclick=()=>{data.categories.splice(+x.dataset.dcat,1);active=0;draw()});
o.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{data.categories[+x.dataset.add].items.push({id:uid(),name:'Yeni ürün',desc:'',price:0,available:true,image:''});draw()});
o.querySelector('#addcat').onclick=()=>{data.categories.push({id:uid(),name:'Yeni kategori',items:[]});draw()};
o.querySelector('#color').oninput=e=>{data.theme.baseColor=e.target.value;theme()};
o.querySelector('#pinchange').onclick=()=>{let p=o.querySelector('#newpin').value.trim();if(p.length>=4){localStorage.setItem(PINKEY,p);o.querySelector('#status').textContent='PIN güncellendi.'}else o.querySelector('#status').textContent='PIN en az 4 haneli olmalı.'};
o.querySelector('#save').onclick=()=>{if(save()){o.remove();theme();render()}}
}
document.body.appendChild(o);draw()
}

document.getElementById('adminDot').onclick=openGate;
try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{data=defaults()}
if(!data.theme)data.theme={baseColor:'#1E6F4C'};
if(!data.categories)data.categories=[];
theme();render();
</script>
</body>
</html>
