<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kafe Menü</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F6F1E2;
  --surface:#FFFFFF;
  --surface-raised:#ECE2C7;
  --accent:#1E6F4C;
  --accent-text:#134A32;
  --ink:#20261D;
  --ink-muted:#6E6A52;
  --ink-faint:#A39F84;
  --price:#134A32;
  --button:#1E6F4C;
  --button-text:#FBF7EA;
  --danger:#A9433A;
  --border-soft:#CFC8B5;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow-x:hidden;
}

.stains{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}

.stain{
  position:absolute;
  border-radius:50%;
  border:2px solid var(--ink-faint);
  opacity:.05;
}

.stain.s1{
  width:340px;
  height:340px;
  top:-80px;
  left:-100px;
  border-width:14px;
}

.stain.s2{
  width:180px;
  height:180px;
  top:220px;
  right:-60px;
  border-width:10px;
}

.stain.s3{
  width:120px;
  height:120px;
  bottom:140px;
  left:20px;
  border-width:6px;
}

.stain.s4{
  width:260px;
  height:260px;
  bottom:-100px;
  right:-80px;
  border-width:16px;
  opacity:.04;
}

.wrap{
  position:relative;
  z-index:1;
  max-width:640px;
  margin:0 auto;
  padding:0 0 100px;
}

header.hero{
  padding:48px 24px 28px;
  text-align:center;
  border-bottom:1px solid var(--border-soft);
}

.cafe-logo{
  width:76px;
  height:76px;
  object-fit:contain;
  border-radius:18px;
  margin:0 auto 16px;
  display:block;
  background:var(--surface);
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--accent-text);
  margin-bottom:14px;
}

h1.cafe-name{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:clamp(34px,9vw,52px);
  margin:0 0 10px;
  line-height:1.05;
  color:var(--ink);
}

.subtitle{
  color:var(--ink-muted);
  font-size:15px;
  max-width:420px;
  margin:0 auto;
  line-height:1.5;
}

nav.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:18px 20px;
  scrollbar-width:none;
  position:sticky;
  top:0;
  background:linear-gradient(var(--bg) 78%,transparent);
  z-index:5;
}

nav.tabs::-webkit-scrollbar{
  display:none;
}

.tab-btn{
  flex:0 0 auto;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  letter-spacing:.03em;
  padding:9px 16px;
  border-radius:999px;
  border:1px solid var(--border-soft);
  background:var(--surface);
  color:var(--ink-muted);
  cursor:pointer;
  transition:.18s ease;
  white-space:nowrap;
}

.tab-btn:hover{
  border-color:var(--accent);
  color:var(--ink);
}

.tab-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--button-text);
  font-weight:500;
}

.category-block{
  padding:6px 22px 8px;
}

.category-title{
  font-family:'Fraunces',serif;
  font-size:22px;
  font-weight:500;
  color:var(--accent-text);
  margin:22px 0 4px;
}

.steam-divider{
  width:100%;
  height:14px;
  margin:6px 0 14px;
  opacity:.5;
}

.item-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px dashed var(--border-soft);
}

.item-row:last-child{
  border-bottom:none;
}

.item-thumb{
  width:54px;
  height:54px;
  flex:0 0 auto;
  border-radius:10px;
  object-fit:cover;
  border:1px solid var(--border-soft);
  background:var(--surface-raised);
}

.item-text-row{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex:1;
  min-width:0;
}

.item-name-wrap{
  flex:0 1 auto;
  min-width:0;
}

.item-name{
  font-size:16px;
  font-weight:600;
  color:var(--ink);
}

.item-name.unavailable{
  color:var(--ink-faint);
  text-decoration:line-through;
}

.item-desc{
  font-size:12.5px;
  color:var(--ink-muted);
  margin-top:2px;
  line-height:1.4;
}

.leader{
  flex:1 1 auto;
  border-bottom:1px dotted var(--border-soft);
  height:0;
  margin:0 2px 5px;
  min-width:12px;
}

.item-price{
  font-family:'IBM Plex Mono',monospace;
  font-size:15px;
  color:var(--price);
  white-space:nowrap;
  flex:0 0 auto;
}

.item-price.unavailable{
  color:var(--ink-faint);
}

.sold-out-tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  color:var(--danger);
  letter-spacing:.08em;
  margin-left:6px;
}

footer.note{
  text-align:center;
  padding:36px 24px 10px;
  color:var(--ink-faint);
  font-size:11.5px;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.04em;
}

.ig-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--accent-text);
  text-decoration:none;
  font-size:13px;
  font-weight:500;
  margin-bottom:10px;
}

.admin-dot{
  position:fixed;
  bottom:18px;
  right:18px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--ink-faint);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:20;
  font-size:15px;
  box-shadow:0 2px 10px rgba(46,38,33,.12);
}

.admin-dot:hover{
  color:var(--accent-text);
  border-color:var(--accent);
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(46,38,33,.45);
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

@media(min-width:640px){
  .overlay{
    align-items:center;
  }
}

.panel{
  background:var(--surface);
  width:100%;
  max-width:560px;
  max-height:88vh;
  overflow-y:auto;
  border-radius:18px 18px 0 0;
  padding:26px 20px 30px;
  border:1px solid var(--border-soft);
}

@media(min-width:640px){
  .panel{
    border-radius:18px;
  }
}

.panel h2{
  font-family:'Fraunces',serif;
  font-size:24px;
  margin:0 0 18px;
  color:var(--accent-text);
}

.panel label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-muted);
  margin:14px 0 5px;
}

.panel input,
.panel textarea{
  width:100%;
  background:var(--surface-raised);
  border:1px solid var(--border-soft);
  border-radius:8px;
  padding:10px 12px;
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  font-size:14.5px;
}

.panel input:focus,
.panel textarea:focus{
  outline:2px solid var(--accent);
  outline-offset:1px;
}

.row-2{
  display:flex;
  gap:10px;
}

.row-2>div{
  flex:1;
}

.btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  padding:10px 16px;
  border-radius:8px;
  border:1px solid transparent;
  cursor:pointer;
  letter-spacing:.02em;
}

.btn-gold{
  background:var(--button);
  color:var(--button-text);
  font-weight:600;
}

.btn-ghost{
  background:var(--surface);
  border-color:var(--border-soft);
  color:var(--ink);
}

.btn-danger{
  background:var(--surface);
  border-color:var(--danger);
  color:var(--danger);
}

.btn-block{
  width:100%;
  display:block;
  text-align:center;
  margin-top:6px;
}

.item-edit-card{
  background:var(--surface-raised);
  border:1px solid var(--border-soft);
  border-radius:10px;
  padding:14px;
  margin-top:12px;
}

.cat-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:26px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border-soft);
}

.cat-header input{
  font-family:'Fraunces',serif;
  font-size:18px;
  color:var(--accent-text);
  border:none;
  background:transparent;
  padding:2px 0;
}

.avail-toggle{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--ink-muted);
  margin-top:10px;
  font-family:'IBM Plex Mono',monospace;
}

.avail-toggle input{
  width:auto;
}

.actions-row{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.status-msg{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--accent-text);
  margin-top:10px;
  min-height:16px;
}

.close-x{
  position:absolute;
  top:14px;
  right:16px;
  background:none;
  border:none;
  color:var(--ink-muted);
  font-size:20px;
  cursor:pointer;
}

.panel-rel{
  position:relative;
}

.loading{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
}

.img-row{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-top:6px;
}

.admin-thumb{
  width:64px;
  height:64px;
  border-radius:10px;
  object-fit:cover;
  flex:0 0 auto;
  border:1px solid var(--border-soft);
  background:var(--surface);
}

.img-controls{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.img-controls input[type="file"]{
  padding:6px;
  font-size:12.5px;
}

/* TEMA */

.theme-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.theme-color-row{
  background:var(--surface-raised);
  border:1px solid var(--border-soft);
  border-radius:10px;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.theme-color-row label{
  margin:0!important;
  font-family:'Work Sans',sans-serif!important;
  text-transform:none!important;
  letter-spacing:0!important;
  font-size:12px!important;
  color:var(--ink)!important;
}

.theme-color-row input[type="color"]{
  width:42px;
  height:34px;
  padding:2px;
  border:1px solid var(--border-soft);
  border-radius:7px;
  cursor:pointer;
  background:transparent;
}

@media(max-width:480px){
  .theme-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<script id="bakedData" type="application/json">null</script>

<div class="stains">
  <div class="stain s1"></div>
  <div class="stain s2"></div>
  <div class="stain s3"></div>
  <div class="stain s4"></div>
</div>

<div class="wrap" id="app">
  <div class="loading">menü yükleniyor…</div>
</div>

<div class="admin-dot"
     id="adminDot"
     title="Yönetim"
     role="button"
     tabindex="0"
     aria-label="Yönetim panelini aç">⚙</div>

<script>

const STORAGE_KEY='cafe-menu-data';
const PIN_KEY='cafe-admin-pin';
const DEFAULT_PIN='1234';

const BLANK_PIXEL=
'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';

function uid(){
  return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function defaultTheme(){
  return {
    bg:'#F6F1E2',
    surface:'#FFFFFF',
    surfaceRaised:'#ECE2C7',
    accent:'#1E6F4C',
    accentText:'#134A32',
    ink:'#20261D',
    inkMuted:'#6E6A52',
    inkFaint:'#A39F84',
    price:'#134A32',
    button:'#1E6F4C',
    buttonText:'#FBF7EA',
    border:'#CFC8B5',
    danger:'#A9433A'
  };
}

function defaultData(){
  return {
    cafeName:"Kahve Durağı",
    subtitle:"Taze demlenmiş kahve ve ev yapımı tatlılar — İnegöl'ün köşe başında.",
    logo:"",
    instagram:"",
    theme:defaultTheme(),

    categories:[
      {
        id:uid(),
        name:"Sıcak İçecekler",
        items:[
          {id:uid(),name:"Türk Kahvesi",desc:"Az / orta / şekerli",price:90,available:true,image:""},
          {id:uid(),name:"Filtre Kahve",desc:"Günün çekirdeği",price:110,available:true,image:""},
          {id:uid(),name:"Latte",desc:"Espresso, buharda süt",price:140,available:true,image:""},
          {id:uid(),name:"Cappuccino",desc:"Bol köpüklü",price:130,available:true,image:""},
          {id:uid(),name:"Sıcak Çikolata",desc:"Bitter, ev yapımı",price:120,available:true,image:""},
          {id:uid(),name:"Çay",desc:"Bardak",price:40,available:true,image:""}
        ]
      },

      {
        id:uid(),
        name:"Soğuk İçecekler",
        items:[
          {id:uid(),name:"Ice Latte",desc:"",price:150,available:true,image:""},
          {id:uid(),name:"Frappe",desc:"Buzlu, köpüklü",price:160,available:true,image:""},
          {id:uid(),name:"Limonata",desc:"Ev yapımı, nane",price:90,available:true,image:""},
          {id:uid(),name:"Soğuk Çay",desc:"Şeftali / limon",price:80,available:true,image:""}
        ]
      },

      {
        id:uid(),
        name:"Tatlılar",
        items:[
          {id:uid(),name:"Cheesecake",desc:"Meyve soslu",price:180,available:true,image:""},
          {id:uid(),name:"Brownie",desc:"Sıcak servis, dilerseniz dondurmalı",price:150,available:true,image:""},
          {id:uid(),name:"Kazandibi",desc:"",price:140,available:true,image:""},
          {id:uid(),name:"Sufle",desc:"Sıcak çikolatalı",price:170,available:true,image:""}
        ]
      },

      {
        id:uid(),
        name:"Atıştırmalıklar",
        items:[
          {id:uid(),name:"Tost",desc:"Kaşarlı",price:130,available:true,image:""},
          {id:uid(),name:"Sandviç",desc:"Günün seçenekleri",price:160,available:true,image:""},
          {id:uid(),name:"Kruvasan",desc:"",price:110,available:true,image:""},
          {id:uid(),name:"Kurabiye",desc:"İki adet",price:70,available:true,image:""}
        ]
      }
    ]
  };
}

let menuData=null;
let pin=DEFAULT_PIN;
let activeCatId=null;
let unlocked=false;

const app=document.getElementById('app');

function applyTheme(theme){

  const t=theme||defaultTheme();
  const root=document.documentElement.style;

  root.setProperty('--bg',t.bg||'#F6F1E2');
  root.setProperty('--surface',t.surface||'#FFFFFF');
  root.setProperty('--surface-raised',t.surfaceRaised||'#ECE2C7');
  root.setProperty('--accent',t.accent||'#1E6F4C');
  root.setProperty('--accent-text',t.accentText||'#134A32');
  root.setProperty('--ink',t.ink||'#20261D');
  root.setProperty('--ink-muted',t.inkMuted||'#6E6A52');
  root.setProperty('--ink-faint',t.inkFaint||'#A39F84');
  root.setProperty('--price',t.price||'#134A32');
  root.setProperty('--button',t.button||'#1E6F4C');
  root.setProperty('--button-text',t.buttonText||'#FBF7EA');
  root.setProperty('--border-soft',t.border||'#CFC8B5');
  root.setProperty('--danger',t.danger||'#A9433A');
}

async function loadAll(){

  let fromStorage=false;

  try{
    const res=await window.storage.get(STORAGE_KEY,true);

    if(res&&res.value){
      menuData=JSON.parse(res.value);
      fromStorage=true;
    }
  }catch(e){}

  if(!fromStorage){

    try{
      const baked=document.getElementById('bakedData');
      const raw=baked?baked.textContent.trim():'null';

      menuData=(raw&&raw!=='null')
        ?JSON.parse(raw)
        :defaultData();

    }catch(e){
      menuData=defaultData();
    }
  }

  if(!menuData.theme){
    menuData.theme=defaultTheme();
  }else{

    const old=menuData.theme;

    if(old.baseColor){

      const base=old.baseColor;

      menuData.theme={
        ...defaultTheme(),
        accent:base,
        button:base
      };

    }else{

      menuData.theme={
        ...defaultTheme(),
        ...old
      };
    }
  }

  menuData.categories.forEach(cat=>{
    cat.items.forEach(it=>{
      if(it.image===undefined)it.image="";
    });
  });

  if(menuData.logo===undefined)menuData.logo="";
  if(menuData.instagram===undefined)menuData.instagram="";

  applyTheme(menuData.theme);

  try{
    const p=await window.storage.get(PIN_KEY,true);
    pin=p&&p.value?p.value:DEFAULT_PIN;
  }catch(e){
    pin=DEFAULT_PIN;
  }

  if(menuData.categories.length){
    activeCatId=menuData.categories[0].id;
  }

  renderCustomer();
}

async function persistMenu(){

  try{
    await window.storage.set(
      STORAGE_KEY,
      JSON.stringify(menuData),
      true
    );

    return true;

  }catch(e){
    return false;
  }
}

async function persistPin(newPin){

  try{

    await window.storage.set(
      PIN_KEY,
      newPin,
      true
    );

    pin=newPin;

    return true;

  }catch(e){
    return false;
  }
}

function money(n){

  const num=Number(n)||0;

  return num.toLocaleString('tr-TR')+' ₺';
}

function steamSvg(){

  return `
  <svg class="steam-divider"
       viewBox="0 0 300 14"
       preserveAspectRatio="none">

    <path
      d="M0 7 Q15 0,30 7 T60 7 T90 7 T120 7 T150 7 T180 7 T210 7 T240 7 T270 7 T300 7"
      fill="none"
      stroke="var(--accent)"
      stroke-width="1.4"/>
  </svg>`;
}

function igIcon(){

  return `
  <svg viewBox="0 0 24 24"
       width="16"
       height="16"
       fill="none"
       stroke="currentColor"
       stroke-width="2">

    <rect x="3" y="3"
          width="18"
          height="18"
          rx="5"/>

    <circle cx="12"
            cy="12"
            r="4"/>

    <circle cx="17.5"
            cy="6.5"
            r="1"
            fill="currentColor"
            stroke="none"/>
  </svg>`;
}

function renderCustomer(){

  if(!menuData){

    app.innerHTML=
      '<div class="loading">menü yükleniyor…</div>';

    return;
  }

  const cats=menuData.categories;

  const active=
    cats.find(c=>c.id===activeCatId)||cats[0];

  const tabsHtml=cats.map(c=>`

    <button
      class="tab-btn ${c.id===active.id?'active':''}"
      data-cat="${c.id}">

      ${escapeHtml(c.name)}

    </button>

  `).join('');

  const itemsHtml=active
    ?active.items.map(it=>`

      <div class="item-row">

        ${
          it.image
          ?`
          <img
            class="item-thumb"
            src="${escapeAttr(it.image)}"
            alt="">
          `
          :''
        }

        <div class="item-text-row">

          <div class="item-name-wrap">

            <div class="item-name ${it.available?'':'unavailable'}">

              ${escapeHtml(it.name)}

              ${
                it.available
                ?''
                :'<span class="sold-out-tag">TÜKENDİ</span>'
              }

            </div>

            ${
              it.desc
              ?`<div class="item-desc">${escapeHtml(it.desc)}</div>`
              :''
            }

          </div>

          <div class="leader"></div>

          <div class="item-price ${it.available?'':'unavailable'}">
            ${money(it.price)}
          </div>

        </div>

      </div>

    `).join('')

    :'<div class="item-desc">Bu kategoride henüz ürün yok.</div>';

  app.innerHTML=`

    <header class="hero">

      ${
        menuData.logo
        ?`
        <img
          class="cafe-logo"
          src="${escapeAttr(menuData.logo)}"
          alt="${escapeAttr(menuData.cafeName)} logo">
        `
        :''
      }

      <div class="eyebrow">Menü</div>

      <h1 class="cafe-name">
        ${escapeHtml(menuData.cafeName)}
      </h1>

      <p class="subtitle">
        ${escapeHtml(menuData.subtitle)}
      </p>

    </header>

    <nav class="tabs">
      ${tabsHtml}

function escapeHtml(str){

  return String(str??'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );
}

function escapeAttr(str){

  return String(str??'').replace(/"/g,'&quot;');
}

function resizeImageFile(
  file,
  maxDim,
  quality,
  format
){

  format=format||'jpeg';

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=e=>{

      const img=new Image();

      img.onload=()=>{

        let w=img.width;
        let h=img.height;

        if(w>h&&w>maxDim){

          h=Math.round(h*maxDim/w);
          w=maxDim;

        }else if(h>=w&&h>maxDim){

          w=Math.round(w*maxDim/h);
          h=maxDim;

        }

        const canvas=document.createElement('canvas');

        canvas.width=w;
        canvas.height=h;

        const ctx=canvas.getContext('2d');

        ctx.drawImage(
          img,
          0,
          0,
          w,
          h
        );

        resolve(
          format==='png'
          ?canvas.toDataURL('image/png')
          :canvas.toDataURL('image/jpeg',quality)
        );
      };

      img.onerror=reject;

      img.src=e.target.result;
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}

            cat.items.filter(

            );

          renderAdmin(overlay);
        }

      });

  overlay

  function updateItem(id,field,value){

}
