/* =========================
   COLOR FUNCTIONS
========================= */

function hexToRgb(hex){

  const h = String(hex || '').replace('#','');

  const full =
    h.length === 3
      ? h.split('').map(c=>c+c).join('')
      : h;

  const num = parseInt(full,16);

  return {

    r:(num>>16)&255,

    g:(num>>8)&255,

    b:num&255

  };

}


function rgbToHex(r,g,b){

  return '#' +

    [r,g,b]

    .map(v =>
      Math.max(
        0,
        Math.min(
          255,
          Math.round(v)
        )
      )
      .toString(16)
      .padStart(2,'0')
    )

    .join('');

}


function lightenColor(hex,amount){

  try{

    const {r,g,b}=hexToRgb(hex);

    return rgbToHex(

      r+(255-r)*amount,

      g+(255-g)*amount,

      b+(255-b)*amount

    );

  }catch(e){

    return hex;

  }

}


function darkenColor(hex,amount){

  try{

    const {r,g,b}=hexToRgb(hex);

    return rgbToHex(

      r*(1-amount),

      g*(1-amount),

      b*(1-amount)

    );

  }catch(e){

    return hex;

  }

}


function hexToRgba(hex,alpha){

  try{

    const {r,g,b}=hexToRgb(hex);

    return `rgba(${r},${g},${b},${alpha})`;

  }catch(e){

    return `rgba(46,38,33,${alpha})`;

  }

}


/* =========================
   APPLY THEME
========================= */

function applyTheme(theme){

  if(!theme){

    theme=defaultTheme();

  }

  const background =
    theme.backgroundColor ||
    '#F6F1E2';

  const category =
    theme.categoryColor ||
    theme.baseColor ||
    '#1E6F4C';

  const text =
    theme.textColor ||
    '#20261D';

  const surfaceRaised =
    lightenColor(category,.83);

  const accentText =
    darkenColor(category,.32);

  const root =
    document.documentElement.style;

  root.setProperty(
    '--bg',
    background
  );

  root.setProperty(
    '--surface',
    '#FFFFFF'
  );

  root.setProperty(
    '--surface-raised',
    surfaceRaised
  );

  root.setProperty(
    '--accent',
    category
  );

  root.setProperty(
    '--accent-text',
    accentText
  );

  root.setProperty(
    '--ink',
    text
  );

  root.setProperty(
    '--ink-muted',
    hexToRgba(text,.68)
  );

  root.setProperty(
    '--ink-faint',
    hexToRgba(text,.42)
  );

  root.setProperty(
    '--border-soft',
    hexToRgba(text,.16)
  );

  root.setProperty(
    '--burgundy-bright',
    darkenColor(category,.12)
  );

  document
    .querySelector('meta[name="theme-color"]')
    ?.setAttribute(
      'content',
      category
    );

}


/* =========================
   LOAD
========================= */

async function loadAll(){

  let fromStorage=false;

  try{

    const res =
      await window.storage.get(
        STORAGE_KEY,
        true
      );

    if(res && res.value){

      menuData=
        JSON.parse(res.value);

      fromStorage=true;

    }

  }catch(e){}


  if(!fromStorage){

    try{

      const baked =
        document.getElementById(
          'bakedData'
        );

      const raw =
        baked
          ? baked.textContent.trim()
          : 'null';

      menuData =
        (
          raw &&
          raw!=='null'
        )
          ? JSON.parse(raw)
          : defaultData();

    }catch(e){

      menuData=defaultData();

    }

  }


  if(!menuData.categories){

    menuData.categories=[];

  }


  menuData.categories.forEach(cat=>{

    if(!cat.items){

      cat.items=[];

    }

    cat.items.forEach(it=>{

      if(it.image===undefined){

        it.image='';

      }

      if(it.available===undefined){

        it.available=true;

      }

    });

  });


  if(menuData.logo===undefined){

    menuData.logo=DEFAULT_LOGO;

  }


  if(menuData.instagram===undefined){

    menuData.instagram='';

  }


  /* Theme migration */

  if(!menuData.theme){

    menuData.theme=defaultTheme();

  }


  if(!menuData.theme.backgroundColor){

    menuData.theme.backgroundColor=
      '#F6F1E2';

  }


  if(!menuData.theme.categoryColor){

    menuData.theme.categoryColor=
      menuData.theme.baseColor ||
      '#1E6F4C';

  }


  if(!menuData.theme.textColor){

    menuData.theme.textColor=
      '#20261D';

  }


  if(!menuData.theme.baseColor){

    menuData.theme.baseColor=
      menuData.theme.categoryColor;

  }


  applyTheme(menuData.theme);


  try{

    const p =
      await window.storage.get(
        PIN_KEY,
        true
      );

    pin =
      p && p.value
        ? p.value
        : DEFAULT_PIN;

  }catch(e){

    pin=DEFAULT_PIN;

  }


  if(
    menuData.categories.length
  ){

    activeCatId=
      menuData.categories[0].id;

  }


  renderCustomer();

}

/* =========================
   DOWNLOAD
========================= */

async function downloadUpdatedFile(){

  const msg=
    document.getElementById(
      'adminMsg'
    );

  try{

    const res=
      await fetch(
        location.href,
        {
          cache:'no-store'
        }
      );

    if(!res.ok){

      throw new Error(
        'fetch failed'
      );

    }


    let html=
      await res.text();


    const jsonStr=
      JSON.stringify(
        menuData
      )
      .replace(
        /</g,
        '\\u003c'
      );


    const replaced=
      html.replace(

        /<script id="bakedData" type="application\/json">[\s\S]*?<\/script>/,

        `<script id="bakedData" type="application/json">${jsonStr}<\/script>`

      );


    if(replaced===html){

      throw new Error(
        'placeholder not found'
      );

    }


    const blob=
      new Blob(
        [replaced],
        {
          type:'text/html'
        }
      );


    const url=
      URL.createObjectURL(blob);


    const a=
      document.createElement('a');

    a.href=url;

    a.download=
      'katmerci-dayi-menu.html';

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(url);
      },
      2000
    );


    if(msg){

      msg.textContent=
        'Dosya indirildi. GitHub Pages üzerine tekrar yükleyebilirsin.';

    }


    return true;

  }catch(e){

    if(msg){

      msg.textContent=
        'Dosya indirilemedi. Sayfa http/https üzerinden açılmalı.';

    }

    return false;

  }

}

function escapeHtml(str){

  return String(
    str ?? ''
  ).replace(
    /[&<>"']/g,
    m=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[m])
  );

}


function escapeAttr(str){

  return String(
    str ?? ''
  ).replace(
    /"/g,
    '&quot;'
  );

}

/* =========================
   IMAGE RESIZE
========================= */

function resizeImageFile(
  file,
  maxDim,
  quality,
  format
){

  format=
    format || 'jpeg';


  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();


      reader.onload=e=>{

        const img=
          new Image();


        img.onload=()=>{

          let w=img.width;

          let h=img.height;


          if(
            w>h &&
            w>maxDim
          ){

            h=
              Math.round(
                h*maxDim/w
              );

            w=maxDim;

          }

          else if(
            h>=w &&
            h>maxDim
          ){

            w=
              Math.round(
                w*maxDim/h
              );

            h=maxDim;

          }


          const canvas=
            document.createElement(
              'canvas'
            );


          canvas.width=w;

          canvas.height=h;


          const ctx=
            canvas.getContext(
              '2d'
            );


          ctx.drawImage(
            img,
            0,
            0,
            w,
            h
          );


          resolve(

            format==='png'

              ? canvas.toDataURL(
                  'image/png'
                )

              : canvas.toDataURL(
                  'image/jpeg',
                  quality
                )

          );

        };


        img.onerror=reject;

        img.src=e.target.result;

      };


      reader.onerror=reject;

      reader.readAsDataURL(file);

    }
  );

}

            menuData.categories.find(
              c=>
                c.id===
                btn.dataset.catOf
            );


          if(cat){

            cat.items=
              cat.items.filter(
                i=>
                  i.id!==
                  btn.dataset.delItem
              );


            renderAdmin(overlay);

          }

        }
      );

    });


  /* =========================
     ADD PRODUCT
  ========================= */

  overlay
    .querySelectorAll('[data-add-item]')
    .forEach(btn=>{

      btn.addEventListener(
        'click',
        ()=>{

          const cat=
            menuData.categories.find(
              c=>
                c.id===
                btn.dataset.addItem
            );


          if(cat){

            cat.items.push({

              id:uid(),

              name:'Yeni ürün',

              desc:'',

              price:0,

              available:true,

              image:''

            });


            renderAdmin(overlay);

          }

        }
      );

    });


  /* =========================
     PRODUCT IMAGE
  ========================= */

  overlay
    .querySelectorAll('[data-img-file]')
    .forEach(inp=>{

      inp.addEventListener(
        'change',
        async ()=>{

          const file=
            inp.files &&
            inp.files[0];


          if(!file)return;


          const msg=
            document.getElementById(
              'adminMsg'
            );


          try{

            const dataUrl=
              await resizeImageFile(
                file,
                480,
                .72
              );


            updateItem(
              inp.dataset.imgFile,
              'image',
              dataUrl
            );


            renderAdmin(overlay);

          }catch(e){

            if(msg){

              msg.textContent=
                'Görsel yüklenemedi.';

            }

          }

        }
      );

    });


  /* =========================
     PRODUCT IMAGE URL
  ========================= */

  overlay
    .querySelectorAll('[data-img-url]')
    .forEach(inp=>{

      inp.addEventListener(
        'input',
        ()=>{

          const val=
            inp.value.trim();


          updateItem(
            inp.dataset.imgUrl,
            'image',
            val
          );


          const preview=
            overlay.querySelector(
              `[data-img-preview="${inp.dataset.imgUrl}"]`
            );


          if(preview){

            preview.src=
              val ||
              BLANK_PIXEL;

          }

        }
      );

    });


  /* =========================
     REMOVE PRODUCT IMAGE
  ========================= */

  overlay
    .querySelectorAll('[data-img-remove]')
    .forEach(btn=>{

      btn.addEventListener(
        'click',
        ()=>{

          updateItem(
            btn.dataset.imgRemove,
            'image',
            ''
          );


          renderAdmin(overlay);

        }
      );

    });


  /* =========================
     ADD CATEGORY
  ========================= */

  document
    .getElementById('addCatBtn')
    .addEventListener(
      'click',
      ()=>{

        menuData.categories.push({

          id:uid(),

          name:'Yeni kategori',

          items:[]

        });


        renderAdmin(overlay);

      }
    );


  /* =========================
     BUSINESS NAME
  ========================= */

  document
    .getElementById('cafeNameInput')
    .addEventListener(
      'input',
      e=>{

        menuData.cafeName=
          e.target.value;

      }
    );


  /* =========================
     SUBTITLE
  ========================= */

  document
    .getElementById('cafeSubtitleInput')
    .addEventListener(
      'input',
      e=>{

        menuData.subtitle=
          e.target.value;

      }
    );


  /* =========================
     INSTAGRAM
  ========================= */

  document
    .getElementById('instagramInput')
    .addEventListener(
      'input',
      e=>{

        menuData.instagram=
          e.target.value
            .trim()
            .replace(/^@/,'');

      }
    );


  /* =========================
     LOGO FILE
  ========================= */

  document
    .getElementById('logoFile')
    .addEventListener(
      'change',
      async e=>{

        const file=
          e.target.files &&
          e.target.files[0];


        if(!file)return;


        const msg=
          document.getElementById(
            'adminMsg'
          );


        try{

          const dataUrl=
            await resizeImageFile(
              file,
              600,
              .9,
              'png'
            );


          menuData.logo=
            dataUrl;


          renderAdmin(overlay);

        }catch(err){

          if(msg){

            msg.textContent=
              'Logo yüklenemedi.';

          }

        }

      }
    );


  /* =========================
     LOGO URL
  ========================= */

  document
    .getElementById('logoUrl')
    .addEventListener(
      'input',
      e=>{

        const val=
          e.target.value.trim();


        menuData.logo=
          val;


        const preview=
          document.getElementById(
            'logoPreview'
          );


        if(preview){

          preview.src=
            val ||
            BLANK_PIXEL;

        }

      }
    );


  /* =========================
     REMOVE LOGO
  ========================= */

  document
    .getElementById('logoRemove')
    .addEventListener(
      'click',
      ()=>{

        menuData.logo='';

        renderAdmin(overlay);

      }
    );


  /* =========================
     BACKGROUND COLOR
  ========================= */

  document
    .getElementById('backgroundColor')
    .addEventListener(
      'input',
      e=>{

        menuData.theme.backgroundColor=
          e.target.value;


        applyTheme(
          menuData.theme
        );

      }
    );


  /* =========================
     CATEGORY COLOR
  ========================= */

  document
    .getElementById('categoryColor')
    .addEventListener(
      'input',
      e=>{

        menuData.theme.categoryColor=
          e.target.value;


        menuData.theme.baseColor=
          e.target.value;


        applyTheme(
          menuData.theme
        );

      }
    );


  /* =========================
     TEXT COLOR
  ========================= */

  document
    .getElementById('textColor')
    .addEventListener(
      'input',
      e=>{

        menuData.theme.textColor=
          e.target.value;


        applyTheme(
          menuData.theme
        );

      }
    );


  /* =========================
     RESET COLORS
  ========================= */

  document
    .getElementById('resetThemeBtn')
    .addEventListener(
      'click',
      ()=>{

        menuData.theme=
          defaultTheme();


        applyTheme(
          menuData.theme
        );


        renderAdmin(overlay);

      }
    );


  /* =========================
     CHANGE PIN
  ========================= */

  document
    .getElementById('changePinBtn')
    .addEventListener(
      'click',
      async ()=>{

        const val=
          document
            .getElementById(
              'newPinInput'
            )
            .value
            .trim();


        const msg=
          document.getElementById(
            'adminMsg'
          );


        if(val.length<4){

          msg.textContent=
            'PIN en az 4 haneli olmalı.';

          return;

        }


        const ok=
          await persistPin(val);


        msg.textContent=
          ok
            ? 'PIN güncellendi.'
            : 'PIN kaydedilemedi.';

      }
    );


  /* =========================
     DOWNLOAD
  ========================= */

  document
    .getElementById('downloadFileBtn')
    .addEventListener(
      'click',
      async ()=>{

        const msg=
          document.getElementById(
            'adminMsg'
          );


        msg.textContent=
          'hazırlanıyor…';


        await downloadUpdatedFile();

      }
    );


  /* =========================
     SAVE
  ========================= */

  document
    .getElementById('saveMenuBtn')
    .addEventListener(
      'click',
      async ()=>{

        const msg=
          document.getElementById(
            'adminMsg'
          );


        msg.textContent=
          'kaydediliyor…';


        const ok=
          await persistMenu();


        if(ok){

          msg.textContent=
            'Kaydedildi ✓';


          setTimeout(
            ()=>{

              overlay.remove();

              adminOpen=false;


              if(
                menuData.categories.length &&
                !menuData.categories.find(
                  c=>
                    c.id===activeCatId
                )
              ){

                activeCatId=
                  menuData.categories[0].id;

              }


              renderCustomer();

            },
            500
          );

        }else{

          msg.textContent=
            'Kaydedilemedi. Güncellenmiş dosyayı indirerek devam edebilirsin.';

        }

      }
    );


  /* =========================
     UPDATE ITEM
  ========================= */

  function updateItem(
    id,
    field,
    value
  ){

    for(
      const cat
      of menuData.categories
    ){

      const it=
        cat.items.find(
          i=>i.id===id
        );


      if(it){

        it[field]=value;

        return;

      }

    }

  }

}


/* =========================
   START
========================= */

loadAll();

</script>

</body>
</html>
