<style>

/* =====================================================
   TEMEL RENKLER
===================================================== */

:root{

  --bg:#17120F;
  --header:#1B1511;

  --surface:#241C16;
  --surface2:#2B211A;

  --text:#F5EBDD;
  --muted:#B9AC9A;

  --category:#7C875A;
  --categoryText:#FFFFFF;

  --price:#D1A45C;

  --button:#C69A57;
  --buttonText:#17120F;

  --border:#59452D;

  --tab:#201913;
  --tabBorder:#654C2E;
  --tabActive:#C69A57;

  --logoSize:108px;
  --logoTop:0px;
}


/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  -webkit-text-size-adjust:100%;
}

body{
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:var(--text);

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
}

button,
input{
  font-family:inherit;
}


/* =====================================================
   APP
===================================================== */

#app{
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
}


/* =====================================================
   LOADING
===================================================== */

.loading{
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--bg);

  color:var(--muted);

  font-size:14px;
}


/* =====================================================
   HERO
===================================================== */

  width:100%;

  text-align:center;

  padding:

    28px;

  background:
    radial-gradient(

      rgba(198,154,87,.08),
      transparent 38%

      180deg,

      var(--bg)

    1px solid
    rgba(180,135,70,.45);
}


/* =====================================================
   LOGO
===================================================== */

/* =====================================================
   MENÜ
===================================================== */

/* =====================================================
   ALT BAŞLIK

/* =====================================================

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://cwofalezjvuxppmwipmc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n9xGFNX-fwl4C-BFLBGmeg_hsKy9GtU";

const MENU_ID =
"00000000-0000-0000-0000-000000000001";


let menuData = null;

let activeCatId = null;

let unlocked = false;

let currentPin = "";


/* =====================================================
   SUPABASE API
===================================================== */

async function api(
  path,
  options={}
){

  const response =
    await fetch(
      SUPABASE_URL + path,
      {

        ...options,

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Accept":
            "application/json"

        }

      }
    );


  const text =
    await response.text();


  let data = null;


  try{

    data =
      text
      ? JSON.parse(text)
      : null;

  }
  catch{

    data = text;

  }


  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error ||
      text ||
      "Supabase hatası"
    );

  }


  return data;

}


/* =====================================================
   RPC
===================================================== */

async function rpc(
  name,
  args
){

  return await api(
    "/rest/v1/rpc/" + name,
    {

      method:"POST",

      body:
        JSON.stringify(args)

    }
  );

}


/* =====================================================
   MENÜ YÜKLE
===================================================== */

async function loadMenu(){

  try{

    const rows =
      await api(
        "/rest/v1/menus?id=eq." +
        MENU_ID +
        "&select=id,data"
      );


    if(
      !rows ||
      !rows.length
    ){

      throw new Error(
        "Menü kaydı bulunamadı."
      );

    }


    menuData =
      normalize(
        rows[0].data
      );


    activeCatId =
      menuData.categories[0]?.id ||
      null;


    render();

  }
  catch(error){

    console.error(error);


    document.getElementById(
      "app"
    ).innerHTML = `

      <div
        style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:25px;
          text-align:center;
          background:#17120F;
          color:#F5EBDD;
        "
      >

        <div>

          <h2>
            Menü yüklenemedi
          </h2>

          <p
            style="
              color:#B9AC9A;
              font-size:13px;
            "
          >
            ${escapeHTML(
              error.message
            )}
          </p>

          <button
            onclick="location.reload()"
            style="
              border:0;
              border-radius:10px;
              padding:11px 18px;
              background:#C69A57;
              color:#17120F;
              font-weight:bold;
            "
          >
            Tekrar Dene
          </button>

        </div>

      </div>

    `;

  }

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(data){

  const d =
    data || {};


  return{

    cafeName:
      d.cafeName ||
      "Katmerci Dayı",

    subtitle:
      d.subtitle ||
      "Gaziantepten gelen lezzet",

    logo:
      d.logo ||
      "",

    logoSize:
      Number(d.logoSize) ||
      108,

    logoTop:
      Number(d.logoTop) ||
      0,

    theme:
      d.theme ||
      {},

    categories:
      Array.isArray(
        d.categories
      )
      ? d.categories
      : []

  };

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    })[char]
  );

}


/* =====================================================
   PARA
===================================================== */

function money(value){

  return(
    Number(value) || 0
  )
  .toLocaleString(
    "tr-TR"
  ) + " ₺";

}


/* =====================================================
   TEMA
===================================================== */

function applyTheme(){

  const t =
    menuData.theme || {};

  const root =
    document.documentElement;


  const colors = {

    "--bg":
      t.background ||
      "#17120F",

    "--header":
      t.header ||
      "#1B1511",

    "--surface":
      t.surface ||
      "#241C16",

    "--surface2":
      t.surface2 ||
      "#2B211A",

    "--text":
      t.text ||

function render(){

  if(!menuData)
    return;


  applyTheme();


  const categories =
    menuData.categories || [];


  let active =
    categories.find(
      c =>
        c.id ===
        activeCatId
    );


  if(!active){

    active =
      categories[0];

    activeCatId =
      active?.id ||
      null;

  }


  const tabs =
    categories
      .map(
        cat => `

          <button
            class="tab-btn ${
              cat.id === active?.id
              ? "active"
              : ""
            }"
            data-cat="${escapeHTML(cat.id)}"

            ${escapeHTML(cat.name)}

      .join("");

  document

/* =====================================================
   TOAST
===================================================== */

function toast(message){

  const el =
    document.getElementById(
      "toast"
    );


  el.textContent =
    message;


  el.style.display =
    "block";


  clearTimeout(
    window.__toast
  );


  window.__toast =
    setTimeout(
      () => {

        el.style.display =
          "none";

      },
      2300
    );

}


/* =====================================================
   PIN GİRİŞİ
===================================================== */

function openPin(){

  if(unlocked){

    openAdmin();

    return;

  }


  const overlay =
    document.createElement(
      "div"
    );


  overlay.className =
    "overlay";


  overlay.innerHTML = `

    <div
      class="panel"
    >

      <h2>
        ⚙️ Yönetim
      </h2>


      <label>
        PIN
      </label>


      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        placeholder="PIN kodunu gir"
      >


      <div
        id="pinMsg"
        class="status-msg"
      ></div>


      <button
        id="pinButton"
        class="btn btn-main btn-block"
      >
        Giriş Yap
      </button>


      <button
        id="pinCancel"
        class="btn btn-ghost btn-block"
      >
        İptal
      </button>

    </div>

  `;


  document.body.appendChild(
    overlay
  );


  overlay.querySelector(
    "#pinCancel"
  ).onclick =
    () => {

      overlay.remove();

    };


  const login =
    async() => {

      const pin =
        overlay.querySelector(
          "#pinInput"
        ).value.trim();


      const msg =
        overlay.querySelector(
          "#pinMsg"
        );


      if(!pin){

        msg.textContent =
          "PIN gir.";

        return;

      }


      msg.textContent =
        "Kontrol ediliyor...";


      try{

        const result =
          await rpc(
            "check_menu_pin",
            {

              p_menu_id:
                MENU_ID,

              p_pin:
                pin

            }
          );


        const ok =
          result === true ||
          result === "true" ||
          result?.[0] === true ||
          result?.result === true;


        if(!ok){

          msg.textContent =
            "PIN yanlış.";

          return;

        }


        unlocked =
          true;

        currentPin =
          pin;


        overlay.remove();

        openAdmin();

      }
      catch(error){

        msg.textContent =
          error.message;

      }

    };


  overlay.querySelector(
    "#pinButton"
  ).onclick =
    login;


  overlay.querySelector(
    "#pinInput"
  ).onkeydown =
    e => {

      if(e.key === "Enter")
        login();

    };


  setTimeout(
    () => {

      overlay.querySelector(
        "#pinInput"
      ).focus();

    },
    100
  );

}

                "item-" +
                Date.now(),

              name:
                "Yeni ürün",

              desc:
                "",

              price:
                0,

              image:
                "",

              available:
                true

            });


            renderAdmin();

          };

      }
    );


  /* =================================================
     KATEGORİ SİL
  ================================================= */

  overlay
    .querySelectorAll(
      "[data-delete-cat]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            menuData.categories =
              menuData.categories.filter(
                x =>
                  x.id !==
                  button.dataset.deleteCat
              );


            activeCatId =
              menuData.categories[0]?.id ||
              null;


            renderAdmin();

          };

      }
    );


  /* =================================================
     KATEGORİ EKLE
  ================================================= */

  overlay.querySelector(
    "#addCategory"
  ).onclick =
    () => {

      menuData.categories.push({

        id:
          "cat-" +
          Date.now(),

        name:
          "Yeni kategori",

        items:
          []

      });


      renderAdmin();

    };


  /* =================================================
     KAYDET
  ================================================= */

  overlay.querySelector(
    "#saveButton"
  ).onclick =
    saveMenu;


  /* =================================================
     KAPAT
  ================================================= */

  overlay.querySelector(
    "#closeAdmin"
  ).onclick =
    () => {

      overlay.remove();

      render();

    };

}


/* =====================================================
   RENK AYARLARI
===================================================== */

function setupColors(overlay){

  const map = {

    bgColor:
      "background",

    headerColor:
      "header",

    surfaceColor:
      "surface",

    surface2Color:
      "surface2",

    textColor:
      "text",

    mutedColor:
      "mutedText",

    priceColor:
      "price",

    buttonColor:
      "button",

    borderColor:
      "border",

    tabColor:
      "tab",

    tabBorderColor:
      "tabBorder",

    tabActiveColor:
      "tabActive"

  };


  Object.entries(map)
    .forEach(
      ([id,key]) => {

        const color =
          overlay.querySelector(
            "#" + id
          );


        const hex =
          overlay.querySelector(
            "#" + id + "Hex"
          );


        if(!color || !hex)
          return;


        color.oninput =
          e => {

            const value =
              e.target.value.toUpperCase();


            hex.value =
              value;


            menuData.theme =
              menuData.theme || {};


            menuData.theme[key] =
              value;


            applyTheme();

            render();

          };


        hex.oninput =
          e => {

            let value =
              e.target.value.trim();


            if(
              !value.startsWith("#")
            ){

              value =
                "#" + value;

            }


            if(
              /^#[0-9A-Fa-f]{6}$/
              .test(value)
            ){

              value =
                value.toUpperCase();


              color.value =
                value;


              menuData.theme =
                menuData.theme || {};


              menuData.theme[key] =
                value;


              applyTheme();

              render();

            }

          };

      }
    );

}

/* =====================================================
   GÖRSEL SIKIŞTIR
===================================================== */

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              const max =
                800;


              let width =
                img.width;

              let height =
                img.height;


              if(width > max){

                height =
                  Math.round(
                    height *
                    max /
                    width
                  );

                width =
                  max;

              }


              if(height > max){

                width =
                  Math.round(
                    width *
                    max /
                    height
                  );

                height =
                  max;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const result =
                canvas.toDataURL(
                  "image/webp",
                  .82
                );


              resolve(result);

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}

function findItem(id){

  for(
    const cat of
    menuData.categories
  ){

    const item =
      (cat.items || [])
        .find(
          x =>
            x.id === id
        );


    if(item)
      return item;

  }


  return null;

}

async function saveMenu(){

  const overlay =
    document.getElementById(
      "adminOverlay"
    );


  const button =
    overlay.querySelector(
      "#saveButton"
    );


  const msg =
    overlay.querySelector(
      "#saveMsg"
    );


  button.disabled =
    true;


  button.textContent =
    "⏳ Kaydediliyor...";


  msg.textContent =
    "Supabase'e gönderiliyor...";


  try{

    const result =
      await rpc(
        "save_menu",
        {

          p_menu_id:
            MENU_ID,

          p_pin:
            currentPin,

          p_data:
            menuData

        }
      );


    if(
      result === false ||
      result === "false"
    ){

      throw new Error(
        "Supabase kaydetmeyi reddetti."
      );

    }


    msg.textContent =
      "Başarıyla kaydedildi ✓";


    button.textContent =
      "✓ KAYDEDİLDİ";


    setTimeout(
      () => {

        overlay.remove();

        render();

        toast(
          "Menü kaydedildi ✓"
        );

      },
      800
    );

  }
  catch(error){

    console.error(error);


    msg.textContent =
      "Hata: " +
      error.message;


    button.disabled =
      false;

    button.textContent =
      "💾 KAYDET";

  }

}
