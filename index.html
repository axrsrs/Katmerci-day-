<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://cwofalezjvuxppmwipmc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n9xGFNXF-wl4C-BFLBGmeg_hsKy9GtU";

const MENU_ID =
"00000000-0000-0000-0000-000000000001";


/* =====================================================
   DURUM
===================================================== */

let menuData=null;

let activeCatId=null;

let unlocked=false;

let currentPin="";


const app=
document.getElementById("app");


const BLANK=
"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";


/* =====================================================
   API
===================================================== */

async function api(path,options={}){

const response=
await fetch(
SUPABASE_URL+path,
{

...options,

headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY,
"Content-Type":
"application/json",
"Accept":
"application/json"
}

}
);

const text=
await response.text();

let data=null;

try{

data=
text
?JSON.parse(text)
:null;

}catch{

data=text;

}

if(!response.ok){

throw new Error(
data?.message||
data?.error||
text||
"Supabase hatası"
);

}

return data;

}


/* =====================================================
   RPC
===================================================== */

async function rpc(name,args){

return await api(
"/rest/v1/rpc/"+name,
{
method:"POST",
body:JSON.stringify(args)
}
);

}


/* =====================================================
   MENÜYÜ AL
===================================================== */

async function loadMenu(){

try{

const rows=
await api(
"/rest/v1/menus?id=eq."+
MENU_ID+
"&select=id,data"
);

if(!rows||!rows.length){

throw new Error(
"Menü kaydı bulunamadı."
);

}

menuData=
normalize(
rows[0].data
);

activeCatId=
menuData.categories[0]?.id||
null;

render();

}catch(error){

console.error(error);

app.innerHTML=`

<div
style="
min-height:100vh;
background:#17120F;
color:#F5EBDD;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
"
>

<div>

<h2>Menü yüklenemedi</h2>

<p>
${escapeHTML(error.message)}
</p>

<button
onclick="location.reload()"
style="
background:#C69A57;
border:0;
padding:13px 22px;
border-radius:12px;
"
>
Tekrar dene
</button>

</div>

</div>

`;

}

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(data){

const d=data||{};

return{

cafeName:
d.cafeName||
"Katmerci Dayı",

subtitle:
d.subtitle||
"Gaziantepten gelen lezzet",

logo:
d.logo||
"",

theme:
d.theme||
{},

categories:
Array.isArray(d.categories)
?d.categories
:[]

};

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

return String(value??"")
.replace(
/[&<>"']/g,
function(char){

return{
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char];

}
);

}


/* =====================================================
   PARA
===================================================== */

function money(value){

return(
Number(value)||0
).toLocaleString(
"tr-TR"
)+" ₺";

}


/* =====================================================
   TEMA
===================================================== */

function applyTheme(theme){

if(!theme)return;

const root=
document.documentElement;


const map={

background:
"--bg",

header:
"--header",

categoryBg:
"--green",

categoryText:
"--cream",

text:
"--cream",

mutedText:
"--muted",

price:
"--price",

button:
"--gold",

border:
"--border",

tabBg:
"--surface",

tabText:
"--muted",

tabActive:
"--gold"

};


Object.entries(map)
.forEach(
([key,css])=>{

if(theme[key]){

root.style.setProperty(
css,
theme[key]
);

}

});

}


/* =====================================================
   RENDER
===================================================== */

function render(){

if(!menuData)return;

applyTheme(
menuData.theme
);


const cats=
menuData.categories||[];


let active=
cats.find(
cat=>
cat.id===
activeCatId
);


if(!active){

active=cats[0];

activeCatId=
active?.id||
null;

}


const tabs=
cats.map(
cat=>`

<button
class="tab-btn ${
cat.id===active?.id
?"active":""
}"

/* =====================================================

===================================================== */

function toast(message){

const el=
document.getElementById("toast");

el.textContent=message;

el.style.display="block";

clearTimeout(
window.__toast
);

window.__toast=
setTimeout(
()=>{
el.style.display="none";
},
2500
);

}


/* =====================================================
   PIN
===================================================== */

function openPin(){

if(unlocked){

openAdmin();

return;

}


const overlay=
document.createElement("div");

overlay.className="overlay";

overlay.innerHTML=`

<div class="panel">

<h2>
Yönetim Girişi
</h2>


<label>
PIN
</label>


<input
id="pinInput"
type="password"
inputmode="numeric"
placeholder="PIN kodu"
>


<div
id="pinMsg"
class="status-msg"
></div>


<button
id="pinButton"
class="btn btn-main btn-block"
>
Giriş yap
</button>


<button
id="pinCancel"
class="btn btn-ghost btn-block"
>
İptal
</button>

</div>

`;

document.body.appendChild(
overlay
);


overlay.querySelector(
"#pinCancel"
).onclick=()=>{
overlay.remove();
};


const login=async()=>{

const pin=
overlay.querySelector(
"#pinInput"
).value.trim();


const msg=
overlay.querySelector(
"#pinMsg"
);


if(!pin){

msg.textContent=
"PIN gir.";

return;

}


msg.textContent=
"Kontrol ediliyor...";


try{

const result=
await rpc(
"check_menu_pin",
{
p_menu_id:MENU_ID,
p_pin:pin
}
);


const ok=
result===true||
result==="true"||
result?.[0]===true||
result?.result===true;


if(!ok){

msg.textContent=
"Hatalı PIN.";

return;

}


unlocked=true;

currentPin=pin;

overlay.remove();

openAdmin();


}catch(error){

msg.textContent=
error.message;

}

};


overlay.querySelector(
"#pinButton"
).onclick=login;


overlay.querySelector(
"#pinInput"
).onkeydown=e=>{

if(e.key==="Enter")
login();

};

setTimeout(
()=>{
overlay.querySelector(
"#pinInput"
).focus();
},
100
);

}
