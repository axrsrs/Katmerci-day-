<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1E6F4C">
<title>Katmerci Dayı | Menü</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
--bg:#F6F1E2;
--surface:#fff;
--raised:#ECE2C7;
--accent:#1E6F4C;
--accentText:#134A32;
--ink:#20261D;
--muted:#6E6A52;
--border:rgba(46,38,33,.14);
}

*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
}

body{
background:var(--bg);
color:var(--ink);
font-family:'Work Sans',sans-serif;
min-height:100vh;
transition:.25s;
}

button,input{font:inherit}

.wrap{
max-width:640px;
margin:auto;
padding-bottom:80px;
}

.hero{
text-align:center;
padding:45px 22px 28px;
border-bottom:1px solid var(--border);
}

.logo{
width:115px;
height:115px;
object-fit:contain;
border-radius:50%;
display:block;
margin:0 auto 18px;
background:#fff;
border:1px solid var(--border);
box-shadow:0 8px 30px #0001;
}

.eyebrow{
font:11px 'IBM Plex Mono';
letter-spacing:.25em;
text-transform:uppercase;
color:var(--accentText);
margin-bottom:12px;
}

h1{
font:600 clamp(35px,9vw,52px) Fraunces,serif;
margin:0 0 10px;
line-height:1.05;
}

.subtitle{
margin:auto;
max-width:430px;
color:var(--muted);
line-height:1.5;
}

.tabs{
display:flex;
gap:8px;
overflow-x:auto;
padding:16px 18px;
position:sticky;
top:0;
z-index:10;
background:linear-gradient(var(--bg) 80%,transparent);
scrollbar-width:none;
}

.tabs::-webkit-scrollbar{display:none}

.tab{
flex:0 0 auto;
border:1px solid var(--border);
background:var(--surface);
color:var(--muted);
border-radius:999px;
padding:9px 15px;
font:12px 'IBM Plex Mono';
cursor:pointer;
}

.tab.active{
background:var(--tab);
border-color:var(--tab);
color:#fff;
}

.category{
padding:8px 20px;
}

.category h2{
font:500 23px Fraunces,serif;
margin:18px 0 5px;
}

.line{
height:12px;
width:100%;
opacity:.55;
}

.item{
display:flex;
align-items:center;
gap:12px;
padding:13px 0;
border-bottom:1px dashed var(--border);
}

.thumb{
width:55px;
height:55px;
border-radius:10px;
object-fit:cover;
border:1px solid var(--border);
background:var(--raised);
}

.itemContent{
display:flex;
align-items:baseline;
gap:8px;
width:100%;
min-width:0;
}

.itemName{
font-weight:600;
font-size:16px;
}

.desc{
font-size:12px;
color:var(--muted);
margin-top:3px;
}

.leader{
flex:1;
border-bottom:1px dotted var(--border);
}

.price{
white-space:nowrap;
font:15px 'IBM Plex Mono';
color:var(--accentText);
}

.sold{
font:10px 'IBM Plex Mono';
color:#A94444;
margin-left:5px;
}

footer{
text-align:center;
padding:35px 20px;
color:var(--muted);
font:11px 'IBM Plex Mono';
}

.instagram{
display:inline-block;
color:var(--accentText);
text-decoration:none;
margin-bottom:10px;
}

.admin{
position:fixed;
right:18px;
bottom:18px;
z-index:30;
width:38px;
height:38px;
border-radius:50%;
border:1px solid var(--border);
background:var(--surface);
cursor:pointer;
box-shadow:0 3px 12px #0002;
}

.overlay{
position:fixed;
inset:0;
background:#0007;
z-index:100;
display:flex;
align-items:flex-end;
justify-content:center;
}

.panel{
width:100%;
max-width:570px;
max-height:92vh;
overflow-y:auto;
background:var(--surface);
border-radius:20px 20px 0 0;
padding:25px 20px 35px;
position:relative;
}

@media(min-width:650px){
.overlay{align-items:center}
.panel{border-radius:20px}
}

.close{
position:absolute;
right:16px;
top:12px;
border:0;
background:none;
font-size:22px;
cursor:pointer;
color:var(--muted);
}

.panel h2{
font:600 25px Fraunces,serif;
color:var(--accentText);
margin:0 0 20px;
}

label{
display:block;
font:11px 'IBM Plex Mono';
color:var(--muted);
margin:15px 0 6px;
}

input[type=text],
input[type=password],
input[type=number]{
width:100%;
padding:11px 12px;
border-radius:9px;
border:1px solid var(--border);
background:var(--raised);
color:var(--ink);
outline:none;
}

input:focus{
border-color:var(--accent);
}

.colorBox{
display:flex;
align-items:center;
gap:10px;
padding:9px;
border:1px solid var(--border);
border-radius:9px;
background:var(--raised);
}

input[type=color]{
width:55px;
height:36px;
padding:0;
border:0;
background:none;
}

.btn{
border:1px solid var(--border);
border-radius:9px;
padding:11px 15px;
cursor:pointer;
background:var(--surface);
color:var(--ink);
}

.btn.green{
background:var(--accent);
color:#fff;
border-color:var(--accent);
font-weight:600;
}

.btn.red{
color:#A9433A;
border-color:#A9433A;
}

.full{
width:100%;
margin-top:10px;
}

.cat{
margin-top:25px;
padding-top:15px;
border-top:1px solid var(--border);
}

.catHead{
display:flex;
gap:8px;
align-items:center;
}

.catHead input{font:18px Fraunces,serif}

.card{
margin-top:12px;
padding:14px;
background:var(--raised);
border:1px solid var(--border);
border-radius:12px;
}

.actions{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap;
}

.preview{
width:65px;
height:65px;
object-fit:cover;
border-radius:10px;
background:#fff;
border:1px solid var(--border);
}

.status{
font:12px 'IBM Plex Mono';
color:var(--accentText);
min-height:20px;
margin-top:12px;
text-align:center;
}

.loading{
padding:80px 20px;
text-align:center;
font:13px 'IBM Plex Mono';
color:var(--muted);
}
</style>
</head>

<body>

<div id="app">
<div class="loading">Menü yükleniyor…</div>
</div>

<button class="admin" id="adminBtn">⚙</button>

<script>

/* =====================================================

===================================================== */

/* =====================================================

/* =====================================================
   GLOBAL
===================================================== */

let menuData=null;
let activeCategory=null;
let unlocked=false;

const app=document.getElementById("app");


/* =====================================================
   HELPERS
===================================================== */

function esc(v){

return String(v ?? "")
.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m]));

}

function money(v){

return Number(v||0)
.toLocaleString("tr-TR")+" ₺";

}

function hexRgb(hex){

hex=String(hex||"")
.replace("#","");

if(hex.length===3)
hex=hex.split("").map(x=>x+x).join("");

let n=parseInt(hex,16);

return {
r:n>>16&255,
g:n>>8&255,
b:n&255
};

}

function dark(hex){

try{

let c=hexRgb(hex);

return "#"+
[c.r*.65,c.g*.65,c.b*.65]
.map(x=>Math.round(x).toString(16).padStart(2,"0"))
.join("");

}catch{
return "#20261D";
}

}

function light(hex){

try{

let c=hexRgb(hex);

return "#"+
[
c.r+(255-c.r)*.83,
c.g+(255-c.g)*.83,
c.b+(255-c.b)*.83
]
.map(x=>Math.round(x).toString(16).padStart(2,"0"))
.join("");

}catch{
return "#ECE2C7";
}

}


/* =====================================================
   THEME
===================================================== */

function applyTheme(){

let t=menuData.theme||{};

document.documentElement.style.setProperty(
"--bg",
t.backgroundColor||"#F6F1E2"
);

document.documentElement.style.setProperty(
"--accent",
t.categoryColor||"#1E6F4C"
);

document.documentElement.style.setProperty(
"--accentText",
dark(t.categoryColor||"#1E6F4C")
);

document.documentElement.style.setProperty(
"--ink",
t.textColor||"#20261D"
);

document.documentElement.style.setProperty(
"--raised",
light(t.categoryColor||"#1E6F4C")
);

}


/* =====================================================
   SUPABASE LOAD
===================================================== */

async function loadMenu(){

try{

const {data,error}=await supabaseClient
.from("menus")
.select("id,data")
.eq("id",MENU_ID)
.single();

if(error) throw error;

if(data && data.data){

menuData=data.data;

}else{

menuData=defaultData();

}

}catch(error){

console.error(error);

menuData=defaultData();

}

if(!menuData.theme)
menuData.theme={
backgroundColor:"#F6F1E2",
categoryColor:"#1E6F4C",
textColor:"#20261D"
};

if(!menuData.categories)
menuData.categories=[];

menuData.categories.forEach(cat=>{

if(!cat.id)cat.id=uid();

if(!cat.color)
cat.color=menuData.theme.categoryColor;

if(!cat.items)
cat.items=[];

cat.items.forEach(item=>{

if(!item.id)item.id=uid();

if(item.available===undefined)
item.available=true;

});

});

activeCategory=
menuData.categories[0]?.id||null;

applyTheme();
render();

}


/* =====================================================
   SUPABASE SAVE
===================================================== */

async function saveMenu(){

const {error}=await supabaseClient
.from("menus")
.update({
data:menuData,
updated_at:new Date().toISOString()
})
.eq("id",MENU_ID);

if(error){

console.error(error);

throw error;

}

}


/* =====================================================
   CUSTOMER
===================================================== */

function render(){

if(!menuData){

app.innerHTML=
'<div class="loading">Menü yükleniyor…</div>';

return;

}

let cat=
menuData.categories.find(
x=>x.id===activeCategory
)||menuData.categories[0];

if(cat)
activeCategory=cat.id;

let tabs=
menuData.categories.map(c=>`

<button
class="tab ${c.id===cat?.id?"active":""}"
data-cat="${esc(c.id)}"
style="--tab:${esc(c.color)}"
>
${esc(c.name)}
</button>

`).join("");

let items=
cat?.items.map(item=>`

<div class="item">

${
item.image
? `<img class="thumb" src="${esc(item.image)}">`
:""
}

<div class="itemContent">

<div>

<div class="itemName">

${esc(item.name)}

${
item.available
?""
:'<span class="sold">TÜKENDİ</span>'
}

</div>

${
item.desc
?`<div class="desc">${esc(item.desc)}</div>`
:""
}

</div>

<div class="leader"></div>

<div class="price">
${money(item.price)}
</div>

</div>

</div>

`).join("")||"";

app.innerHTML=`

<div class="wrap">

<header class="hero">

${
menuData.logo
?`
<img
class="logo"
src="${esc(menuData.logo)}"
alt="Logo"
>
`
:""
}

<div class="eyebrow"
style="color:${esc(cat?.color||menuData.theme.categoryColor)}">
MENÜ
</div>

<h1>${esc(menuData.cafeName)}</h1>

<p class="subtitle">
${esc(menuData.subtitle)}
</p>

</header>

<nav class="tabs">
${tabs}
</nav>

<section class="category">

<h2
style="color:${esc(cat?.color||menuData.theme.categoryColor)}"
>
${esc(cat?.name||"")}
</h2>

<svg class="line"
viewBox="0 0 300 12"
preserveAspectRatio="none">

<path
d="M0 6 Q15 0 30 6 T60 6 T90 6 T120 6 T150 6 T180 6 T210 6 T240 6 T270 6 T300 6"
fill="none"
stroke="${esc(cat?.color||menuData.theme.categoryColor)}"
stroke-width="1.5"
/>

</svg>

${items}

</section>

<footer>

${
menuData.instagram
?`
<a
class="instagram"
href="https://instagram.com/${encodeURIComponent(menuData.instagram)}"
target="_blank"
>
@${esc(menuData.instagram)}
</a>
<br>
`
:""
}

QR ile açıldı · fiyatlara KDV dahildir

</footer>

</div>
`;

document
.querySelectorAll("[data-cat]")
.forEach(btn=>{

btn.onclick=()=>{

activeCategory=btn.dataset.cat;

render();

};

});

}


/* =====================================================

===================================================== */

document.getElementById("adminBtn").onclick=()=>{

type="password"
id="pin"

>

</button>

`;

document.body.appendChild(overlay);

overlay.querySelector(".close").onclick=

overlay.querySelector("#login").onclick=()=>{

let pin=overlay.querySelector("#pin").value;

if(pin==="1234"){

overlay.remove();

}else{

overlay.querySelector("#pinStatus")
.textContent="Hatalı PIN.";

}

};

};


/* =====================================================

===================================================== */

`;

/* -----------------------------------------------------

----------------------------------------------------- */

overlay.querySelector("#name").oninput=e=>{

};

overlay.querySelector("#subtitle").oninput=e=>{
menuData.subtitle=e.target.value;
};

overlay.querySelector("#logo").oninput=e=>{

};

overlay.querySelector("#instagram").oninput=e=>{

----------------------------------------------------- */

overlay.querySelector("#bgColor").oninput=e=>{

};

applyTheme();

overlay.querySelector("#textColor").oninput=e=>{

};

   CLOSE
----------------------------------------------------- */

overlay.querySelector("#closeAdmin").onclick=()=>{

overlay.remove();

render();

};

   CATEGORIES
----------------------------------------------------- */

function drawCategories(){

let box=overlay.querySelector("#categories");

box.innerHTML="";

};

if(confirm(

drawCategories();

}

let itemsBox=div.querySelector(".items");

cat.items.forEach(item=>{

let card=document.createElement("div");

card.className="card";

card.innerHTML=`

<label>Ürün adı</label>

<input
type="text"
class="itemName"
value="${esc(item.name)}"
>

<label>Açıklama</label>

<input
type="text"
class="itemDesc"
value="${esc(item.desc||"")}"
>

<label>Fiyat</label>

<input
type="number"
class="itemPrice"
value="${item.price}"
>

<label>Görsel URL</label>

<input
type="text"
class="itemImage"
placeholder="https://..."
value="${
item.image?.startsWith("http")
?esc(item.image)
:""
}"
>

<div class="actions">

<button class="btn red deleteItem">
Ürünü sil
</button>

<label style="margin:0">
<input
type="checkbox"
class="available"
${item.available?"checked":""}
>
 Satışta
</label>

</div>
`;

itemsBox.appendChild(card);

card.querySelector(".itemName").oninput=e=>{
item.name=e.target.value;
};

card.querySelector(".itemDesc").oninput=e=>{
item.desc=e.target.value;
};

card.querySelector(".itemPrice").oninput=e=>{
item.price=Number(e.target.value)||0;
};

card.querySelector(".itemImage").oninput=e=>{
item.image=e.target.value.trim();
};

card.querySelector(".available").onchange=e=>{
item.available=e.target.checked;
};

card.querySelector(".deleteItem").onclick=()=>{

cat.items=
cat.items.filter(x=>x.id!==item.id);

drawCategories();

};

});

div.querySelector(".addItem").onclick=()=>{

cat.items.push({

id:uid(),
name:"Yeni ürün",
desc:"",
price:0,
available:true,
image:""

});

drawCategories();

};

});

}

drawCategories();


/* -----------------------------------------------------
   ADD CATEGORY
----------------------------------------------------- */

overlay.querySelector("#addCategory").onclick=()=>{

menuData.categories.push({

id:uid(),

name:"Yeni kategori",

color:menuData.theme.categoryColor,

items:[]

});

drawCategories();

};


/* -----------------------------------------------------
   SAVE + EXIT
----------------------------------------------------- */

overlay.querySelector("#save").onclick=async()=>{

let btn=overlay.querySelector("#save");

let status=overlay.querySelector("#saveStatus");

btn.disabled=true;

btn.textContent="⏳ Kaydediliyor…";

status.textContent="";


try{

await saveMenu();

status.textContent="✅ Kaydedildi!";

setTimeout(()=>{

overlay.remove();

applyTheme();

render();

},500);

}catch(error){

console.error(error);

status.textContent=
"❌ Kaydedilemedi. Supabase bağlantısını kontrol et.";

btn.disabled=false;

btn.textContent="💾 Kaydet ve Çık";

}

};

}


/* =====================================================
   START
===================================================== */

loadMenu();

</script>

</body>
</html>
