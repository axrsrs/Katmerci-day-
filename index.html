function esc(s){
return String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);
}

function escAttr(s){
return esc(s);

/* =========================================================
   SUPABASE API
========================================================= */

async function api(path,opts={}){

let headers={
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation",
...(opts.headers||{})
};

let res=await fetch(
SUPABASE_URL+path,
{
...opts,
headers
}
);

let txt=await res.text();

let data;

try{
data=txt?JSON.parse(txt):null;
}catch{
data=txt;
}

if(!res.ok){

throw new Error(
data?.message||
data?.error_description||
data?.hint||
txt||
("HTTP "+res.status)
);
}

return data;
}

async function rpc(name,args){

return api(
"/rest/v1/rpc/"+name,
{
method:"POST",
body:JSON.stringify(args)
}
);

}

function resizeImage(file,max=900,q=.82){

return new Promise((res,rej)=>{

let reader=new FileReader();

reader.onload=e=>{

let img=new Image();

img.onload=()=>{

let w=img.width;
let h=img.height;

if(w>h&&w>max){

h*=max/w;
w=max;

}else if(h>=w&&h>max){

w*=max/h;
h=max;

}

let canvas=
document.createElement("canvas");

canvas.width=Math.round(w);
canvas.height=Math.round(h);

canvas
.getContext("2d")
.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

res(
canvas.toDataURL(
"image/jpeg",
q
)
);

};

img.onerror=rej;

img.src=e.target.result;

};

reader.onerror=rej;

reader.readAsDataURL(file);

});

}

data-file="${i.id}"
>

<input
data-url="${i.id}"
placeholder="Görsel linki"
value="${
i.image?.startsWith("http")
?escAttr(i.image)
:""
}"
>

<button
class="btn btn-ghost"
data-remove-img="${i.id}"
>
Görseli kaldır
</button>

</div>

</div>

<label class="avail-toggle">

<input
type="checkbox"
data-avail="${i.id}"
${i.available?"checked":""}
>

Stokta / satışta

</label>

<div class="actions-row">

<button
class="btn btn-danger"
data-del-item="${i.id}"
data-cat="${c.id}"
>
Ürünü sil
</button>

</div>

</div>`

).join("")}

<button
class="btn btn-ghost btn-block"
data-add-item="${c.id}"
>
+ Ürün ekle
</button>`

).join("");


/* RENK KUTULARI */

let colors=
colorFields.map(([key,label])=>

`<div class="color-box">

<span>
${label}
</span>

<input
type="color"
data-color="${key}"
value="${t[key]}"
>

</div>`

).join("");


/* PANEL */

o.innerHTML=

`<div class="panel panel-rel">

<button
class="close-x"
id="adminClose"
>
✕
</button>

<h2>
Yönetim Paneli
</h2>


<!-- LOGO -->

<div class="color-section"
style="margin-top:0">

<div class="color-section-title">
Logo
</div>

${
menuData.logo
?
`<img
class="logo-admin"
id="logoPreview"
src="${escAttr(menuData.logo)}"
>`
:
`<img
class="logo-admin"
id="logoPreview"
src="${BLANK_PIXEL}"
style="display:none"
>`
}

<input
type="file"
id="logoFile"
accept="image/*"
>

<input
id="logoUrl"
placeholder="veya logo linki"
value="${
menuData.logo?.startsWith("http")
?escAttr(menuData.logo)
:""
}"
>

</div>


<!-- KAFE -->

<label>
Kafe adı
</label>

<input
id="cafeName"
value="${escAttr(menuData.cafeName)}"
>

<label>
Alt başlık
</label>

<input
id="subtitle"
value="${escAttr(menuData.subtitle)}"
>


<!-- RENKLER -->

<div class="color-section">

<div class="color-section-title">
Arka Plan Renkleri
</div>

<div class="color-grid">

${colors}

</div>

</div>


<!-- KATEGORİLER -->

${cats}


<button
class="btn btn-ghost btn-block"
id="addCat"
>
+ Yeni kategori
</button>


<hr
style="
border:none;
border-top:1px solid var(--border);
margin:25px 0;
">


<!-- PIN -->

<label>
Yeni PIN
</label>

<div style="display:flex;gap:8px">

<input
id="newPin"
type="password"
inputmode="numeric"
placeholder="En az 4 hane"
>

<button
class="btn btn-ghost"
id="changePin"
>
Değiştir
</button>

</div>


<div
class="status-msg"
id="adminMsg"
></div>


<!-- SADECE KAYDET -->

<button
class="btn btn-primary btn-block"
id="saveMenu"
style="
margin-top:20px;
padding:13px;
font-size:14px;
"
>
Kaydet
</button>

</div>`;


/* =========================================================
   KAFE
========================================================= */

o.querySelector("#cafeName").oninput=e=>{
menuData.cafeName=e.target.value;
};

o.querySelector("#subtitle").oninput=e=>{
menuData.subtitle=e.target.value;
};


/* =========================================================
   LOGO
========================================================= */

let logoFile=
o.querySelector("#logoFile");

let logoUrl=
o.querySelector("#logoUrl");

let logoPreview=
o.querySelector("#logoPreview");


logoFile.onchange=async()=>{

let file=logoFile.files?.[0];

if(!file)return;

try{

menuData.logo=
await resizeImage(
file,
1200,
.88
);

logoPreview.src=
menuData.logo;

logoPreview.style.display=
"block";

logoUrl.value="";

}catch{

toast("Logo yüklenemedi");

}

};


logoUrl.oninput=e=>{

let value=
e.target.value.trim();

menuData.logo=value;

if(value){

logoPreview.src=value;
logoPreview.style.display="block";

}else{

logoPreview.style.display="none";

}

};


/* =========================================================
   RENKLER
========================================================= */

o.querySelectorAll(
"[data-color]"
).forEach(input=>{

input.oninput=e=>{

let key=
e.target.dataset.color;

menuData.theme={
...menuData.theme,
[key]:e.target.value
};

applyTheme(
menuData.theme
);

};

});


/* =========================================================
   KATEGORİ
========================================================= */

o.querySelectorAll(
"[data-cat-name]"
).forEach(input=>{

input.oninput=e=>{

let c=
menuData.categories.find(
c=>c.id===input.dataset.catName
);

if(c){
c.name=e.target.value;
}

};

});


/* =========================================================
   ÜRÜN ADI
========================================================= */

o.querySelectorAll(
"[data-item-name]"
).forEach(input=>{

input.oninput=e=>{

let i=
findItem(
input.dataset.itemName
);

if(i){
i.name=e.target.value;
}

};

});


/* =========================================================
   ÜRÜN AÇIKLAMA
========================================================= */

o.querySelectorAll(
"[data-item-desc]"
).forEach(input=>{

input.oninput=e=>{

let i=
findItem(
input.dataset.itemDesc
);

if(i){
i.desc=e.target.value;
}

};

});


/* =========================================================
   FİYAT
========================================================= */

o.querySelectorAll(
"[data-item-price]"
).forEach(input=>{

input.oninput=e=>{

let i=
findItem(
input.dataset.itemPrice
);

if(i){
i.price=
Number(e.target.value)||0;
}

};

});


/* =========================================================
   STOK
========================================================= */

o.querySelectorAll(
"[data-avail]"
).forEach(input=>{

input.onchange=e=>{

let i=
findItem(
input.dataset.avail
);

if(i){
i.available=
e.target.checked;
}

};

});


/* =========================================================
   ÜRÜN SİL
========================================================= */

o.querySelectorAll(
"[data-del-item]"
).forEach(btn=>{

btn.onclick=()=>{

let c=
menuData.categories.find(
c=>c.id===btn.dataset.cat
);

if(!c)return;

c.items=
c.items.filter(
i=>i.id!==btn.dataset.delItem
);

renderAdmin();

};

});


/* =========================================================
   ÜRÜN EKLE
========================================================= */

o.querySelectorAll(
"[data-add-item]"
).forEach(btn=>{

btn.onclick=()=>{

let c=
menuData.categories.find(
c=>c.id===btn.dataset.addItem
);

if(!c)return;

c.items.push({

id:
"i"+
Date.now().toString(36)+
Math.random()
.toString(36)
.slice(2,7),

name:"Yeni ürün",
desc:"",
price:0,
available:true,
image:""

});

renderAdmin();

};

});


/* =========================================================
   KATEGORİ SİL
========================================================= */

o.querySelectorAll(
"[data-del-cat]"
).forEach(btn=>{

btn.onclick=()=>{

if(!confirm(
"Kategori ve içindeki ürünler silinsin mi?"
)){
return;
}

menuData.categories=
menuData.categories.filter(
c=>c.id!==btn.dataset.delCat
);

if(
activeCatId===btn.dataset.delCat
){

activeCatId=
menuData.categories[0]?.id||null;

}

renderAdmin();

};

});


/* =========================================================
   ÜRÜN GÖRSELİ
========================================================= */

o.querySelectorAll(
"[data-file]"
).forEach(input=>{

input.onchange=async()=>{

let file=input.files?.[0];

if(!file)return;

try{

let i=
findItem(
input.dataset.file
);

i.image=
await resizeImage(
file,
900,
.80
);

renderAdmin();

}catch{

toast(
"Görsel yüklenemedi"
);

}

};

});


/* =========================================================
   GÖRSEL LİNKİ
========================================================= */

o.querySelectorAll(
"[data-url]"
).forEach(input=>{

input.oninput=e=>{

let i=
findItem(
input.dataset.url
);

if(!i)return;

i.image=
e.target.value.trim();

let preview=
o.querySelector(
`[data-preview="${i.id}"]`
);

if(preview){

preview.src=
i.image||
BLANK_PIXEL;

}

};

});


/* =========================================================
   GÖRSEL SİL
========================================================= */

o.querySelectorAll(
"[data-remove-img]"
).forEach(btn=>{

btn.onclick=()=>{

let i=
findItem(
btn.dataset.removeImg
);

if(i){

i.image="";

renderAdmin();

}

};

});


/* =========================================================
   KATEGORİ EKLE
========================================================= */

o.querySelector("#addCat")
.onclick=()=>{

menuData.categories.push({

id:
"c"+
Date.now().toString(36)+
Math.random()
.toString(36)
.slice(2,7),

name:"Yeni kategori",

items:[]

});

renderAdmin();

};


/* =========================================================
   PIN DEĞİŞTİR
========================================================= */

o.querySelector("#changePin")
.onclick=async()=>{

let newPin=
o.querySelector("#newPin")
.value
.trim();

let msg=
o.querySelector("#adminMsg");

if(newPin.length<4){

msg.textContent=
"PIN en az 4 hane olmalı.";

return;

}

try{

let ok=
await rpc(
"change_menu_pin",
{
p_menu_id:MENU_ID,
p_old_pin:currentPin,
p_new_pin:newPin
}
);

if(
ok===true||
ok?.[0]===true||
ok?.result===true
){

currentPin=newPin;

msg.textContent=
"PIN değiştirildi.";

}else{

msg.textContent=
"PIN değiştirilemedi.";

}

}catch(e){

msg.textContent=
"Hata: "+e.message;

}

};


/* =========================================================
   KAYDET
========================================================= */

o.querySelector("#saveMenu")
.onclick=async()=>{

let msg=
o.querySelector("#adminMsg");

msg.textContent=
"Kaydediliyor…";

try{

let payload={

cafeName:
menuData.cafeName,

subtitle:
menuData.subtitle,

logo:
menuData.logo||"",

theme:
menuData.theme,

categories:
menuData.categories

};

let ok=
await rpc(
"save_menu",
{
p_menu_id:MENU_ID,
p_pin:currentPin,
p_data:payload
}
);

if(
ok===true||
ok?.[0]===true||
ok?.result===true
){

msg.textContent=
"Kaydedildi ✓";

setTimeout(()=>{

o.remove();

applyTheme(
menuData.theme
);

renderCustomer();

toast(
"Menü kaydedildi ✓"
);

},500);

}else{

msg.textContent=
"Kaydedilemedi.";

}

}catch(e){

msg.textContent=
"Hata: "+e.message;

}

};


/* =========================================================
   KAPAT
========================================================= */

o.querySelector("#adminClose")
.onclick=()=>{

o.remove();

loadMenu();

};

}


/* =========================================================
   ADMIN AÇ
========================================================= */

function openAdmin(){

let old=
document.getElementById(
"adminOverlay"
);

if(old){
old.remove();
}

let o=
document.createElement("div");

o.className="overlay";
o.id="adminOverlay";

document.body.appendChild(o);

renderAdmin();

}


/* =========================================================
   YÖNETİM
========================================================= */

document
.getElementById("adminDot")
.onclick=openGate;

document
.getElementById("adminDot")
.onkeydown=e=>{

if(e.key==="Enter"){
openGate();
}

};


/* =========================================================
   BAŞLAT
========================================================= */

loadMenu();

</script>

</body>
</html>
