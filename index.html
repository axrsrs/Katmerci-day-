/* =====================================================
ESCAPE
===================================================== */

function esc(value){

return String(value ?? "").replace(
/[&<>"']/g,
function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m];

}
);

}


/* =====================================================
SUPABASE API
===================================================== */

async function api(path,options={}){

const headers = {

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation",

...(options.headers || {})

};

const response =
await fetch(
SUPABASE_URL+path,
{
...options,
headers
}
);

const text =
await response.text();

let data;

try{

data =
text
?JSON.parse(text)
:null;

}catch{

data=text;

}

if(!response.ok){

throw new Error(
data?.message ||
data?.error_description ||
data?.hint ||
text ||
("HTTP "+response.status)
);

}

return data;

}


/* =====================================================
RPC
===================================================== */

async function rpc(name,args){

return api(
"/rest/v1/rpc/"+name,
{
method:"POST",
body:JSON.stringify(args)
}
);

}

/* =====================================================

function resizeImage(
file,
maxSize=1000,
quality=.82
){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();

reader.onload=function(event){

const image =
new Image();

image.onload=function(){

let width=image.width;
let height=image.height;

if(width>height &&
width>maxSize){

height =
height*(maxSize/width);

width=maxSize;

}

else if(
height>=width &&
height>maxSize
){

width =
width*(maxSize/height);

height=maxSize;

}

const canvas =
document.createElement("canvas");

canvas.width =
Math.round(width);

canvas.height =
Math.round(height);

const ctx =
canvas.getContext("2d");

ctx.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};

image.onerror=reject;

image.src=
event.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

}
);

}

["description","Açıklamalar"],

{

items:[

["categoryBg","Kategori arka planı"],

/* =====================================================
ADMIN
===================================================== */

function openAdmin(){

let old =
document.getElementById(
"adminOverlay"
);

if(old){
old.remove();
}

const overlay =
document.createElement("div");

overlay.className="overlay";
overlay.id="adminOverlay";

document.body.appendChild(overlay);

renderAdmin();

}


/* =====================================================
ADMIN RENDER
===================================================== */

function renderAdmin(){

const overlay =
document.getElementById(
"adminOverlay"
);

if(!overlay){
return;
}

const theme =
{
...defaultTheme(),
...(menuData.theme || {})
};


/* RENKLER */

let colorHTML="";

colorGroups.forEach(group=>{

colorHTML +=

`<div class="color-group-title">
${group.title}
</div>

<div class="color-grid">`;

group.items.forEach(
([key,label])=>{

colorHTML +=

`<div class="color-box">

<span>
${label}
</span>

<input
type="color"
data-color="${key}"
value="${theme[key]}"
>

</div>`;

});

colorHTML +=
`</div>`;

});


/* KATEGORİLER */

let categoryHTML="";

menuData.categories.forEach(
category=>{

categoryHTML +=

`<div
class="cat-header"
>

<input
data-cat-name="${esc(category.id)}"
value="${esc(category.name)}"
>

<button
class="btn btn-danger"
data-delete-category="${esc(category.id)}"
>
Sil
</button>

</div>`;


category.items.forEach(
item=>{

categoryHTML +=

`<div
class="item-edit-card"
>

<label>
Ürün adı
</label>

<input
type="text"
data-item-name="${esc(item.id)}"
value="${esc(item.name)}"
>


<label>
Açıklama
</label>

<input
type="text"
data-item-desc="${esc(item.id)}"
value="${esc(item.desc || "")}"
>


<label>
Fiyat
</label>

<input
type="number"
min="0"
step="1"
data-item-price="${esc(item.id)}"
value="${Number(item.price)||0}"
>


<label>
Görsel
</label>

<div class="img-row">

<img
class="admin-thumb"
data-preview="${esc(item.id)}"
src="${
item.image
?esc(item.image)
:"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
}"
>

<div class="img-controls">

<input
class="file-input"
type="file"
accept="image/*"
data-file="${esc(item.id)}"
>

<input
type="url"
data-image-url="${esc(item.id)}"
placeholder="Görsel linki"
value="${
item.image &&
item.image.startsWith("http")
?esc(item.image)
:""
}"
>

<button
class="btn btn-ghost"
data-remove-image="${esc(item.id)}"
>
Görseli kaldır
</button>

</div>

</div>


<label
class="avail-toggle"
>

<input
type="checkbox"
data-available="${esc(item.id)}"
${item.available!==false?"checked":""}
>

Ürün satışta

</label>


<div class="actions-row">

<button
class="btn btn-danger"
data-delete-item="${esc(item.id)}"
data-category="${esc(category.id)}"
>
Ürünü sil
</button>

</div>

</div>`;

});


categoryHTML +=

`<button
class="btn btn-ghost btn-block"
data-add-item="${esc(category.id)}"
>
+ Ürün ekle
</button>`;

});


overlay.innerHTML =

`<div class="panel panel-rel">

<button
class="close-x"
id="adminClose"
>
✕
</button>

<h2>
Menü Ayarları
</h2>


<!-- LOGO -->

<div class="logo-box">

<div class="section-title">
Logo
</div>

${
menuData.logo
?
`<img
class="logo-admin"
id="logoPreview"
src="${esc(menuData.logo)}"
>`
:
`<img
class="logo-admin"
id="logoPreview"
style="display:none"
>`
}

<label>
Telefondan logo seç
</label>

<input
class="file-input"
type="file"
id="logoFile"
accept="image/*"
>

<label>
Logo linki
</label>

<input
type="url"
id="logoUrl"
placeholder="https://..."
value="${
menuData.logo &&
menuData.logo.startsWith("http")
?esc(menuData.logo)
:""
}"
>

</div>


<!-- KAFE -->

<label>
Kafe adı
</label>

<input
type="text"
id="cafeName"
value="${esc(menuData.cafeName)}"
>


<label>
Alt başlık
</label>

<input
type="text"
id="subtitle"
value="${esc(menuData.subtitle)}"
>


<!-- RENKLER -->

<div class="color-section">

<div class="color-section-title">
Renk Ayarları
</div>

${colorHTML}

</div>


<!-- KATEGORİLER -->

${categoryHTML}


<!-- KATEGORİ EKLE -->

<button
class="btn btn-ghost btn-block"
id="addCategory"
>
+ Yeni kategori
</button>


<!-- PIN -->

<div
style="
margin-top:25px;
padding-top:20px;
border-top:1px solid var(--border);
"
>

<div class="section-title">
PIN Değiştir
</div>

<label>
Yeni PIN
</label>

<input
type="password"
id="newPin"
inputmode="numeric"
placeholder="En az 4 hane"
>

<button
class="btn btn-ghost btn-block"
id="changePin"
>
PIN'i değiştir
</button>

</div>


<div
class="status-msg"
id="adminMessage"
></div>


<!-- SADECE KAYDET -->

<button
class="btn btn-primary btn-block"
id="saveMenu"
style="
margin-top:22px;
padding:14px;
font-size:14px;
"
>
Kaydet
</button>

</div>`;


/* =====================================================
KAFE ADI
===================================================== */

overlay.querySelector("#cafeName")
.oninput=function(e){

menuData.cafeName =
e.target.value;

};


/* =====================================================
ALT BAŞLIK
===================================================== */

overlay.querySelector("#subtitle")
.oninput=function(e){

menuData.subtitle =
e.target.value;

};


/* =====================================================
LOGO DOSYA
===================================================== */

overlay.querySelector("#logoFile")
.onchange=async function(){

const file =
this.files?.[0];

if(!file){
return;
}

try{

const image =
await resizeImage(
file,
1200,
.88
);

menuData.logo=image;

const preview =
overlay.querySelector(
"#logoPreview"
);

preview.src=image;
preview.style.display="block";

overlay.querySelector(
"#logoUrl"
).value="";

}catch{

toast(
"Logo yüklenemedi."
);

}

};


/* =====================================================
LOGO URL
===================================================== */

overlay.querySelector("#logoUrl")
.oninput=function(e){

const url =
e.target.value.trim();

menuData.logo=url;

const preview =
overlay.querySelector(
"#logoPreview"
);

if(url){

preview.src=url;
preview.style.display="block";

}else{

preview.style.display="none";

}

};


/* =====================================================
RENK DEĞİŞTİR
===================================================== */

overlay
.querySelectorAll("[data-color]")
.forEach(
input=>{

input.oninput=function(){

const key =
this.dataset.color;

menuData.theme={
...menuData.theme,
[key]:this.value
};

applyTheme(
menuData.theme
);

};

});


/* =====================================================
KATEGORİ ADI
===================================================== */

overlay
.querySelectorAll("[data-cat-name]")
.forEach(
input=>{

input.oninput=function(){

const category =
menuData.categories.find(
c=>c.id===this.dataset.catName
);

if(category){

category.name=
this.value;

}

};

});


/* =====================================================
ÜRÜN ADI
===================================================== */

overlay
.querySelectorAll("[data-item-name]")
.forEach(
input=>{

input.oninput=function(){

const item =
findItem(
this.dataset.itemName
);

if(item){

item.name=
this.value;

}

};

});


/* =====================================================
ÜRÜN AÇIKLAMA
===================================================== */

overlay
.querySelectorAll("[data-item-desc]")
.forEach(
input=>{

input.oninput=function(){

const item =
findItem(
this.dataset.itemDesc
);

if(item){

item.desc=
this.value;

}

};

});


/* =====================================================
FİYAT
===================================================== */

overlay
.querySelectorAll("[data-item-price]")
.forEach(
input=>{

input.oninput=function(){

const item =
findItem(
this.dataset.itemPrice
);

if(item){

item.price =
Number(this.value)||0;

}

};

});


/* =====================================================
SATIŞTA
===================================================== */

overlay
.querySelectorAll("[data-available]")
.forEach(
input=>{

input.onchange=function(){

const item =
findItem(
this.dataset.available
);

if(item){

item.available =
this.checked;

}

};

});


/* =====================================================
ÜRÜN SİL
===================================================== */

overlay
.querySelectorAll("[data-delete-item]")
.forEach(
button=>{

button.onclick=function(){

const category =
menuData.categories.find(
c=>c.id===this.dataset.category
);

if(!category){
return;
}

category.items =
category.items.filter(
item=>
item.id!==this.dataset.deleteItem
);

renderAdmin();

};

});


/* =====================================================
ÜRÜN EKLE
===================================================== */

overlay
.querySelectorAll("[data-add-item]")
.forEach(
button=>{

button.onclick=function(){

const category =
menuData.categories.find(
c=>c.id===this.dataset.addItem
);

if(!category){
return;
}

category.items.push({

id:
"item_"+Date.now()+
"_"+Math.random()
.toString(36)
.substring(2,7),

name:"Yeni ürün",

desc:"",

price:0,

available:true,

image:""

});

renderAdmin();

};

});


/* =====================================================
KATEGORİ SİL
===================================================== */

overlay
.querySelectorAll("[data-delete-category]")
.forEach(
button=>{

button.onclick=function(){

const id =
this.dataset.deleteCategory;

if(!confirm(
"Bu kategori ve içindeki ürünler silinsin mi?"
)){
return;
}

menuData.categories =
menuData.categories.filter(
c=>c.id!==id
);

if(activeCatId===id){

activeCatId =
menuData.categories[0]?.id
||null;

}

renderAdmin();

};

});


/* =====================================================
KATEGORİ EKLE
===================================================== */

overlay
.querySelector("#addCategory")
.onclick=function(){

menuData.categories.push({

id:
"cat_"+Date.now()+
"_"+Math.random()
.toString(36)
.substring(2,7),

name:"Yeni kategori",

items:[]

});

renderAdmin();

};


/* =====================================================
ÜRÜN GÖRSEL DOSYA
===================================================== */

overlay
.querySelectorAll("[data-file]")
.forEach(
input=>{

input.onchange=async function(){

const file =
this.files?.[0];

if(!file){
return;
}

try{

const item =
findItem(
this.dataset.file
);

if(!item){
return;
}

item.image =
await resizeImage(
file,
900,
.80
);

renderAdmin();

}catch{

toast(
"Görsel yüklenemedi."
);

}

};

});


/* =====================================================
ÜRÜN GÖRSEL URL
===================================================== */

overlay
.querySelectorAll("[data-image-url]")
.forEach(
input=>{

input.oninput=function(){

const item =
findItem(
this.dataset.imageUrl
);

if(!item){
return;
}

item.image =
this.value.trim();

const preview =
overlay.querySelector(
`[data-preview="${CSS.escape(item.id)}"]`
);

if(preview){

preview.src =
item.image || "";

}

};

});


/* =====================================================
ÜRÜN GÖRSEL SİL
===================================================== */

overlay
.querySelectorAll("[data-remove-image]")
.forEach(
button=>{

button.onclick=function(){

const item =
findItem(
this.dataset.removeImage
);

if(item){

item.image="";

renderAdmin();

}

};

});


/* =====================================================
PIN DEĞİŞTİR
===================================================== */

overlay
.querySelector("#changePin")
.onclick=async function(){

const newPin =
overlay
.querySelector("#newPin")
.value
.trim();

const message =
overlay
.querySelector("#adminMessage");

if(newPin.length<4){

message.textContent=
"PIN en az 4 hane olmalı.";

return;

}

try{

const result =
await rpc(
"change_menu_pin",
{
p_menu_id:MENU_ID,
p_old_pin:currentPin,
p_new_pin:newPin
}
);

let ok=false;

if(result===true){
ok=true;
}

if(Array.isArray(result) &&
result[0]===true){
ok=true;
}

if(result?.result===true){
ok=true;
}

if(ok){

currentPin=newPin;

message.textContent=
"PIN başarıyla değiştirildi.";

overlay
.querySelector("#newPin")
.value="";

}else{

message.textContent=
"PIN değiştirilemedi.";

}

}catch(error){

message.textContent=
"Hata: "+error.message;

}

};


/* =====================================================
KAYDET
===================================================== */

overlay
.querySelector("#saveMenu")
.onclick=async function(){

const button=this;

const message =
overlay
.querySelector("#adminMessage");

button.disabled=true;

button.textContent=
"Kaydediliyor…";

message.textContent="";


try{

const payload={

cafeName:
menuData.cafeName,

subtitle:
menuData.subtitle,

logo:
menuData.logo || "",

theme:
menuData.theme,

categories:
menuData.categories

};


const result =
await rpc(
"save_menu",
{
p_menu_id:MENU_ID,
p_pin:currentPin,
p_data:payload
}
);


let ok=false;

if(result===true){
ok=true;
}

if(Array.isArray(result) &&
result[0]===true){
ok=true;
}

if(result?.result===true){
ok=true;
}


if(ok){

message.textContent=
"Kaydedildi ✓";

button.textContent=
"Kaydedildi ✓";

setTimeout(
()=>{

overlay.remove();

applyTheme(
menuData.theme
);

renderCustomer();

toast(
"Menü başarıyla kaydedildi."
);

},
600
);

}else{

button.disabled=false;

button.textContent=
"Kaydet";

message.textContent=
"Kaydetme başarısız.";

}

}catch(error){

button.disabled=false;

button.textContent=
"Kaydet";

message.textContent=
"Hata: "+error.message;

}

};


/* =====================================================
KAPAT
===================================================== */

overlay
.querySelector("#adminClose")
.onclick=function(){

overlay.remove();

loadMenu();

};

}


/* =====================================================
ADMIN BUTONU
===================================================== */

document
.getElementById("adminDot")
.onclick=openGate;

document
.getElementById("adminDot")
.onkeydown=function(e){

if(e.key==="Enter"){
openGate();
}

};


/* =====================================================
BAŞLAT
===================================================== */

loadMenu();

</script>

</body>
</html>
