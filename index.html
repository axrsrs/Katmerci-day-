<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;

/* =========================
HEADER
========================= */

height:98px;

<script>

/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://cwofalezjvuxppmwipmc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n9xGFNXF-wl4C-BFLBGmeg_hsKy9GtU";

const MENU_ID =
"00000000-0000-0000-0000-000000000001";


/* =========================================================
DURUM
========================================================= */

let menuData=null;

let activeCatId=null;

let unlocked=false;

let currentPin="";

let adminOverlay=null;

let adminTab="general";


const app=
document.getElementById("app");


/* =========================================================
YARDIMCI
========================================================= */

function uid(){

return "i"+
Date.now().toString(36)+
Math.random().toString(36).slice(2,8);

}


function esc(value){

return String(value??"").replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}


function money(value){

return (
Number(value)||0
).toLocaleString("tr-TR")
+" ₺";

}


function validColor(value){

return /^#[0-9A-Fa-f]{6}$/.test(
String(value||"")
);

}


/* =========================================================
DEFAULT TEMA
========================================================= */

function defaultTheme(){

return{

background:"#F4EBDD",
header:"#F4EBDD",
surface:"#FFFDF8",
surfaceRaised:"#E9DDC9",

heading:"#4E282C",
text:"#493B32",
muted:"#817366",

accent:"#7C8957",
accentText:"#4D5933",

category:"#7C8957",
categoryText:"#FFFDF5",

price:"#A86143",

border:"#D8CBB8",

danger:"#B44E48"

};

}


/* =========================================================
NORMALIZE
========================================================= */

function normalizeMenu(data){

data=data||{};


if(!data.cafeName){

data.cafeName=
"Katmerci Dayı";

}


if(!data.subtitle){

data.subtitle=
"Gaziantepten gelen lezzet";

}


data.logo=
data.logo||"";


const oldTheme=
data.theme||{};


data.theme={

...defaultTheme(),

...oldTheme

};


/*
Eski sürümlerde kullanılan
renk isimlerini de destekle.
*/

if(oldTheme.baseColor){

data.theme.accent=
oldTheme.baseColor;

}

if(oldTheme.categoryBg){

data.theme.category=
oldTheme.categoryBg;

}

if(oldTheme.mutedText){

data.theme.muted=
oldTheme.mutedText;

}

if(oldTheme.sold){

data.theme.danger=
oldTheme.sold;

}


if(!Array.isArray(data.categories)){

data.categories=[];

}


data.categories.forEach(
cat=>{

if(!cat.id)
cat.id=uid();

if(!cat.name)
cat.name="Kategori";

if(!Array.isArray(cat.items))
cat.items=[];


cat.items.forEach(
item=>{

if(!item.id)
item.id=uid();

if(item.name===undefined)
item.name="Yeni ürün";

if(item.desc===undefined)
item.desc="";

if(item.price===undefined)
item.price=0;

if(item.image===undefined)
item.image="";

if(item.available===undefined)
item.available=true;

}
);

}
);


return data;

}


/* =========================================================
TEMA UYGULA
========================================================= */

function applyTheme(){

if(!menuData)return;


const t=
menuData.theme;


const root=
document.documentElement;


root.style.setProperty(
"--bg",
t.background
);

root.style.setProperty(
"--header",
t.header||t.background
);

root.style.setProperty(
"--surface",
t.surface
);

root.style.setProperty(
"--surface-raised",
t.surfaceRaised
);

root.style.setProperty(
"--category-bg",
t.category
);

root.style.setProperty(
"--category-text",
t.categoryText
);

root.style.setProperty(
"--accent",
t.accent
);

root.style.setProperty(
"--accent-text",
t.accentText||t.heading
);

root.style.setProperty(
"--ink",
t.text
);

root.style.setProperty(
"--ink-muted",
t.muted
);

root.style.setProperty(
"--price",
t.price
);

root.style.setProperty(
"--button",
t.accent
);

root.style.setProperty(
"--button-text",
"#FFFFFF"
);

root.style.setProperty(
"--border",
t.border
);

root.style.setProperty(
"--tab-bg",
t.surface
);

root.style.setProperty(
"--tab-text",
t.muted
);

root.style.setProperty(
"--tab-active",
t.accent
);

root.style.setProperty(
"--sold",
t.danger
);

}


/* =========================================================
SUPABASE API
========================================================= */

async function api(path,options={}){

const response=
await fetch(
SUPABASE_URL+path,
{
...options,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY,
"Content-Type":
"application/json",
"Accept":
"application/json",
...(options.headers||{})
}
}
);


const text=
await response.text();


let data=null;


try{

data=
text
?JSON.parse(text)
:null;

}catch{

data=text;

}


if(!response.ok){

throw new Error(
data?.message||
data?.error_description||
data?.hint||
data?.error||
text||
"Supabase hatası"
);

}


return data;

}


/* =========================================================
RPC
========================================================= */

async function rpc(name,args){

return await api(
"/rest/v1/rpc/"+name,
{
method:"POST",
body:JSON.stringify(args)
}
);

}


/* =========================================================
MENÜ YÜKLE
========================================================= */

async function loadMenu(){

try{

const rows=
await api(
"/rest/v1/menus?id=eq."+
encodeURIComponent(MENU_ID)+
"&select=id,data"
);


if(!rows||!rows.length){

function openGate(){

openAdmin();

return;

}


const overlay=
document.createElement("div");


overlay.className=
"overlay";


overlay.innerHTML=`

</div>

placeholder="••••"
>

<div
id="pinError"
class="pin-error"
></div>

id="loginButton"
class="pin-login"
>

</button>

</div>

`;


document.body.appendChild(
overlay

.querySelector("#closePin")
.onclick=()=>{
overlay.remove();
};


const login=async()=>{

const pin=
overlay
.querySelector("#pinInput")
.value
.trim();


const error=
overlay
.querySelector("#pinError");


if(!pin){

error.textContent=
"PIN kodunu gir.";

return;

}


error.textContent=
"Kontrol ediliyor…";


try{

const result=
await rpc(
"check_menu_pin",
{
p_menu_id:MENU_ID,
p_pin:pin
}
);


const ok=
result===true||
result==="true"||
result?.[0]===true||
result?.[0]?.check_menu_pin===true||
result?.result===true;


if(!ok){

error.textContent=
"Hatalı PIN.";

return;

}


currentPin=pin;

unlocked=true;

overlay.remove();

openAdmin();


}catch(err){

console.error(err);

error.textContent=
err.message||
"Giriş hatası.";

}

};


overlay
.querySelector("#loginButton")
.onclick=login;


overlay
.querySelector("#pinInput")
.onkeydown=e=>{

if(e.key==="Enter")
login();

};


setTimeout(
()=>{
overlay
.querySelector("#pinInput")
.focus();
},
100
);

}

input.value;

document.querySelector(
`[data-hex="${key}"]`
);

hex.value=
input.value.toUpperCase();

}


applyTheme();

updatePreview();

};

});


document
.querySelectorAll("[data-hex]")
.forEach(input=>{

input.oninput=()=>{

let value=
input.value
.trim()
.toUpperCase();


if(
value.length===6 &&
!value.startsWith("#")
){

value="#"+value;

}


if(!validColor(value))
return;


const key=
input.dataset.hex;


menuData.theme[key]=
value;


const picker=
document.querySelector(
`[data-color="${key}"]`
);


if(picker){

picker.value=value;

}


applyTheme();

updatePreview();

};

});


document
.querySelectorAll("[data-reset]")
.forEach(button=>{

button.onclick=()=>{

const key=
button.dataset.reset;


menuData.theme[key]=
defaultTheme()[key];


renderAdmin();

};

});

}

/* =========================================================

========================================================= */

async function saveMenu(status){

if(!currentPin){

status.textContent=
"Oturum bulunamadı.";

return;

}


const buttons=
document.querySelectorAll(
".save-button"
);


buttons.forEach(
button=>{

button.disabled=true;

button.textContent=
"KAYDEDİLİYOR…";

}
);


status.textContent=
"Supabase'e kaydediliyor…";


try{

menuData=
normalizeMenu(menuData);


const payload={
cafeName:
menuData.cafeName,

subtitle:
menuData.subtitle,

logo:
menuData.logo,

theme:
menuData.theme,

categories:
menuData.categories

};


/*
ANA KAYDET RPC
*/

const result=
await rpc(
"save_menu",
{
p_menu_id:MENU_ID,
p_pin:currentPin,
p_data:payload
}
);


const explicitlyFalse=
result===false||
result==="false"||
result?.[0]===false||
result?.[0]?.save_menu===false||
result?.result===false;


if(explicitlyFalse){

throw new Error(
"Supabase kaydetmeyi reddetti."
);

}


/*
KAYITTAN SONRA TEKRAR OKU
*/

const rows=
await api(
"/rest/v1/menus?id=eq."+
encodeURIComponent(MENU_ID)+
"&select=id,data"
);


if(!rows||!rows.length){

throw new Error(
"Kaydetme sonrası menü doğrulanamadı."
);

}


menuData=
normalizeMenu(
rows[0].data
);


applyTheme();


status.textContent=
"✓ Kaydedildi";


setTimeout(
()=>{

if(adminOverlay){

adminOverlay.remove();

adminOverlay=null;

}

renderCustomer();

},
700
);


}catch(error){

console.error(
"KAYDET HATASI:",
error
);


status.textContent=
"Hata: "+
(
error.message||
"Menü kaydedilemedi."
);


buttons.forEach(
button=>{

button.disabled=false;

button.textContent=
"✓ KAYDET";

}
);

}

}


/* =========================================================
RESİM
========================================================= */

function resizeImage(
file,
maxSize=600,
quality=.8
){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();


reader.onload=e=>{

const image=
new Image();


image.onload=()=>{

let width=
image.width;

let height=
image.height;


if(
width>maxSize ||
height>maxSize
){

const ratio=
Math.min(
maxSize/width,
maxSize/height
);


width=
Math.round(
width*ratio
);

height=
Math.round(
height*ratio
);

}


const canvas=
document.createElement(
"canvas"
);


canvas.width=
width;

canvas.height=
height;


const ctx=
canvas.getContext("2d");


ctx.drawImage(
image,
0,
0,
width,
height
);


resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};


image.onerror=
reject;


image.src=
e.target.result;

};


reader.onerror=
reject;


reader.readAsDataURL(file);

}
);
