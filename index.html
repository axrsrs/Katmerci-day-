<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Katmerci Dayı</title>

<style>

  --surface:#FFFFFF;

*{

}

html,body{

  padding:0;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

button,input{
  font-family:inherit;
}

.wrap{

  margin:auto;
  padding-bottom:90px;

/* ANA ÜST ALAN */

header.hero{
  padding:32px 22px 25px;
  text-align:center;
  border-bottom:1px solid var(--border-soft);
}

.logo{
  width:92px;
  height:92px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 18px;
  border:1px solid var(--border-soft);

  box-shadow:0 4px 18px rgba(0,0,0,.08);

.logo.hidden{

}

/* KATEGORİLER */

  gap:8px;

.tab-btn{

.category-block{

.category-title{

  font-size:23px;
  font-weight:500;

/* ÜRÜNLER */

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cwofalezjvuxppmwipmc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n9xGFNXF-wl4C-BFLBGmeg_hsKy9GtU";

const MENU_ID =
"00000000-0000-0000-0000-000000000001";

const DEFAULT_PIN="1234";

const BLANK_PIXEL =
"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";


/* =========================
   DEĞİŞKENLER
========================= */

let menuData=null;
let activeCatId=null;
let unlocked=false;
let adminOpen=false;
let currentPin="";

const app=document.getElementById("app");


/* =========================
   GÜVENLİ METİN
========================= */

function esc(s){
  return String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}

function escAttr(s){
  return esc(s);
}


/* =========================
   RENK FONKSİYONLARI
========================= */

function hexRgb(h){
  h=String(h||"").replace("#","");

  if(h.length===3){
    h=h.split("").map(x=>x+x).join("");
  }

  let n=parseInt(h,16);

  return {
    r:n>>16&255,
    g:n>>8&255,
    b:n&255
  };
}

function hex(r,g,b){
  return "#"+[
    r,g,b
  ].map(x=>
    Math.max(0,Math.min(255,Math.round(x)))
      .toString(16)
      .padStart(2,"0")
  ).join("");
}

function light(h,a){
  try{
    let {r,g,b}=hexRgb(h);

    return hex(
      r+(255-r)*a,
      g+(255-g)*a,
      b+(255-b)*a
    );
  }catch{
    return h;
  }
}

function dark(h,a){
  try{
    let {r,g,b}=hexRgb(h);

    return hex(
      r*(1-a),
      g*(1-a),
      b*(1-a)
    );
  }catch{
    return h;
  }
}


/* =========================
   TEMA
========================= */

function applyTheme(theme){

  theme=theme||{};

  let base=theme.baseColor||"#1E6F4C";

  let bg=theme.bg||light(base,.93);
  let surface=theme.surface||"#FFFFFF";
  let raised=theme.surfaceRaised||light(base,.83);
  let accent=theme.accent||base;
  let accentText=theme.accentText||dark(base,.32);
  let ink=theme.ink||dark(base,.72);

  let muted=theme.inkMuted||
    `rgba(${hexRgb(ink).r},${hexRgb(ink).g},${hexRgb(ink).b},.68)`;

  let faint=theme.inkFaint||
    `rgba(${hexRgb(ink).r},${hexRgb(ink).g},${hexRgb(ink).b},.42)`;

  let border=theme.border||
    `rgba(${hexRgb(ink).r},${hexRgb(ink).g},${hexRgb(ink).b},.16)`;

  let r=document.documentElement.style;

  r.setProperty("--bg",bg);
  r.setProperty("--surface",surface);
  r.setProperty("--surface-raised",raised);
  r.setProperty("--accent",accent);
  r.setProperty("--accent-text",accentText);
  r.setProperty("--ink",ink);
  r.setProperty("--ink-muted",muted);
  r.setProperty("--ink-faint",faint);
  r.setProperty("--border-soft",border);

  document
    .querySelector('meta[name="theme-color"]')
    ?.setAttribute("content",accent);
}


/* =========================
   PARA
========================= */

function money(n){
  return (Number(n)||0)
    .toLocaleString("tr-TR")+" ₺";
}


/* =========================
   SUPABASE API
========================= */

async function api(path,opts={}){

  let headers={
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    "Prefer":"return=representation",
    ...(opts.headers||{})
  };

  let res=await fetch(
    SUPABASE_URL+path,
    {
      ...opts,
      headers
    }
  );

  let txt=await res.text();

  let data;

  try{
    data=txt?JSON.parse(txt):null;
  }catch{
    data=txt;
  }

  if(!res.ok){
    throw new Error(
      data?.message||
      data?.error_description||
      data?.hint||
      txt||
      ("HTTP "+res.status)
    );
  }

  return data;
}

async function rpc(name,args){
  return api(
    "/rest/v1/rpc/"+name,
    {
      method:"POST",
      body:JSON.stringify(args)
    }
  );
}


/* =========================
   MENÜ YÜKLE
========================= */

async function loadMenu(){

  try{

    let rows=await api(
      "/rest/v1/menus?id=eq."
      +MENU_ID+
      "&select=id,data"
    );

    if(!rows.length){
      showError("Menü kaydı bulunamadı.");
      return;
    }

    let d=rows[0].data||{};

    menuData={
      cafeName:d.cafeName||"Katmerci Dayı",
      subtitle:d.subtitle||"",
      logo:d.logo||"",
      theme:d.theme||{
        baseColor:"#1E6F4C"
      },
      categories:
        Array.isArray(d.categories)
        ?d.categories
        :[]
    };

    menuData.categories.forEach(c=>{
      if(!Array.isArray(c.items)){
        c.items=[];
      }

      c.items.forEach(i=>{
        if(i.image===undefined){
          i.image="";
        }

        if(i.available===undefined){
          i.available=true;
        }
      });
    });

    activeCatId=
      menuData.categories[0]?.id||null;

    applyTheme(menuData.theme);

    renderCustomer();

  }catch(e){

    showError(
      "Menü yüklenemedi: "+e.message
    );
  }
}


/* =========================
   HATA
========================= */

function showError(m){

  app.innerHTML=
  `<div class="loading">
    <b>Menü yüklenemedi</b>
    <br><br>
    ${esc(m)}
  </div>`;
}


/* =========================
   MÜŞTERİ MENÜSÜ
========================= */

function renderCustomer(){

  if(!menuData)return;

  let cats=menuData.categories;

  let active=
    cats.find(c=>c.id===activeCatId)
    ||cats[0];

  if(active){
    activeCatId=active.id;
  }

  let logoHtml="";

  if(menuData.logo){

    logoHtml=
    `<img
      class="logo"
      src="${escAttr(menuData.logo)}"
      alt="Katmerci Dayı"
      onerror="this.style.display='none'"
    >`;
  }

  let tabs=cats.map(c=>
    `<button
      class="tab-btn ${c.id===active?.id?"active":""}"
      data-cat="${escAttr(c.id)}"
    >
      ${esc(c.name)}
    </button>`
  ).join("");

  let items=active
    ?active.items.map(it=>

      `<div class="item-row">

        ${
          it.image
          ?
          `<img
            class="item-thumb"
            src="${escAttr(it.image)}"
            alt=""
            loading="lazy"
          >`
          :""
        }

        <div class="item-text-row">

          <div class="item-name-wrap">

            <div class="item-name ${
              it.available?"":"unavailable"
            }">

              ${esc(it.name)}

              ${
                it.available
                ?""
                :
                '<span class="sold-out-tag">TÜKENDİ</span>'
              }

            </div>

            ${
              it.desc
              ?
              `<div class="item-desc">
                ${esc(it.desc)}
              </div>`
              :""
            }

          </div>

          <div class="leader"></div>

          <div class="item-price ${
            it.available?"":"unavailable"
          }">
            ${money(it.price)}
          </div>

        </div>

      </div>`

    ).join("")

    :
    `<div class="item-desc">
      Bu kategoride henüz ürün yok.
    </div>`;

  app.innerHTML=

  `<header class="hero">

    ${logoHtml}

    <div class="eyebrow">
      Menü
    </div>

    <h1 class="cafe-name">
      ${esc(menuData.cafeName)}
    </h1>

    <p class="subtitle">
      ${esc(menuData.subtitle)}
    </p>

  </header>

  <nav class="tabs">
    ${tabs}
  </nav>

  <div class="category-block">

    <div class="category-title">
      ${esc(active?.name||"")}
    </div>

    ${items}

  </div>

  <footer class="note">
    QR ile açıldı · fiyatlara KDV dahildir
  </footer>`;

  app
    .querySelectorAll("[data-cat]")
    .forEach(b=>{

      b.onclick=()=>{
        activeCatId=b.dataset.cat;
        renderCustomer();
        window.scrollTo({
          top:0,
          behavior:"smooth"
        });
      };

    });
}


/* =========================
   TOAST
========================= */

function toast(m){

  let t=document.getElementById("toast");

  t.textContent=m;
  t.style.display="block";

  setTimeout(()=>{
    t.style.display="none";
  },2200);
}


/* =========================
   PIN
========================= */

function openGate(){

  if(unlocked){
    openAdmin();
    return;
  }

  let o=document.createElement("div");

  o.className="overlay";

  o.innerHTML=

  `<div class="panel panel-rel pin-box">

    <button
      class="close-x"
      aria-label="Kapat"
    >✕</button>

    <h2>
      Yönetim Girişi
    </h2>

    <label>
      PIN kodu
    </label>

    <input
      id="gatePin"
      type="password"
      inputmode="numeric"
      maxlength="20"
      placeholder="••••"
    >

    <div
      class="status-msg"
      id="gateMsg"
    ></div>

    <button
      class="btn btn-primary btn-block"
      id="gateGo"
    >
      Giriş yap
    </button>

  </div>`;

  document.body.appendChild(o);

  o.querySelector(".close-x").onclick=
    ()=>o.remove();

  let go=async()=>{

    let p=
      o.querySelector("#gatePin")
        .value
        .trim();

    let msg=
      o.querySelector("#gateMsg");

    if(!p){
      msg.textContent="PIN gir.";
      return;
    }

    try{

      let ok=await rpc(
        "check_menu_pin",
        {
          p_menu_id:MENU_ID,
          p_pin:p
        }
      );

      if(
        ok===true||
        ok?.[0]===true||
        ok?.result===true
      ){

        unlocked=true;
        currentPin=p;

        o.remove();

        openAdmin();

      }else{

        msg.textContent="Hatalı PIN.";

      }

    }catch(e){

      msg.textContent=
        "Giriş hatası: "+e.message;

    }
  };

  o.querySelector("#gateGo").onclick=go;

  o.querySelector("#gatePin").onkeydown=e=>{
    if(e.key==="Enter"){
      go();
    }
  };

  setTimeout(()=>{
    o.querySelector("#gatePin")?.focus();
  },100);
}


/* =========================
   GÖRSEL SIKIŞTIR
========================= */

function resizeImage(
  file,
  max=800,
  q=.78
){

  return new Promise((res,rej)=>{

    let r=new FileReader();

    r.onload=e=>{

      let im=new Image();

      im.onload=()=>{

        let w=im.width;
        let h=im.height;

        if(w>h&&w>max){

          h*=max/w;
          w=max;

        }else if(h>=w&&h>max){

          w*=max/h;
          h=max;
        }

        let c=
          document.createElement("canvas");

        c.width=Math.round(w);
        c.height=Math.round(h);

        let ctx=c.getContext("2d");

        ctx.drawImage(
          im,
          0,
          0,
          c.width,
          c.height
        );

        res(
          c.toDataURL(
            "image/jpeg",
            q
          )
        );
      };

      im.onerror=rej;

      im.src=e.target.result;
    };

    r.onerror=rej;

    r.readAsDataURL(file);
  });
}


/* =========================
   ÜRÜN BUL
========================= */

function findItem(id){

  for(let c of menuData.categories){

    let i=
      c.items.find(x=>x.id===id);

    if(i)return i;
  }

  return null;
}


/* =========================
   YÖNETİM PANELİ
========================= */

function renderAdmin(){

  let o=
    document.getElementById(
      "adminOverlay"
    );

  let cats=
    menuData.categories.map(c=>

    `<div class="cat-header">

      <input
        data-cat-name="${escAttr(c.id)}"
        value="${escAttr(c.name)}"
      >

      <button
        class="btn btn-danger"
        data-del-cat="${escAttr(c.id)}"
      >
        Kategoriyi sil
      </button>

    </div>

    ${
      c.items.map(i=>

      `<div class="item-edit-card">

        <label>
          Ürün adı
        </label>

        <input
          data-item-name="${i.id}"
          value="${escAttr(i.name)}"
        >

        <label>
          Açıklama
        </label>

        <input
          data-item-desc="${i.id}"
          value="${escAttr(i.desc||"")}"
        >

        <label>
          Fiyat (₺)
        </label>

        <input
          type="number"
          min="0"
          step="1"
          data-item-price="${i.id}"
          value="${Number(i.price)||0}"
        >

        <label>
          Görsel
        </label>

        <div class="img-row">

          <img
            class="admin-thumb"
            data-preview="${i.id}"
            src="${
              i.image
              ?escAttr(i.image)
              :BLANK_PIXEL
            }"
          >

          <div class="img-controls">

            <input
              type="file"
              accept="image/*"
              data-file="${i.id}"
            >

            <input
              data-url="${i.id}"
              placeholder="veya görsel linki"
              value="${
                i.image?.startsWith("http")
                ?escAttr(i.image)
                :""
              }"
            >

            <button
              class="btn btn-ghost"
              data-remove-img="${i.id}"
            >
              Görseli kaldır
            </button>

          </div>

        </div>

        <label class="avail-toggle">

          <input
            type="checkbox"
            data-avail="${i.id}"
            ${i.available?"checked":""}
          >

          Stokta / satışta

        </label>

        <div class="actions-row">

          <button
            class="btn btn-danger"
            data-del-item="${i.id}"
            data-cat="${c.id}"
          >
            Ürünü sil
          </button>

        </div>

      </div>`

      ).join("")
    }

    <button
      class="btn btn-ghost btn-block"
      data-add-item="${c.id}"
    >
      + Ürün ekle
    </button>`

  ).join("");


  let theme=menuData.theme||{};

  let base=theme.baseColor||"#1E6F4C";

  let bg=theme.bg||light(base,.93);
  let surface=theme.surface||"#FFFFFF";
  let raised=theme.surfaceRaised||light(base,.83);
  let accent=theme.accent||base;
  let accentText=theme.accentText||dark(base,.32);
  let ink=theme.ink||dark(base,.72);


  o.innerHTML=

  `<div class="panel panel-rel">

    <button
      class="close-x"
      id="adminClose"
    >
      ✕
    </button>

    <h2>
      Yönetim Paneli
    </h2>


    <label>
      Kafe adı
    </label>

    <input
      id="cafeName"
      value="${escAttr(menuData.cafeName)}"
    >


    <label>
      Alt başlık
    </label>

    <input
      id="subtitle"
      value="${escAttr(menuData.subtitle)}"
    >


    <label>
      Logo
    </label>

    ${
      menuData.logo
      ?
      `<img
        class="logo-admin"
        id="logoPreview"
        src="${escAttr(menuData.logo)}"
      >`
      :
      `<img
        class="logo-admin"
        id="logoPreview"
        src="${BLANK_PIXEL}"
        style="display:none"
      >`
    }

    <input
      type="file"
      id="logoFile"
      accept="image/*"
    >

    <input
      id="logoUrl"
      placeholder="veya logo linki"
      value="${
        menuData.logo?.startsWith("http")
        ?escAttr(menuData.logo)
        :""
      }"
    >


    ${cats}


    <button
      class="btn btn-ghost btn-block"
      id="addCat"
    >
      + Yeni kategori
    </button>


    <hr
      style="
        border:none;
        border-top:1px solid var(--border-soft);
        margin:25px 0;
      "
    >


    <label>
      Tema renkleri
    </label>

    <div class="color-grid">

      <div class="color-box">
        <span>Arka plan</span>
        <input
          type="color"
          id="colorBg"
          value="${bg}"
        >
      </div>

      <div class="color-box">
        <span>Kartlar</span>
        <input
          type="color"
          id="colorSurface"
          value="${surface}"
        >
      </div>

      <div class="color-box">
        <span>Kart içi</span>
        <input
          type="color"
          id="colorRaised"
          value="${raised}"
        >
      </div>

      <div class="color-box">
        <span>Ana renk</span>
        <input
          type="color"
          id="colorAccent"
          value="${accent}"
        >
      </div>

      <div class="color-box">
        <span>Başlık rengi</span>
        <input
          type="color"
          id="colorAccentText"
          value="${accentText}"
        >
      </div>

      <div class="color-box">
        <span>Yazı rengi</span>
        <input
          type="color"
          id="colorInk"
          value="${ink}"
        >
      </div>

    </div>


    <label>
      Yeni PIN
    </label>

    <div class="row-2">

      <input
        id="newPin"
        type="password"
        inputmode="numeric"
        placeholder="En az 4 hane"
      >

      <button
        class="btn btn-ghost"
        id="changePin"
      >
        Değiştir
      </button>

    </div>


    <div
      class="status-msg"
      id="adminMsg"
    ></div>


    <button
      class="btn btn-primary btn-block"
      id="saveMenu"
    >
      Kaydet
    </button>

  </div>`;


  /* KAFE */

  o.querySelector("#cafeName").oninput=e=>{
    menuData.cafeName=e.target.value;
  };

  o.querySelector("#subtitle").oninput=e=>{
    menuData.subtitle=e.target.value;
  };


  /* LOGO */

  let logoFile=
    o.querySelector("#logoFile");

  let logoUrl=
    o.querySelector("#logoUrl");

  let logoPreview=
    o.querySelector("#logoPreview");


  logoFile.onchange=async()=>{

    let f=logoFile.files?.[0];

    if(!f)return;

    try{

      menuData.logo=
        await resizeImage(
          f,
          1000,
          .85
        );

      logoPreview.src=
        menuData.logo;

      logoPreview.style.display=
        "block";

      logoUrl.value="";

    }catch{

      toast("Logo yüklenemedi");

    }
  };


  logoUrl.oninput=e=>{

    let v=e.target.value.trim();

    menuData.logo=v;

    if(v){

      logoPreview.src=v;
      logoPreview.style.display="block";

    }else{

      logoPreview.style.display="none";
    }
  };


  /* KATEGORİ */

  o.querySelectorAll(
    "[data-cat-name]"
  ).forEach(x=>{

    x.oninput=e=>{

      let c=
        menuData.categories.find(
          c=>c.id===x.dataset.catName
        );

      if(c){
        c.name=e.target.value;
      }
    };

  });


  /* ÜRÜN ADI */

  o.querySelectorAll(
    "[data-item-name]"
  ).forEach(x=>{

    x.oninput=e=>{

      let i=
        findItem(x.dataset.itemName);

      if(i){
        i.name=e.target.value;
      }
    };

  });


  /* AÇIKLAMA */

  o.querySelectorAll(
    "[data-item-desc]"
  ).forEach(x=>{

    x.oninput=e=>{

      let i=
        findItem(x.dataset.itemDesc);

      if(i){
        i.desc=e.target.value;
      }
    };

  });


  /* FİYAT */

  o.querySelectorAll(
    "[data-item-price]"
  ).forEach(x=>{

    x.oninput=e=>{

      let i=
        findItem(x.dataset.itemPrice);

      if(i){
        i.price=
          Number(e.target.value)||0;
      }
    };

  });


  /* STOK */

  o.querySelectorAll(
    "[data-avail]"
  ).forEach(x=>{

    x.onchange=e=>{

      let i=
        findItem(x.dataset.avail);

      if(i){
        i.available=
          e.target.checked;
      }
    };

  });


  /* ÜRÜN SİL */

  o.querySelectorAll(
    "[data-del-item]"
  ).forEach(b=>{

    b.onclick=()=>{

      let c=
        menuData.categories.find(
          c=>c.id===b.dataset.cat
        );

      if(c){

        c.items=
          c.items.filter(
            i=>i.id!==b.dataset.delItem
          );

        renderAdmin();
      }
    };

  });


  /* ÜRÜN EKLE */

  o.querySelectorAll(
    "[data-add-item]"
  ).forEach(b=>{

    b.onclick=()=>{

      let c=
        menuData.categories.find(
          c=>c.id===b.dataset.addItem
        );

      if(c){

        c.items.push({
          id:
            "i"+
            Date.now().toString(36)+
            Math.random()
              .toString(36)
              .slice(2,7),

          name:"Yeni ürün",
          desc:"",
          price:0,
          available:true,
          image:""
        });

        renderAdmin();
      }
    };

  });


  /* KATEGORİ SİL */

  o.querySelectorAll(
    "[data-del-cat]"
  ).forEach(b=>{

    b.onclick=()=>{

      if(
        confirm(
          "Kategori ve içindeki ürünler silinsin mi?"
        )
      ){

        menuData.categories=
          menuData.categories.filter(
            c=>c.id!==b.dataset.delCat
          );

        if(
          activeCatId===b.dataset.delCat
        ){
          activeCatId=
            menuData.categories[0]?.id||null;
        }

        renderAdmin();
      }
    };

  });


  /* GÖRSEL DOSYASI */

  o.querySelectorAll(
    "[data-file]"
  ).forEach(x=>{

    x.onchange=async()=>{

      let f=x.files?.[0];

      if(!f)return;

      try{

        let i=
          findItem(x.dataset.file);

        i.image=
          await resizeImage(
            f,
            800,
            .78
          );

        renderAdmin();

      }catch{

        toast(
          "Görsel yüklenemedi"
        );
      }
    };

  });


  /* GÖRSEL LİNK */

  o.querySelectorAll(
    "[data-url]"
  ).forEach(x=>{

    x.oninput=e=>{

      let i=
        findItem(x.dataset.url);

      if(!i)return;

      i.image=
        e.target.value.trim();

      let p=
        o.querySelector(
          `[data-preview="${i.id}"]`
        );

      if(p){

        p.src=
          i.image||
          BLANK_PIXEL;
      }
    };

  });


  /* GÖRSEL SİL */

  o.querySelectorAll(
    "[data-remove-img]"
  ).forEach(b=>{

    b.onclick=()=>{

      let i=
        findItem(
          b.dataset.removeImg
        );

      if(i){

        i.image="";

        renderAdmin();
      }
    };

  });


  /* KATEGORİ EKLE */

  o.querySelector("#addCat").onclick=()=>{

    menuData.categories.push({

      id:
        "c"+
        Date.now().toString(36)+
        Math.random()
          .toString(36)
          .slice(2,7),

      name:"Yeni kategori",

      items:[]
    });

    renderAdmin();
  };


  /* RENKLER */

  function updateColor(){

    menuData.theme={
      ...(menuData.theme||{}),

      baseColor:
        o.querySelector("#colorAccent").value,

      bg:
        o.querySelector("#colorBg").value,

      surface:
        o.querySelector("#colorSurface").value,

      surfaceRaised:
        o.querySelector("#colorRaised").value,

      accent:
        o.querySelector("#colorAccent").value,

      accentText:
        o.querySelector("#colorAccentText").value,

      ink:
        o.querySelector("#colorInk").value
    };

    applyTheme(
      menuData.theme
    );
  }


  [
    "#colorBg",
    "#colorSurface",
    "#colorRaised",
    "#colorAccent",
    "#colorAccentText",
    "#colorInk"
  ].forEach(sel=>{

    o.querySelector(sel).oninput=
      updateColor;

  });


  /* PIN DEĞİŞTİR */

  o.querySelector(
    "#changePin"
  ).onclick=async()=>{

    let n=
      o.querySelector(
        "#newPin"
      ).value.trim();

    let m=
      o.querySelector(
        "#adminMsg"
      );

    if(n.length<4){

      m.textContent=
        "PIN en az 4 hane olmalı.";

      return;
    }

    try{

      let ok=
        await rpc(
          "change_menu_pin",
          {
            p_menu_id:MENU_ID,
            p_old_pin:currentPin,
            p_new_pin:n
          }
        );

      if(
        ok===true||
        ok?.[0]===true||
        ok?.result===true
      ){

        currentPin=n;

        m.textContent=
          "PIN değiştirildi.";

      }else{

        m.textContent=
          "PIN değiştirilemedi.";
      }

    }catch(e){

      m.textContent=
        "Hata: "+e.message;
    }
  };


  /* KAYDET */

  o.querySelector(
    "#saveMenu"
  ).onclick=async()=>{

    let m=
      o.querySelector(
        "#adminMsg"
      );

    m.textContent=
      "Kaydediliyor…";

    try{

      /*
        ÖNEMLİ:
        Logo dahil mevcut verilerin tamamını
        Supabase'e gönderiyoruz.
      */

      let payload={

        cafeName:
          menuData.cafeName,

        subtitle:
          menuData.subtitle,

        logo:
          menuData.logo||"",

        theme:
          menuData.theme,

        categories:
          menuData.categories
      };


      let ok=
        await rpc(
          "save_menu",
          {
            p_menu_id:MENU_ID,
            p_pin:currentPin,
            p_data:payload
          }
        );


      if(
        ok===true||
        ok?.[0]===true||
        ok?.result===true
      ){

        m.textContent=
          "Kaydedildi ✓";

        setTimeout(()=>{

          o.remove();

          adminOpen=false;

          applyTheme(
            menuData.theme
          );

          renderCustomer();

          toast(
            "Menü kaydedildi ✓"
          );

        },500);

      }else{

        m.textContent=
          "Kaydedilemedi.";
      }

    }catch(e){

      m.textContent=
        "Hata: "+e.message;
    }
  };


  /* KAPAT */

  o.querySelector(
    "#adminClose"
  ).onclick=()=>{

    o.remove();

    adminOpen=false;

    loadMenu();
  };
}


/* =========================
   ADMIN AÇ
========================= */

function openAdmin(){

  adminOpen=true;

  let o=
    document.createElement("div");

  o.className="overlay";
  o.id="adminOverlay";

  document.body.appendChild(o);

  renderAdmin();
}


/* =========================
   YÖNETİM BUTONU
========================= */

document
  .getElementById("adminDot")
  .onclick=openGate;

document
  .getElementById("adminDot")
  .onkeydown=e=>{

    if(e.key==="Enter"){
      openGate();
    }
  };


/* =========================
   BAŞLAT
========================= */

loadMenu();

</script>
