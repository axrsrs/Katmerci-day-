<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#F6F1E2">
<title>Kafe Menü</title>

<style>
:root{
  --bg:#F6F1E2;
  --header:#F6F1E2;
  --surface:#FFFFFF;
  --surface-raised:#ECE2C7;
  --category-bg:#1E6F4C;
  --category-text:#FFFFFF;
  --accent:#1E6F4C;
  --accent-text:#134A32;
  --ink:#20261D;
  --ink-muted:#6E6A52;
  --price:#1E6F4C;
  --button:#1E6F4C;
  --button-text:#FFFFFF;
  --border:#D8D0B9;
  --danger:#A9433A;
  --tab-bg:#FFFFFF;
  --tab-text:#6E6A52;
  --tab-active:#1E6F4C;
  --sold:#A9433A;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

button,input{
  font-family:inherit;
}

.wrap{
  max-width:640px;
  margin:auto;
  padding-bottom:100px;
}

header.hero{
  background:var(--header);
  padding:38px 24px 30px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

.logo-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.logo{
  width:110px;
  height:110px;
  object-fit:contain;
  border-radius:18px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--accent-text);
  margin-bottom:14px;
}

h1.cafe-name{
  font-family:Georgia,serif;
  font-weight:600;
  font-size:clamp(34px,9vw,52px);
  margin:0 0 10px;
  line-height:1.05;
}

.subtitle{
  color:var(--ink-muted);
  font-size:15px;
  max-width:420px;
  margin:auto;
  line-height:1.5;
}

nav.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:18px 20px;
  scrollbar-width:none;
  position:sticky;
  top:0;
  background:linear-gradient(var(--bg) 78%,transparent);
  z-index:5;
}

nav.tabs::-webkit-scrollbar{
  display:none;
}

.tab-btn{
  flex:0 0 auto;
  font-size:12.5px;
  padding:9px 16px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--tab-bg);
  color:var(--tab-text);
  white-space:nowrap;
  cursor:pointer;
}

.tab-btn.active{
  background:var(--tab-active);
  border-color:var(--tab-active);
  color:#fff;
  font-weight:600;
}

.category-block{
  padding:6px 22px 8px;
}

.category-title{
  display:inline-block;
  background:var(--category-bg);
  color:var(--category-text);
  font-family:Georgia,serif;
  font-size:21px;
  font-weight:500;
  padding:9px 16px;
  border-radius:12px;
  margin:22px 0 12px;
}

.item-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px dashed var(--border);
}

.item-thumb{
  width:54px;
  height:54px;
  flex:0 0 auto;
  border-radius:10px;
  object-fit:cover;
  border:1px solid var(--border);
  background:var(--surface-raised);
}

.item-text-row{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex:1;
  min-width:0;
}

.item-name-wrap{
  min-width:0;
}

.item-name{
  font-size:16px;
  font-weight:600;
}

.item-name.unavailable{
  color:var(--ink-muted);
  text-decoration:line-through;
}

.item-desc{
  font-size:12.5px;
  color:var(--ink-muted);
  margin-top:2px;
  line-height:1.4;
}

.leader{
  flex:1;
  border-bottom:1px dotted var(--border);
  height:0;
  margin:0 2px 5px;
  min-width:12px;
}

.item-price{
  font-size:15px;
  color:var(--price);
  font-weight:600;
  white-space:nowrap;
}

.item-price.unavailable{
  color:var(--ink-muted);
}

.sold-out-tag{
  font-size:10px;
  color:var(--sold);
  letter-spacing:.08em;
  margin-left:6px;
}

footer.note{
  text-align:center;
  padding:36px 24px 10px;
  color:var(--ink-muted);
  font-size:11.5px;
}

.admin-dot{
  position:fixed;
  bottom:18px;
  right:18px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--ink-muted);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:20;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
  font-size:21px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

@media(min-width:640px){
  .overlay{
    align-items:center;
  }
}

.panel{
  background:var(--surface);
  width:100%;
  max-width:580px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:20px 20px 0 0;
  padding:25px 20px 35px;
  border:1px solid var(--border);
}

@media(min-width:640px){
  .panel{
    border-radius:20px;
  }
}

.panel h2{
  font-family:Georgia,serif;
  font-size:25px;
  margin:0 0 20px;
  color:var(--accent-text);
}

.panel label{
  display:block;
  font-size:10.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-muted);
  margin:15px 0 6px;
}

.panel input,
.panel textarea{
  width:100%;
  background:var(--surface-raised);
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 12px;
  color:var(--ink);
  font-size:14.5px;
}

.panel input[type=color]{
  padding:3px;
  height:44px;
  cursor:pointer;
}

.row-2{
  display:flex;
  gap:10px;
}

.row-2>div{
  flex:1;
}

.btn{
  font-size:12.5px;
  padding:10px 15px;
  border-radius:9px;
  border:1px solid transparent;
  cursor:pointer;
}

.btn-main{
  background:var(--button);
  color:var(--button-text);
  font-weight:600;
}

.btn-ghost{
  background:var(--surface);
  border-color:var(--border);
  color:var(--ink);
}

.btn-danger{
  background:var(--surface);
  border-color:var(--danger);
  color:var(--danger);
}

.btn-block{
  width:100%;
  display:block;
  text-align:center;
  margin-top:9px;
}

.save-button{
  margin-top:28px;
  padding:15px;
  font-size:15px;
  border-radius:12px;
}

.item-edit-card{
  background:var(--surface-raised);
  border:1px solid var(--border);
  border-radius:11px;
  padding:14px;
  margin-top:12px;
}

.cat-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:27px;
  padding-bottom:9px;
  border-bottom:1px solid var(--border);
}

.cat-header input{
  font-family:Georgia,serif;
  font-size:18px;
  color:var(--accent-text);
  border:none;
  background:transparent;
  padding:3px 0;
}

.avail-toggle{
  display:flex!important;
  align-items:center;
  gap:7px;
  font-size:12px!important;
  color:var(--ink-muted)!important;
  margin-top:10px!important;
}

.avail-toggle input{
  width:auto;
}

.actions-row{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.status-msg{
  font-size:12px;
  color:var(--accent-text);
  margin-top:11px;
  min-height:17px;
}

.pin-box{
  text-align:center;
}

.pin-box input{
  text-align:center;
  font-size:20px;
  letter-spacing:.3em;
}

.close-x{
  position:absolute;
  top:14px;
  right:16px;
  background:none;
  border:none;
  color:var(--ink-muted);
  font-size:21px;
  cursor:pointer;
}

.panel-rel{
  position:relative;
}

.loading{
  text-align:center;
  padding:45vh 20px 20px;
  color:var(--ink-muted);
  font-size:14px;
}

.error-box{
  padding:100px 25px;
  text-align:center;
  color:var(--ink);
}

.error-box h2{
  font-family:Georgia,serif;
}

.color-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.color-item{
  background:var(--surface-raised);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
}

.color-item label{
  margin:0 0 7px;
}

.color-item input[type=color]{
  width:100%;
  height:42px;
}

.logo-preview{
  width:90px;
  height:90px;
  border-radius:15px;
  object-fit:contain;
  border:1px solid var(--border);
  background:#fff;
  display:block;
  margin:8px auto 12px;
}

.img-row{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-top:7px;
}

.admin-thumb{
  width:64px;
  height:64px;
  border-radius:10px;
  object-fit:cover;
  flex:0 0 auto;
  border:1px solid var(--border);
  background:#fff;
}

.img-controls{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.img-controls input[type=file]{
  padding:7px;
  font-size:12px;
}

hr.sep{
  border:none;
  border-top:1px solid var(--border);
  margin:25px 0;
}

.toast{
  position:fixed;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  background:#20261D;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  font-size:13px;
  z-index:100;
  display:none;
  white-space:nowrap;
}

.connection-error{
  margin-top:20px;
  padding:12px;
  border-radius:10px;
  background:#fff;
  border:1px solid var(--border);
  text-align:left;
  font-size:12px;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="wrap" id="app">
  <div class="loading">Menü yükleniyor...</div>
</div>

<div
  class="admin-dot"
  id="adminDot"
  title="Yönetim"
  role="button"
  tabindex="0"
  aria-label="Yönetim panelini aç"
>⚙️</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   SUPABASE AYARLARI
========================================================= */

const SUPABASE_URL =
"https://cwofalezjvuxppmwipmc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n9xGFNXF-wl4C-BFLBGmeg_hsKy9GtU";

const MENU_ID =
"00000000-0000-0000-0000-000000000001";

const BLANK_PIXEL =
"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";


/* =========================================================
   DURUM
========================================================= */

let menuData = null;
let activeCatId = null;
let unlocked = false;
let currentPin = "";


/* =========================================================
   YARDIMCI
========================================================= */

const app = document.getElementById("app");

function uid(){
  return "i" +
    Date.now().toString(36) +
    Math.random().toString(36).slice(2,7);
}

function esc(s){
  return String(s ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}

function escAttr(s){
  return esc(s);
}

function money(n){
  return (
    Number(n)||0
  ).toLocaleString("tr-TR") + " ₺";
}

function toast(message){
  const t = document.getElementById("toast");

  t.textContent = message;
  t.style.display = "block";

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(()=>{
    t.style.display = "none";
  },2200);
}


/* =========================================================
   SUPABASE REST
   Publishable key sadece apikey olarak kullanılıyor.
========================================================= */

async function api(path, options = {}){

  const headers = {
    "apikey": SUPABASE_KEY,
    "Accept":"application/json",
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  const controller = new AbortController();

  const timeout = setTimeout(()=>{
    controller.abort();
  },15000);

  try{

    const response = await fetch(
      SUPABASE_URL + path,
      {
        ...options,
        cache:"no-store",
        headers,
        signal:controller.signal
      }
    );

    const text = await response.text();

    let data = null;

    if(text){

      try{
        data = JSON.parse(text);
      }catch{
        data = text;
      }

    }

    if(!response.ok){

      let detail =
        data?.message ||
        data?.error_description ||
        data?.hint ||
        data?.error ||
        (
          typeof data === "string"
          ? data
          : ""
        );

      throw new Error(
        "HTTP " +
        response.status +
        (detail ? " - " + detail : "")
      );

    }

    return data;

  }catch(error){

    if(error.name === "AbortError"){
      throw new Error(
        "Supabase bağlantısı zaman aşımına uğradı."
      );
    }

    throw error;

  }finally{

    clearTimeout(timeout);

  }

}


/* =========================================================
   RPC
========================================================= */

async function rpc(functionName,args){

  return await api(
    "/rest/v1/rpc/" +
    encodeURIComponent(functionName),
    {
      method:"POST",
      body:JSON.stringify(args)
    }
  );

}


/* =========================================================
   VARSAYILAN TEMA
========================================================= */

function defaultTheme(){

  return {

    background:"#F6F1E2",
    header:"#F6F1E2",
    surface:"#FFFFFF",
    surfaceRaised:"#ECE2C7",

    baseColor:"#1E6F4C",
    accentText:"#134A32",

    categoryBg:"#1E6F4C",
    categoryText:"#FFFFFF",

    text:"#20261D",
    mutedText:"#6E6A52",

    price:"#1E6F4C",

    button:"#1E6F4C",
    buttonText:"#FFFFFF",

    border:"#D8D0B9",

    tabBg:"#FFFFFF",
    tabText:"#6E6A52",
    tabActive:"#1E6F4C",

    sold:"#A9433A"

  };

}


/* =========================================================
   TEMA UYGULA
========================================================= */

function applyTheme(theme){

  const t =
    {
      ...defaultTheme(),
      ...(theme || {})
    };

  const root =
    document.documentElement;

  root.style.setProperty(
    "--bg",
    t.background
  );

  root.style.setProperty(
    "--header",
    t.header
  );

  root.style.setProperty(
    "--surface",
    t.surface
  );

  root.style.setProperty(
    "--surface-raised",
    t.surfaceRaised
  );

  root.style.setProperty(
    "--category-bg",
    t.categoryBg
  );

  root.style.setProperty(
    "--category-text",
    t.categoryText
  );

  root.style.setProperty(
    "--accent",
    t.baseColor
  );

  root.style.setProperty(
    "--accent-text",
    t.accentText
  );

  root.style.setProperty(
    "--ink",
    t.text
  );

  root.style.setProperty(
    "--ink-muted",
    t.mutedText
  );

  root.style.setProperty(
    "--price",
    t.price
  );

  root.style.setProperty(
    "--button",
    t.button
  );

  root.style.setProperty(
    "--button-text",
    t.buttonText
  );

  root.style.setProperty(
    "--border",
    t.border
  );

  root.style.setProperty(
    "--tab-bg",
    t.tabBg
  );

  root.style.setProperty(
    "--tab-text",
    t.tabText
  );

  root.style.setProperty(
    "--tab-active",
    t.tabActive
  );

  root.style.setProperty(
    "--sold",
    t.sold
  );

}


/* =========================================================
   MENÜYÜ YÜKLE
========================================================= */

async function loadMenu(){

  app.innerHTML =
    `<div class="loading">Menü yükleniyor...</div>`;

  try{

    const path =
      "/rest/v1/menus" +
      "?id=eq." +
      encodeURIComponent(MENU_ID) +
      "&select=id,data";

    const rows =
      await api(path,{
        method:"GET"
      });

    if(!Array.isArray(rows)){

      throw new Error(
        "Supabase geçersiz veri döndürdü."
      );

    }

    if(rows.length === 0){

      throw new Error(
        "Menü kaydı bulunamadı."
      );

    }

    const data =
      rows[0]?.data || {};

    menuData = {

      cafeName:
        data.cafeName ||
        "Katmerci Dayı",

      subtitle:
        data.subtitle ||
        "Geleneksel lezzetler, sıcak sunum.",

      logo:
        data.logo ||
        "",

      theme:{
        ...defaultTheme(),
        ...(data.theme || {})
      },

      categories:
        Array.isArray(data.categories)
        ? data.categories
        : []

    };


    menuData.categories.forEach(
      category=>{

        if(!category.id){
          category.id = uid();
        }

        if(!Array.isArray(category.items)){
          category.items = [];
        }

        category.items.forEach(
          item=>{

            if(!item.id){
              item.id = uid();
            }

            if(item.image === undefined){
              item.image = "";
            }

            if(item.desc === undefined){
              item.desc = "";
            }

            if(item.price === undefined){
              item.price = 0;
            }

            if(item.available === undefined){
              item.available = true;
            }

          }
        );

      }
    );


    activeCatId =
      menuData.categories[0]?.id ||
      null;

    applyTheme(
      menuData.theme
    );

    renderCustomer();

  }catch(error){

    console.error(
      "MENU LOAD ERROR:",
      error
    );

    showError(
      error.message ||
      "Menü yüklenemedi."
    );

  }

}


/* =========================================================
   HATA EKRANI
========================================================= */

function showError(message){

  app.innerHTML = `

    <div class="error-box">

      <h2>Menü yüklenemedi</h2>

      <p>
        ${esc(message)}
      </p>

      <div class="connection-error">

        <strong>Kontrol:</strong><br><br>

        Supabase bağlantısı cevap vermiyor
        veya RLS / Data API yetkisi engelliyor.

        <br><br>

        Menü ID:
        <br>
        ${esc(MENU_ID)}

      </div>

      <button
        class="btn btn-main"
        style="margin-top:18px"
        onclick="location.reload()"
      >
        Tekrar dene
      </button>

    </div>

  `;

}


/* =========================================================
   MÜŞTERİ MENÜSÜ
========================================================= */

function renderCustomer(){

  if(!menuData) return;

  const categories =
    menuData.categories || [];

  let active =
    categories.find(
      c => c.id === activeCatId
    ) || categories[0];

  if(active){
    activeCatId =
      active.id;
  }


  const tabs =
    categories.map(
      category=>`

      <button
        class="tab-btn ${
          category.id === active?.id
          ? "active"
          : ""
        }"
        data-cat="${escAttr(category.id)}"
      >
        ${esc(category.name)}
      </button>

    `
    ).join("");


  const items =
    active
    ? active.items.map(
      item=>`

      <div class="item-row">

        ${
          item.image
          ? `
            <img
              class="item-thumb"
              src="${escAttr(item.image)}"
              alt=""
              loading="lazy"
              onerror="this.style.display='none'"
            >
          `
          : ""
        }

        <div class="item-text-row">

          <div class="item-name-wrap">

            <div class="item-name ${
              item.available
              ? ""
              : "unavailable"
            }">

              ${esc(item.name)}

              ${
                item.available
                ? ""
                : `
                  <span class="sold-out-tag">
                    TÜKENDİ
                  </span>
                `
              }

            </div>

            ${
              item.desc
              ? `
                <div class="item-desc">
                  ${esc(item.desc)}
                </div>
              `
              : ""
            }

          </div>

          <div class="leader"></div>

          <div class="item-price ${
            item.available
            ? ""
            : "unavailable"
          }">

            ${money(item.price)}

          </div>

        </div>

      </div>

      `
    ).join("")

    : `
      <div class="item-desc">
        Bu kategoride henüz ürün yok.
      </div>
    `;


  const logoHTML =
    menuData.logo
    ? `
      <div class="logo-wrap">

        <img
          class="logo"
          src="${escAttr(menuData.logo)}"
          alt="${escAttr(menuData.cafeName)}"
        >

      </div>
    `
    : "";


  app.innerHTML = `

    <header class="hero">

      ${logoHTML}

      <div class="eyebrow">
        MENÜ
      </div>

      <h1 class="cafe-name">
        ${esc(menuData.cafeName)}
      </h1>

      <p class="subtitle">
        ${esc(menuData.subtitle)}
      </p>

    </header>

    ${
      categories.length
      ? `
        <nav class="tabs">
          ${tabs}
        </nav>
      `
      : ""
    }

    <div class="category-block">

      ${
        active
        ? `
          <div class="category-title">
            ${esc(active.name)}

/* =========================================================
   PIN
========================================================= */

function openGate(){

  if(unlocked){

    openAdmin();

    return;

  }


  const overlay =
    document.createElement("div");

  overlay.className =
    "overlay";

  overlay.innerHTML = `

    <div class="panel panel-rel pin-box">

      <button
        class="close-x"
        aria-label="Kapat"
      >
        ✕
      </button>

      <h2>
        Yönetim Girişi
      </h2>

      <label>
        PIN kodu
      </label>

      <input
        id="gatePin"
        type="password"
        inputmode="numeric"
        maxlength="20"
        placeholder="••••"
      >

      <div
        class="status-msg"
        id="gateMsg"
      ></div>

      <button
        class="btn btn-main btn-block"
        id="gateGo"
      >
        Giriş yap
      </button>

    </div>

  `;


  document.body.appendChild(
    overlay
  );


  overlay
    .querySelector(".close-x")
    .onclick = ()=>{
      overlay.remove();
    };


  const go = async ()=>{

    const pin =
      overlay
        .querySelector("#gatePin")
        .value
        .trim();

    const message =
      overlay.querySelector(
        "#gateMsg"
      );


    if(!pin){

      message.textContent =
        "PIN kodunu gir.";

      return;

    }


    message.textContent =
      "Kontrol ediliyor...";


    try{

      const result =
        await rpc(
          "check_menu_pin",
          {
            p_menu_id:MENU_ID,
            p_pin:pin
          }
        );


      const ok =
        result === true ||
        result?.[0] === true ||
        result?.result === true;


      if(ok){

        unlocked = true;

        currentPin = pin;

        overlay.remove();

        openAdmin();

      }else{

        message.textContent =
          "Hatalı PIN.";

      }

    }catch(error){

      console.error(
        "PIN ERROR:",
        error
      );

      message.textContent =
        error.message ||
        "Giriş hatası.";

    }

  };


  overlay
    .querySelector("#gateGo")
    .onclick = go;


  overlay
    .querySelector("#gatePin")
    .onkeydown = event=>{

      if(event.key === "Enter"){
        go();
      }

    };


  setTimeout(()=>{

    overlay
      .querySelector("#gatePin")
      ?.focus();

  },100);

}


/* =========================================================
   RESİM
========================================================= */

function resizeImage(
  file,
  max=700,
  quality=.75
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload = event=>{

        const image =
          new Image();

        image.onload = ()=>{

          let width =
            image.width;

          let height =
            image.height;


          if(width > height && width > max){

            height =
              height * max / width;

            width =
              max;

          }else if(
            height >= width &&
            height > max
          ){

            width =
              width * max / height;

            height =
              max;

          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            Math.round(width);

          canvas.height =
            Math.round(height);


          const context =
            canvas.getContext("2d");

          context.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };

        image.onerror =
          reject;

        image.src =
          event.target.result;

      };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   LOGO
========================================================= */

function resizeLogo(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload = event=>{

        const image =
          new Image();

        image.onload = ()=>{

          const max=800;

          let width =
            image.width;

          let height =
            image.height;


          if(width > height && width > max){

            height =
              height * max / width;

            width=max;

          }else if(
            height >= width &&
            height > max
          ){

            width =
              width * max / height;

            height=max;

          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            Math.round(width);

          canvas.height =
            Math.round(height);


          const context =
            canvas.getContext("2d");

          context.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          context.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );


          resolve(
            canvas.toDataURL(
              "image/png"
            )
          );

        };

        image.onerror =
          reject;

        image.src =
          event.target.result;

      };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}

function findItem(id){

  for(

    of menuData.categories

  return null;

}
