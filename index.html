<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://cwofalezjvuxppmwipmc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_n9xGFNXF-wl4C-BFLBGmeg_hsKy9GtU";


const MENU_ID =
"00000000-0000-0000-0000-000000000001";


const LOCAL_BACKUP_KEY =
"kafe_menu_backup_v6";


const BLANK_PIXEL =
"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";


/* =========================================================
   DURUM
========================================================= */

let menuData=null;

let activeCatId=null;

let unlocked=false;

let currentPin="";


const app=
document.getElementById("app");


/* =========================================================
   YARDIMCI
========================================================= */

function uid(){

return "i"+
Date.now().toString(36)+
Math.random().toString(36).slice(2,8);

}


function esc(s){

return String(s??"").replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m])
);

}


function escAttr(s){

return esc(s);

}


function money(n){

return (
Number(n)||0
).toLocaleString("tr-TR")
+" ₺";

}


function toast(message){

const t=
document.getElementById("toast");

t.textContent=message;

t.style.display="block";

clearTimeout(
window.__toastTimer
);

window.__toastTimer=
setTimeout(()=>{

t.style.display="none";

},2500);

}


/* =========================================================
   LOCAL YEDEK
========================================================= */

function saveLocalBackup(){

try{

localStorage.setItem(
LOCAL_BACKUP_KEY,
JSON.stringify(menuData)
);

}catch(e){

console.warn(e);

}

}


function loadLocalBackup(){

try{

const raw=
localStorage.getItem(
LOCAL_BACKUP_KEY
);

if(!raw)return null;

return JSON.parse(raw);

}catch{

return null;

}

}


/* =========================================================
   SUPABASE API
========================================================= */

async function api(path,options={}){

const headers={

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY,

"Content-Type":
"application/json",

"Accept":
"application/json",

...(options.headers||{})

};


const controller=
new AbortController();


const timeout=
setTimeout(
()=>controller.abort(),
20000
);


try{

const response=
await fetch(
SUPABASE_URL+path,
{

...options,

cache:"no-store",

headers,

signal:controller.signal

}
);


const text=
await response.text();


let data=null;


try{

data=text
?JSON.parse(text)
:null;

}catch{

data=text;

}


if(!response.ok){

throw new Error(

data?.message||
data?.error_description||
data?.hint||
data?.error||
text||
("HTTP "+response.status)

);

}


return data;


}catch(error){

if(
error.name==="AbortError"
){

throw new Error(
"Supabase bağlantısı zaman aşımına uğradı."
);

}

throw error;

}finally{

clearTimeout(timeout);

}

}


/* =========================================================
   RPC
========================================================= */

async function rpc(
functionName,
args
){

return await api(

"/rest/v1/rpc/"+
functionName,

{

method:"POST",

body:
JSON.stringify(args)

}

);

}

background:"#15110D",

header:"#15110D",

surface:"#211A14",

surfaceRaised:"#292016",

baseColor:"#C99A4A",

accentText:"#F5E7CE",

categoryBg:"#8B9560",

categoryText:"#FFF8EA",

text:"#F5EBDD",

mutedText:"#B9AE9D",

price:"#D4A553",

button:"#C99A4A",

buttonText:"#17120D",

border:"#5A4529",

tabBg:"#1C1712",

tabText:"#C4B8A7",

tabActive:"#C99A4A",

sold:"#C45B50"

};

}


/* =========================================================
   TEMA UYGULA
========================================================= */

function applyTheme(t){

t=t||defaultTheme();


const root=
document.documentElement;


root.style.setProperty(
"--bg",
t.background||
"#15110D"
);


root.style.setProperty(
"--header",
t.header||
t.background||
"#15110D"
);


root.style.setProperty(
"--surface",
t.surface||
"#211A14"
);


root.style.setProperty(
"--surface-raised",
t.surfaceRaised||
"#292016"
);


root.style.setProperty(
"--category-bg",
t.categoryBg||
t.baseColor||
"#8B9560"
);


root.style.setProperty(
"--category-text",
t.categoryText||
"#FFF8EA"
);


root.style.setProperty(
"--accent",
t.baseColor||
"#C99A4A"
);


root.style.setProperty(
"--accent-text",
t.accentText||
"#F5E7CE"
);


root.style.setProperty(
"--ink",
t.text||
"#F5EBDD"
);


root.style.setProperty(
"--ink-muted",
t.mutedText||
"#B9AE9D"
);


root.style.setProperty(
"--price",
t.price||
t.baseColor||
"#D4A553"
);


root.style.setProperty(
"--button",
t.button||
t.baseColor||
"#C99A4A"
);


root.style.setProperty(
"--button-text",
t.buttonText||
"#17120D"
);


root.style.setProperty(
"--border",
t.border||
"#5A4529"
);


root.style.setProperty(
"--tab-bg",
t.tabBg||
"#1C1712"
);


root.style.setProperty(
"--tab-text",
t.tabText||
"#C4B8A7"
);


root.style.setProperty(
"--tab-active",
t.tabActive||
t.baseColor||

function normalizeMenu(data){

const result={

d.subtitle||
"Gaziantepten gelen lezzet",

logo:

theme:{

},

categories:

Array.isArray(d.categories)
?d.categories
:[]

};


result.categories.forEach(
cat=>{

if(!cat.id)
cat.id=uid();


if(!cat.name)
cat.name="Kategori";


if(!Array.isArray(cat.items))
cat.items=[];


cat.items.forEach(
item=>{

if(!item.id)
item.id=uid();


if(item.name===undefined)
item.name="Yeni ürün";


if(item.desc===undefined)
item.desc="";


if(item.price===undefined)
item.price=0;


if(item.image===undefined)
item.image="";


if(item.available===undefined)
item.available=true;

}

);

}
);


return result;

}

/* =========================================================
   RESİM BOYUTLANDIR
========================================================= */

function resizeImage(
file,
max=700,
quality=.75
){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();


reader.onload=e=>{

const image=
new Image();


image.onload=()=>{

let w=
image.width;

let h=
image.height;


if(
w>h&&
w>max
){

h=
h*max/w;

w=max;

}
else if(
h>=w&&
h>max
){

w=
w*max/h;

h=max;

}


const canvas=
document.createElement(
"canvas"
);


canvas.width=
Math.round(w);

canvas.height=
Math.round(h);


canvas
.getContext("2d")
.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);


resolve(

canvas.toDataURL(
"image/jpeg",
quality
)

);

};


image.onerror=reject;

image.src=
e.target.result;

};


reader.onerror=reject;

reader.readAsDataURL(file);

});

}


function resizeLogo(file){

return resizeImage(
file,
900,
.92
);

}

id:uid(),

name:"Yeni ürün",

desc:"",

price:0,

available:true,

image:""

});


renderAdmin();

};

});


/* =====================================================
   KATEGORİ SİL
===================================================== */

overlay
.querySelectorAll(
"[data-del-cat]"
)
.forEach(button=>{

button.onclick=()=>{


if(
!confirm(
"Kategori ve ürünleri silinsin mi?"
)
)
return;


menuData.categories=
menuData.categories.filter(
c=>
c.id!==
button.dataset.delCat
);


activeCatId=
menuData.categories[0]?.id||
null;


renderAdmin();

};

});


/* =====================================================
   GÖRSEL DOSYA
===================================================== */

overlay
.querySelectorAll(
"[data-file]"
)
.forEach(input=>{

input.onchange=
async e=>{

const file=
e.target.files?.[0];


if(!file)
return;


try{


const item=
findItem(
input.dataset.file
);


if(!item)
return;


item.image=
await resizeImage(file);


renderAdmin();


}catch{

toast(
"Görsel yüklenemedi."
);

}

};

});


/* =====================================================
   GÖRSEL URL
===================================================== */

overlay
.querySelectorAll(
"[data-url]"
)
.forEach(input=>{

input.oninput=e=>{

const item=
findItem(
input.dataset.url
);


if(!item)
return;


item.image=
e.target.value.trim();


const preview=
overlay.querySelector(
`[data-preview="${CSS.escape(item.id)}"]`
);


if(preview){

preview.src=
item.image||
BLANK_PIXEL;

}

};

});


/* =====================================================
   GÖRSEL SİL
===================================================== */

overlay
.querySelectorAll(
"[data-remove-img]"
)
.forEach(button=>{

button.onclick=()=>{

const item=
findItem(
button.dataset.removeImg
);


if(!item)
return;


item.image="";


renderAdmin();

};

});


/* =====================================================
   YENİ KATEGORİ
===================================================== */

overlay
.querySelector("#addCat")
.onclick=()=>{

menuData.categories.push({

id:uid(),

name:"Yeni kategori",

items:[]

});


renderAdmin();

};


/* =====================================================
   RENKLER
===================================================== */

const colorMap={

colorBackground:"background",

colorHeader:"header",

colorSurface:"surface",

colorRaised:"surfaceRaised",

colorCategory:"categoryBg",

colorCategoryText:"categoryText",

colorText:"text",

colorMuted:"mutedText",

colorPrice:"price",

colorButton:"button",

colorButtonText:"buttonText",

colorBorder:"border",

colorTabBg:"tabBg",

colorTabText:"tabText",

colorTabActive:"tabActive",

colorSold:"sold",

colorAccentText:"accentText"

};


Object.keys(colorMap)
.forEach(id=>{

const input=
overlay.querySelector(
"#"+id
);


if(!input)
return;


input.oninput=e=>{

menuData.theme[
colorMap[id]
]=
e.target.value;


applyTheme(
menuData.theme
);

};

});


/* =====================================================
   KAYDET
===================================================== */

overlay
.querySelector("#saveMenu")
.onclick=
async()=>{


const msg=
overlay.querySelector(
"#adminMsg"
);


const btn=
overlay.querySelector(
"#saveMenu"
);


const payload={

cafeName:
menuData.cafeName,

subtitle:
menuData.subtitle,

logo:
menuData.logo,

theme:
menuData.theme,

categories:
menuData.categories

};


msg.textContent=
"Kaydediliyor...";


btn.disabled=true;

btn.textContent=
"Kaydediliyor...";


try{


const result=
await rpc(

"save_menu",

{

p_menu_id:
MENU_ID,

p_pin:
currentPin,

p_data:
payload

}

);


const explicitlyFalse=

result===false||
result==="false"||
result?.[0]===false||
result?.[0]?.save_menu===false||
result?.result===false;


if(explicitlyFalse){

throw new Error(
"Supabase kaydetmeyi reddetti."
);

}


/* KAYIT SONRASI TEKRAR OKU */

const checkRows=
await api(

"/rest/v1/menus?id=eq."+
encodeURIComponent(MENU_ID)+
"&select=id,data"

);


if(
!checkRows||
!checkRows.length
){

throw new Error(
"Kaydetme sonrası menü okunamadı."
);

}


menuData=
normalizeMenu(
checkRows[0].data
);


saveLocalBackup();


activeCatId=
menuData.categories[0]?.id||
null;


applyTheme(
menuData.theme
);


msg.textContent=
"Kaydedildi ✓";


btn.textContent=
"Kaydedildi ✓";


setTimeout(()=>{

overlay.remove();

renderCustomer();

toast(
"Menü başarıyla kaydedildi ✓"
);

},700);


}catch(error){

console.error(
"KAYDETME HATASI:",
error
);


msg.textContent=
"Hata: "+
(
error?.message||
"Menü kaydedilemedi."
);


btn.disabled=false;

btn.textContent=
"Kaydet";

}

};

}


/* =====================================================
   ADMIN AÇ
===================================================== */

function openAdmin(){

const old=
document.getElementById(
"adminOverlay"
);


if(old)
old.remove();


const overlay=
document.createElement(
"div"
);


overlay.className=
"overlay";


overlay.id=
"adminOverlay";


document.body.appendChild(
overlay
);


renderAdmin();

}


/* =====================================================
   AYAR BUTONU
===================================================== */

document
.getElementById(
"adminDot"
)
.onclick=
openGate;


document
.getElementById(
"adminDot"
)
.onkeydown=e=>{

if(e.key==="Enter")
openGate();

};


/* =====================================================
   BAŞLAT
===================================================== */

loadMenu();


</script>
