function esc(s){

return String(s ?? "").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])

/* =====================================================
   API
===================================================== */

async function api(path,options={}){

const headers={
"apikey":SUPABASE_KEY,
"Content-Type":"application/json",
...(options.headers||{})
};

const controller =
new AbortController();

const timeout =
setTimeout(()=>{
controller.abort();
},15000);

try{

const response =
await fetch(
SUPABASE_URL+path,
{
...options,
cache:"no-store",
headers,
signal:controller.signal
}
);

const text =
await response.text();

let data=null;

try{
data=text?JSON.parse(text):null;
}catch{
data=text;
}

if(!response.ok){

throw new Error(
data?.message ||
data?.error_description ||
data?.hint ||
data?.error ||
text ||
("HTTP "+response.status)
);

}

return data;

}catch(error){

if(error.name==="AbortError"){
throw new Error(
"Supabase bağlantısı zaman aşımına uğradı."
);
}

throw error;

}finally{

clearTimeout(timeout);

}

}


async function rpc(functionName,args){

return await api(
"/rest/v1/rpc/"+functionName,
{
method:"POST",
body:JSON.stringify(args)
}
);

}


function rpcTrue(result){

return (
result===true ||
result?.[0]===true ||
result?.result===true
);

}

/* =====================================================
   MENÜYÜ YÜKLE
===================================================== */

async function loadMenu(){

try{

const rows =
await api(
"/rest/v1/menus?id=eq."+
MENU_ID+
"&select=id,data"
);

if(!rows||!rows.length){

showError(
"Menü kaydı bulunamadı."
);

return;

}

const data =
rows[0].data||{};

menuData={

cafeName:
data.cafeName||
"Katmerci Dayı",

subtitle:
data.subtitle||
"Geleneksel lezzetler, sıcak sunum.",

logo:
data.logo||"",

theme:{
...defaultTheme(),
...(data.theme||{})
},

categories:
Array.isArray(data.categories)
?data.categories:[]

};

menuData.categories.forEach(c=>{

if(!Array.isArray(c.items)){
c.items=[];
}

c.items.forEach(item=>{

if(item.image===undefined){
item.image="";
}

if(item.available===undefined){
item.available=true;
}

});

});

activeCatId =
menuData.categories[0]?.id||null;

applyTheme(menuData.theme);

renderCustomer();

}catch(error){

showError(
"Menü yüklenemedi: "+
error.message
);

}

}

}
);

if(rpcTrue(result)){

unlocked=true;
currentPin=pin;

openAdmin();

}else{

msg.textContent=

}

}catch(error){

msg.textContent=

error.message;

}

};

overlay
.querySelector("#gateGo")
.onclick=go;

overlay
.querySelector("#gatePin")
.onkeydown=e=>{

if(e.key==="Enter"){
go();
}

};

setTimeout(()=>{
overlay
.querySelector("#gatePin")
?.focus();
},100);

}

function resizeImage(file,max=700,quality=.75){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const image=new Image();

image.onload=()=>{

let w=image.width;
let h=image.height;

if(w>h&&w>max){

h=h*max/w;
w=max;

}else if(h>=w&&h>max){

w=w*max/h;
h=max;

}

const canvas=
document.createElement("canvas");

canvas.width=Math.round(w);
canvas.height=Math.round(h);

canvas
.getContext("2d")
.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};

image.onerror=reject;
image.src=e.target.result;

};

reader.onerror=reject;
reader.readAsDataURL(file);

});

}

}

const canvas=
document.createElement("canvas");

canvas.width=Math.round(w);
canvas.height=Math.round(h);

canvas
.getContext("2d")
.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL("image/png")
);

};

image.onerror=reject;
image.src=e.target.result;

};

reader.onerror=reject;
reader.readAsDataURL(file);

}

for(const c of menuData.categories){

return null;

}

function openChangePin(){

const overlay=
document.createElement("div");

overlay.className="overlay";

overlay.innerHTML=`

<div class="panel panel-rel">

<button
class="close-x"
id="pinClose"
>
✕
</button>

<h2>
Parolayı Değiştir
</h2>

<label>
Mevcut PIN
</label>

<input
id="oldPin"
type="password"
inputmode="numeric"
maxlength="20"
placeholder="Mevcut PIN"
>

<label>
Yeni PIN
</label>

<input
id="newPin"
type="password"
inputmode="numeric"
maxlength="20"
placeholder="Yeni PIN"
>

<label>
Yeni PIN tekrar
</label>

<input
id="newPin2"
type="password"
inputmode="numeric"
maxlength="20"
placeholder="Yeni PIN tekrar"
>

<div
class="status-msg"
id="pinMsg"
></div>

<button
class="btn btn-main btn-block"
id="changePinSave"

</button>

</div>

`;

document.body.appendChild(overlay);

overlay
.querySelector("#pinClose")
.onclick=()=>{
overlay.remove();
};

overlay
.querySelector("#changePinSave")
.onclick=async()=>{

const oldPin=
overlay.querySelector("#oldPin")
.value.trim();

const newPin=
overlay.querySelector("#newPin")
.value.trim();

const newPin2=
overlay.querySelector("#newPin2")
.value.trim();

const msg=
overlay.querySelector("#pinMsg");

const button=
overlay.querySelector("#changePinSave");

if(!oldPin){

msg.textContent=
"Mevcut PIN'i gir.";

return;

}

if(!newPin){

msg.textContent=
"Yeni PIN'i gir.";

return;

}

if(newPin.length<4){

msg.textContent=
"Yeni PIN en az 4 karakter olmalı.";

return;

}

if(newPin!==newPin2){

msg.textContent=
"Yeni PIN'ler aynı değil.";

return;

}

button.disabled=true;
button.textContent=
"Değiştiriliyor...";

msg.textContent=
"Kontrol ediliyor...";

try{

const result=
await rpc(
"change_menu_pin",
{
p_menu_id:MENU_ID,
p_old_pin:oldPin,
p_new_pin:newPin
}
);

if(!rpcTrue(result)){

throw new Error(
"Mevcut PIN hatalı veya parola değiştirilemedi."
);

}

currentPin=newPin;

msg.textContent=
"Parola başarıyla değiştirildi ✓";

button.textContent=
"Değiştirildi ✓";

setTimeout(()=>{

overlay.remove();

toast(
"Parola değiştirildi ✓"
);

},800);

}catch(error){

msg.textContent=
error.message;

button.disabled=false;
button.textContent=
"Parolayı değiştir";

}

};

setTimeout(()=>{

overlay
.querySelector("#oldPin")
?.focus();

},100);

}
