<script>

/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://cwofalezjvuxppmwipmc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n9xGFNXF-wl4C-BFLBGmeg_hsKy9GtU";

const MENU_ID =
"00000000-0000-0000-0000-000000000001";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
db:{
schema:"public"
},
auth:{
persistSession:false,
autoRefreshToken:false
}
}
);


/* =========================================================
DURUM
========================================================= */

let menuData=null;

let activeCatId=null;

let unlocked=false;

let currentPin="";

const LOCAL_BACKUP_KEY =
"kafe_menu_backup_v4";

const BLANK_PIXEL =
"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";

const app =
document.getElementById("app");


/* =========================================================
YARDIMCI
========================================================= */

function uid(){

return "i"+
Date.now().toString(36)+
Math.random().toString(36).slice(2,8);

}


function esc(s){

return String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}


function escAttr(s){

return esc(s);

}


function money(n){

return (
Number(n)||0
).toLocaleString("tr-TR")+" ₺";

}


function toast(message){

const t =
document.getElementById("toast");

t.textContent=message;

t.style.display="block";

clearTimeout(
window.__toastTimer
);

window.__toastTimer =
setTimeout(
()=>{
t.style.display="none";
},
2500
);

}


/* =========================================================
LOCAL YEDEK
========================================================= */

function saveLocalBackup(){

try{

localStorage.setItem(
LOCAL_BACKUP_KEY,
JSON.stringify(menuData)
);

}catch(e){

console.warn(
"Local yedek hatası:",
e
);

}

}


function loadLocalBackup(){

try{

const raw =
localStorage.getItem(
LOCAL_BACKUP_KEY
);

if(!raw)return null;

return JSON.parse(raw);

}catch{

return null;

}

}


/* =========================================================
DEFAULT THEME
========================================================= */

function defaultTheme(){

return{

background:"#17130F",

header:"#1D1812",

surface:"#241E17",

surfaceRaised:"#30271D",

baseColor:"#B8894A",

accentText:"#D6B477",

categoryBg:"#7D8A5B",

categoryText:"#F7F0DF",

text:"#F4EBDD",

mutedText:"#B9AA95",

price:"#D3A15B",

button:"#B8894A",

buttonText:"#17130F",

border:"#594A38",

tabBg:"#211B15",

tabText:"#C7B99F",

tabActive:"#B8894A",

sold:"#D06A5D"

};

}


/* =========================================================
THEME
========================================================= */

function applyTheme(t){

t={
...defaultTheme(),
...(t||{})
};

const root =
document.documentElement;

root.style.setProperty(
"--bg",
t.background
);

root.style.setProperty(
"--header",
t.header
);

root.style.setProperty(
"--surface",
t.surface
);

root.style.setProperty(
"--surface-raised",
t.surfaceRaised
);

root.style.setProperty(
"--category-bg",
t.categoryBg
);

root.style.setProperty(
"--category-text",
t.categoryText
);

root.style.setProperty(
"--accent",
t.baseColor
);

root.style.setProperty(
"--accent-text",
t.accentText
);

root.style.setProperty(
"--ink",
t.text
);

root.style.setProperty(
"--ink-muted",
t.mutedText
);

root.style.setProperty(
"--price",
t.price
);

root.style.setProperty(
"--button",
t.button
);

root.style.setProperty(
"--button-text",
t.buttonText
);

root.style.setProperty(
"--border",
t.border
);

root.style.setProperty(
"--tab-bg",
t.tabBg
);

root.style.setProperty(
"--tab-text",
t.tabText
);

root.style.setProperty(
"--tab-active",
t.tabActive
);

root.style.setProperty(
"--sold",
t.sold
);

}


/* =========================================================
NORMALIZE
========================================================= */

function normalizeMenu(data){

const d=data||{};

const result={

cafeName:
d.cafeName||
"Katmerci Dayı",

subtitle:
d.subtitle||
"Geleneksel lezzetler, sıcak sunum.",

logo:
d.logo||"",

theme:{
...defaultTheme(),
...(d.theme||{})
},

categories:
Array.isArray(d.categories)
?d.categories
:[]

};


result.categories.forEach(
cat=>{

if(!cat.id)
cat.id=uid();

if(!cat.name)
cat.name="Kategori";

if(!Array.isArray(cat.items))
cat.items=[];

cat.items.forEach(
item=>{

if(!item.id)
item.id=uid();

if(item.name===undefined)
item.name="Yeni ürün";

if(item.desc===undefined)
item.desc="";

if(item.price===undefined)
item.price=0;

if(item.image===undefined)
item.image="";

if(item.available===undefined)
item.available=true;

}
);

}
);

return result;

}


/* =========================================================
SUPABASE MENÜ OKU
========================================================= */

async function loadMenu(){

try{

app.innerHTML=`
<div class="loading">
Menü yükleniyor...
</div>
`;


console.log(
"Supabase bağlantısı başlatılıyor..."
);


const {
data,
error
} =
await supabaseClient
.from("menus")
.select("id,data")
.eq(
"id",
MENU_ID
)
.maybeSingle();


console.log(
"Supabase sonucu:",
data,
error
);


if(error){

throw new Error(
error.message||
error.details||
error.hint||
"Supabase menüsü okunamadı."
);

}


if(!data){

throw new Error(
"Menü kaydı bulunamadı."
);

}catch(error){

/* =========================================================
RESİM
========================================================= */

function resizeImage(
file,
max=700,
quality=.75
){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();


reader.onload=e=>{

const image =
new Image();


image.onload=()=>{

let w=image.width;

let h=image.height;


if(
w>h&&
w>max
){

h=h*max/w;

w=max;

}
else if(
h>=w&&
h>max
){

w=w*max/h;

h=max;

}


const canvas =
document.createElement(
"canvas"
);


canvas.width =
Math.round(w);

canvas.height =
Math.round(h);


canvas
.getContext("2d")
.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);


resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};


image.onerror=reject;

image.src=e.target.result;

};


reader.onerror=reject;

reader.readAsDataURL(file);

}
);


}


function resizeLogo(file){

return resizeImage(
file,
800,
.9
);

}

/* =========================================================
KAYDET
========================================================= */

overlay
.querySelector(
"#saveMenu"
)
.onclick=
async()=>{

const msg =
overlay.querySelector(
"#adminMsg"
);

const btn =
overlay.querySelector(
"#saveMenu"
);


const payload={

cafeName:
menuData.cafeName,

subtitle:
menuData.subtitle,

logo:
menuData.logo,

theme:
menuData.theme,

categories:
menuData.categories

};


msg.textContent =
"Kaydediliyor...";


btn.disabled=true;

btn.textContent =
"Kaydediliyor...";


try{


console.log(
"Supabase save_menu çağrılıyor..."
);


const {
data,
error
} =
await supabaseClient
.rpc(
"save_menu",
{
p_menu_id:
MENU_ID,

p_pin:
currentPin,

p_data:
payload
}
);


console.log(
"save_menu sonucu:",
data,
error
);


if(error){

throw new Error(
error.message||
error.details||
error.hint||
"Menü kaydedilemedi."
);

}


const explicitlyFalse =
data===false||
data==="false"||
data?.[0]===false||
data?.[0]?.save_menu===false||
data?.result===false;


if(explicitlyFalse){

throw new Error(
"Supabase menüyü kaydetmeyi reddetti."
);

}


/* KAYITTAN SONRA TEKRAR OKU */

const {
data:saved,
error:readError
} =
await supabaseClient
.from("menus")
.select("id,data")
.eq(
"id",
MENU_ID
)
.maybeSingle();


if(readError){

throw new Error(
"Kaydetme sonrası menü okunamadı: "+
readError.message
);

}


if(!saved){

throw new Error(
"Kaydetme sonrası menü bulunamadı."
);

}


menuData =
normalizeMenu(
saved.data
);


saveLocalBackup();


activeCatId =
menuData.categories[0]?.id||
null;


applyTheme(
menuData.theme
);


msg.textContent =
"Kaydedildi ✓";


btn.textContent =
"Kaydedildi ✓";


setTimeout(
()=>{

overlay.remove();

renderCustomer();

toast(
"Menü başarıyla kaydedildi ✓"
);

},
800
);


}catch(error){

console.error(
"KAYDETME HATASI:",
error
);


msg.textContent =
"Hata: "+
(
error?.message||
"Menü kaydedilemedi."
);


btn.disabled=false;

btn.textContent =
"Kaydet";

}

};

}
