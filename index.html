<script>

/* =========================================================

const SUPABASE_URL =

/* =========================================================

========================================================= */

function uid(){

return "i"+
Date.now().toString(36)+
Math.random().toString(36).slice(2,8);

}


function esc(s){

return String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}


function escAttr(s){

return esc(s);

}


function money(n){

return (
Number(n)||0
).toLocaleString("tr-TR")+" ₺";

}


function toast(message){

const t =
document.getElementById("toast");

if(!t)return;

t.textContent=message;

t.style.display="block";

clearTimeout(
window.__toastTimer
);

window.__toastTimer =
setTimeout(
()=>{
t.style.display="none";
},
2500
);

}

   LOCAL YEDEK

localStorage.setItem(
LOCAL_BACKUP_KEY,
JSON.stringify(menuData)
);

/* =========================================================
   NORMALIZE
========================================================= */

function normalizeMenu(data){

const d=data||{};

const result={

cafeName:
d.cafeName||
"Katmerci Dayı",

subtitle:
d.subtitle||
"Geleneksel lezzetler, sıcak sunum.",

logo:
d.logo||"",

theme:{
...defaultTheme(),
...(d.theme||{})
},

categories:
Array.isArray(d.categories)
?d.categories
:[]

};

result.categories.forEach(
cat=>{

if(!cat.id)
cat.id=uid();

if(!cat.name)
cat.name="Kategori";

if(!Array.isArray(cat.items))
cat.items=[];

cat.items.forEach(
item=>{

if(!item.id)
item.id=uid();

if(item.name===undefined)
item.name="Yeni ürün";

if(item.desc===undefined)
item.desc="";

if(item.price===undefined)
item.price=0;

if(item.image===undefined)
item.image="";

if(item.available===undefined)
item.available=true;

}
);

}
);

return result;

}


/* =========================================================
   SUPABASE FETCH
========================================================= */

async function supabaseFetch(
path,
options={}
){

const headers={

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY,

"Content-Type":
"application/json",

"Accept":
"application/json",

...(options.headers||{})

};

const response =
await fetch(
SUPABASE_URL+path,
{
...options,
headers,
cache:"no-store"
}
);

const text =
await response.text();

let data=null;

try{

data =
text
?JSON.parse(text)
:null;

}catch{

data=text;

}

if(!response.ok){

let message="";

if(
data &&
typeof data==="object"
){

message =
data.message||
data.error_description||
data.hint||
data.error||
"";

}

if(!message){

message =
typeof data==="string"
?data
:text;

}

throw new Error(
"HTTP "+
response.status+
": "+
message
);

}

return data;

}


/* =========================================================
   RPC
========================================================= */

async function rpc(
functionName,
args
){

return await supabaseFetch(
"/rest/v1/rpc/"+
encodeURIComponent(functionName),
{
method:"POST",
body:JSON.stringify(args)
}
);

}

async function loadMenu(){

try{

app.innerHTML=`

<div class="loading">

</div>

`;


/*
  Doğrudan REST API.
  supabase-js kullanılmıyor.
*/

await supabaseFetch(
"/rest/v1/menus?id=eq."+
encodeURIComponent(MENU_ID)+
"&select=id,data"
);


if(
!Array.isArray(rows)
){

throw new Error(

);

}


if(
rows.length===0
){

throw new Error(
"Menü kaydı bulunamadı."
);

}


if(
!rows[0].data
){

throw new Error(
"Menü kaydındaki data alanı boş."
);

}


menuData =
normalizeMenu(
rows[0].data
);


saveLocalBackup();


activeCatId =
menuData.categories[0]?.id||
null;


applyTheme(
menuData.theme
);


renderCustomer();


}catch(error){

console.error(
"SUPABASE YÜKLEME HATASI:",
error
);


/*
  Önce local yedek deniyoruz.
*/

const backup =
loadLocalBackup();


if(backup){

menuData =
normalizeMenu(
backup
);

activeCatId =
menuData.categories[0]?.id||
null;

applyTheme(
menuData.theme
);

renderCustomer();

toast(
"Supabase'e ulaşılamadı. Yerel yedek açıldı."
);

return;

}


/*
  Artık sonsuza kadar loading yok.
*/

showError(
"Menü yüklenemedi",
error.message
);

}

}

/* =========================================================
   RESİM
========================================================= */

function resizeImage(
file,
max=700,
quality=.75
){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();


reader.onload=e=>{

const image =
new Image();


image.onload=()=>{

let w=image.width;
let h=image.height;


if(
w>h &&
w>max
){

h =
h*max/w;

w=max;

}
else if(
h>=w &&
h>max
){

w =
w*max/h;

h=max;

}


const canvas =
document.createElement(
"canvas"
);


canvas.width =
Math.round(w);

canvas.height =
Math.round(h);


const ctx =
canvas.getContext(
"2d"
);


ctx.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);


resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};


image.onerror =
()=>reject(
new Error(
"Görsel okunamadı."
)
);

image.src =
e.target.result;

};


reader.onerror =
()=>reject(
new Error(
"Dosya okunamadı."
)
);

reader.readAsDataURL(file);

}
);

}


function resizeLogo(file){

return resizeImage(
file,
800,
.9
);

}

item.id!==
button.dataset.delItem
);


renderAdmin();

};

}
);


/* =========================================================
   ÜRÜN EKLE
========================================================= */

overlay
.querySelectorAll(
"[data-add-item]"
)
.forEach(
button=>{

button.onclick=()=>{

const cat =
menuData.categories.find(
c=>c.id===
button.dataset.addItem
);

if(!cat)
return;


cat.items.push({

id:uid(),

name:"Yeni ürün",

desc:"",

price:0,

available:true,

image:""

});


renderAdmin();

};

}
);


/* =========================================================
   KATEGORİ SİL
========================================================= */

overlay
.querySelectorAll(
"[data-del-cat]"
)
.forEach(
button=>{

button.onclick=()=>{

if(
!confirm(
"Kategori ve ürünleri silinsin mi?"
)
)
return;


menuData.categories =
menuData.categories.filter(
c=>
c.id!==
button.dataset.delCat
);


activeCatId =
menuData.categories[0]?.id||
null;


renderAdmin();

};

}
);


/* =========================================================
   GÖRSEL DOSYA
========================================================= */

overlay
.querySelectorAll(
"[data-file]"
)
.forEach(
input=>{

input.onchange =
async e=>{

const file =
e.target.files?.[0];

if(!file)
return;


try{

const item =
findItem(
input.dataset.file
);

if(!item)
return;


item.image =
await resizeImage(file);


renderAdmin();

}catch(error){

console.error(error);

toast(
"Görsel yüklenemedi."
);

}

};

}
);


/* =========================================================
   GÖRSEL URL
========================================================= */

overlay
.querySelectorAll(
"[data-url]"
)
.forEach(
input=>{

input.oninput=e=>{

const item =
findItem(
input.dataset.url
);

if(!item)
return;


item.image =
e.target.value.trim();


const preview =
overlay.querySelector(
`[data-preview="${CSS.escape(item.id)}"]`
);


if(preview){

preview.src =
item.image||
BLANK_PIXEL;

}

};

}
);


/* =========================================================
   GÖRSEL SİL
========================================================= */

overlay
.querySelectorAll(
"[data-remove-img]"
)
.forEach(
button=>{

button.onclick=()=>{

const item =
findItem(
button.dataset.removeImg
);

if(!item)
return;


item.image="";


renderAdmin();

};

}
);


/* =========================================================
   YENİ KATEGORİ
========================================================= */

overlay
.querySelector(
"#addCat"
)
.onclick=()=>{

menuData.categories.push({

id:uid(),

name:"Yeni kategori",

items:[]

});


renderAdmin();

};


/* =========================================================
   RENKLER
========================================================= */

const colorMap={

colorBackground:
"background",

colorHeader:
"header",

colorSurface:
"surface",

colorRaised:
"surfaceRaised",

colorCategory:
"categoryBg",

colorCategoryText:
"categoryText",

colorText:
"text",

colorMuted:
"mutedText",

colorPrice:
"price",

colorButton:
"button",

colorButtonText:
"buttonText",

colorBorder:
"border",

colorTabBg:
"tabBg",

colorTabText:
"tabText",

colorTabActive:
"tabActive",

colorSold:
"sold",

colorAccentText:
"accentText"

};


Object
.keys(colorMap)
.forEach(
id=>{

const input =
overlay.querySelector(
"#"+id
);

if(!input)
return;


input.oninput=e=>{

menuData.theme[
colorMap[id]
]=
e.target.value;


applyTheme(
menuData.theme
);

};

}
);


/* =========================================================
   KAYDET
========================================================= */

overlay
.querySelector(
"#saveMenu"
)
.onclick =
async()=>{

const msg =
overlay.querySelector(
"#adminMsg"
);

const btn =
overlay.querySelector(
"#saveMenu"
);


const payload={

cafeName:
menuData.cafeName,

subtitle:
menuData.subtitle,

logo:
menuData.logo,

theme:
menuData.theme,

categories:
menuData.categories

};


msg.textContent =
"Kaydediliyor...";

btn.disabled=true;

btn.textContent =
"Kaydediliyor...";


try{

/*
  save_menu RPC
*/

const result =
await rpc(
"save_menu",
{
p_menu_id:
MENU_ID,

p_pin:
currentPin,

p_data:
payload
}
);


console.log(
"SAVE_MENU SONUCU:",
result
);


const explicitlyFalse =
result===false||
result==="false"||
result?.[0]===false||
result?.[0]?.save_menu===false||
result?.result===false;


if(explicitlyFalse){

throw new Error(
"Supabase kaydetme işlemini reddetti."
);

}


/*
  Kayıttan sonra tekrar oku.
*/

const checkRows =
await supabaseFetch(
"/rest/v1/menus?id=eq."+
encodeURIComponent(MENU_ID)+
"&select=id,data"
);


if(
!checkRows ||
!checkRows.length
){

throw new Error(
"Kaydetme sonrası menü tekrar okunamadı."
);

}


menuData =
normalizeMenu(
checkRows[0].data
);


saveLocalBackup();


applyTheme(
menuData.theme
);


msg.textContent =
"Kaydedildi ✓";

btn.textContent =
"Kaydedildi ✓";


setTimeout(
()=>{

overlay.remove();

renderCustomer();

toast(
"Menü başarıyla kaydedildi ✓"
);

},
800
);


}catch(error){

console.error(
"KAYDETME HATASI:",
error
);


msg.textContent =
"Hata: "+
error.message;

btn.disabled=false;

btn.textContent =
"Kaydet";

}

};

}


/* =========================================================
   ADMIN AÇ
========================================================= */

function openAdmin(){

const old =
document.getElementById(
"adminOverlay"
);

if(old)
old.remove();


const overlay =
document.createElement(
"div"
);


overlay.className =
"overlay";


overlay.id =
"adminOverlay";


document.body.appendChild(
overlay
);


renderAdmin();

}


/* =========================================================
   AYAR BUTONU
========================================================= */

document
.getElementById(
"adminDot"
)
.onclick =
openGate;


document
.getElementById(
"adminDot"
)
.onkeydown=e=>{

if(
e.key==="Enter"||
e.key===" "
){

e.preventDefault();

openGate();

}

};


/* =========================================================
   BAŞLAT
========================================================= */

loadMenu();

</script>
