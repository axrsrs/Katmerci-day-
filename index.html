<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>Katmerci Dayı Menü</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F4EBDD;
  --surface:#FFFDF8;
  --surface2:#E9DDC9;
  --heading:#4E282C;
  --text:#493B32;
  --muted:#817366;
  --accent:#7C8957;
  --accentText:#4D5933;
  --category:#7C8957;
  --categoryText:#FFFDF5;
  --price:#A86143;
  --border:#D8CBB8;
  --danger:#B44E48;
  --shadow:rgba(63,42,29,.10);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
  overflow-x:hidden;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

/* =========================
   MÜŞTERİ MENÜSÜ
========================= */

#app{
  min-height:100vh;
}

.menu-wrap{
  width:100%;
  max-width:680px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:85px;
}

.hero{
  text-align:center;
  padding:28px 18px 25px;
  position:relative;
}

.logo-box{
  width:112px;
  height:112px;
  border-radius:50%;
  margin:0 auto 17px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--surface);
  border:2px solid var(--accent);
  box-shadow:
    0 0 0 6px rgba(124,137,87,.10),
    0 12px 30px rgba(0,0,0,.10);
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.logo-placeholder{
  text-align:center;
  padding:10px;
  color:var(--accent);
  font-family:"Playfair Display",serif;
  font-size:13px;
  font-weight:700;
}

.eyebrow{
  font-size:10px;
  letter-spacing:.45em;
  text-transform:uppercase;
  color:var(--accentText);
  margin-left:.45em;
  margin-bottom:9px;
  font-weight:700;
}

.cafe-title{
  margin:0;
  color:var(--heading);
  font-family:"Playfair Display",serif;
  font-size:clamp(38px,10vw,62px);
  line-height:1;
  letter-spacing:-.04em;
  font-weight:700;
}

.cafe-subtitle{
  max-width:470px;
  margin:11px auto 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

/* =========================
   KATEGORİLER
========================= */

.tabs-wrap{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(244,235,221,.94);
  backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);
  border-bottom:1px solid var(--border);
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:10px 13px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;
  min-width:90px;
  height:40px;
  padding:0 15px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
  transition:.2s ease;
}

.tab.active{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--categoryText);
  box-shadow:0 6px 18px rgba(124,137,87,.20);
}

/* =========================
   İÇERİK
========================= */

.category-area{
  padding:22px 15px 0;
}

.category-heading{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 18px;
  border-radius:15px;
  background:var(--category);
  color:var(--categoryText);
  font-family:"Playfair Display",serif;
  font-size:19px;
  font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  margin-bottom:14px;
}

.category-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--price);
}

/* =========================
   ÜRÜNLER
========================= */

.products{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.product-card{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:74px;
  padding:9px 10px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 5px 18px var(--shadow);
}

.product-image,
.product-no-image{
  width:57px;
  height:57px;
  flex:0 0 57px;
  border-radius:12px;
  object-fit:cover;
  border:1px solid var(--border);
  background:var(--surface2);
}

.product-no-image{
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  font-family:"Playfair Display",serif;
  font-size:20px;
}

.product-info{
  flex:1;
  min-width:0;
}

.product-top{
  display:flex;
  align-items:baseline;
  gap:7px;
}

.product-name{
  color:var(--heading);
  font-size:14px;
  line-height:1.25;
  font-weight:700;
}

.product-desc{
  margin-top:3px;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.35;
}

.dots{
  flex:1;
  min-width:10px;
  border-bottom:1px dotted var(--border);
  margin-bottom:4px;
}

.product-price{
  color:var(--price);
  white-space:nowrap;
  font-family:"Playfair Display",serif;
  font-size:15px;
  font-weight:700;
}

.product-card.sold{
  opacity:.52;
}

.product-card.sold .product-name{
  text-decoration:line-through;
}

.sold-label{
  color:var(--danger);
  font-size:8px;
  margin-left:5px;
  letter-spacing:.06em;
}

/* =========================
   ALT
========================= */

.menu-footer{
  text-align:center;
  padding:32px 20px 8px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.05em;
}

.footer-line{
  width:55px;
  height:1px;
  background:var(--border);
  margin:0 auto 12px;
}

/* =========================
   AYAR BUTONU
========================= */

.settings-button{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:30;
  width:45px;
  height:45px;
  border-radius:50%;
  border:1px solid var(--accent);
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.settings-button:active{
  transform:scale(.94);
}

/* =========================
   OVERLAY
========================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(35,25,18,.58);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0;
}

.admin-panel{
  width:100%;
  max-width:680px;
  max-height:94vh;
  overflow-y:auto;
  background:#F8F2E7;
  color:#352D26;
  border-radius:22px 22px 0 0;
  padding:15px 14px 25px;
  box-shadow:0 -15px 50px rgba(0,0,0,.30);
}

@media(min-width:700px){
  .overlay{
    align-items:center;
    padding:20px;
  }

  .admin-panel{
    max-height:92vh;
    border-radius:22px;
  }
}

.admin-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.admin-title{
  margin:0;
  font-family:"Playfair Display",serif;
  font-size:23px;
  color:#352D26;
}

.close-button{
  width:35px;
  height:35px;
  border-radius:50%;
  border:1px solid #D7CCBB;
  background:#FFFDF8;
  color:#706557;
  font-size:18px;
}

/* =========================
   ADMIN SEKME
========================= */

.admin-tabs{
  display:flex;
  gap:5px;
  padding:4px;
  background:#EDE3D4;
  border-radius:11px;
  margin-bottom:12px;
}

.admin-tab{
  flex:1;
  height:35px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#776C60;
  font-size:10.5px;
  font-weight:800;
}

.admin-tab.active{
  background:#FFFDF8;
  color:#352D26;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

/* =========================
   ADMIN SECTIONS
========================= */

.admin-section{
  background:#FFFDF8;
  border:1px solid #DDD2C1;
  border-radius:15px;
  padding:12px;
  margin-bottom:10px;
}

.section-title{
  margin:0 0 10px;
  color:#40372E;
  font-size:13px;
  font-weight:800;
}

.section-note{
  color:#8B7F70;
  font-size:9.5px;
  line-height:1.45;
  margin-top:6px;
}

/* =========================
   FORM
========================= */

.form-label{
  display:block;
  margin:9px 0 4px;
  color:#776B5C;
  font-size:9px;
  font-weight:800;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.form-input,
.form-textarea{
  width:100%;
  border:1px solid #D8CCBB;
  border-radius:9px;
  background:#FBF7EF;
  color:#352D26;
  padding:9px 10px;
  font-size:12px;
  outline:none;
}

.form-input:focus,
.form-textarea:focus{
  border-color:#8B9966;
  box-shadow:0 0 0 3px rgba(124,137,87,.10);
}

.form-textarea{
  min-height:60px;
  resize:vertical;
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

/* =========================
   LOGO
========================= */

.logo-admin{
  display:grid;
  grid-template-columns:80px 1fr;
  gap:11px;
  align-items:center;
}

.logo-preview{
  width:80px;
  height:80px;
  border-radius:15px;
  background:#241912;
  border:1px solid #CBA668;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.logo-preview img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.logo-actions{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.file-button{
  position:relative;
  overflow:hidden;
  min-height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:#7C8957;
  color:#fff;
  font-size:10px;
  font-weight:800;
}

.file-button input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

.small-button{
  min-height:34px;
  border-radius:8px;
  border:1px solid #D7CCBB;
  background:#FFFDF8;
  color:#62584D;
  font-size:10px;
  font-weight:800;
}

/* =========================
   RENKLER
========================= */

.color-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.color-control{
  border:1px solid #DED3C3;
  background:#FAF6EE;
  border-radius:10px;
  padding:7px;
}

.color-name{
  color:#716657;
  font-size:8.5px;
  font-weight:800;
  margin-bottom:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.color-row{
  display:flex;
  align-items:center;
  gap:5px;
}

.color-picker{
  width:29px !important;
  height:29px !important;
  padding:0 !important;
  border:0 !important;
  border-radius:7px !important;
  flex:0 0 29px;
  cursor:pointer;
}

.hex-input{
  min-width:0;
  flex:1;
  height:29px;
  border:1px solid #D8CCBB;
  border-radius:7px;
  background:#FFFDF8;
  color:#4A4037;
  padding:0 6px;
  font-family:monospace;
  font-size:9px;
  text-transform:uppercase;
}

.reset-color{
  width:27px;
  height:27px;
  flex:0 0 27px;
  border-radius:50%;
  border:1px solid #D8CCBB;
  background:#FFFDF8;
  color:#8B7D6C;
  font-size:11px;
}

/* =========================
   TEMA ÖNİZLEME
========================= */

.preview-box{
  margin-top:10px;
  padding:10px;
  border-radius:11px;
  background:var(--preview-bg);
  border:1px solid var(--preview-border);
}

.preview-top{
  display:flex;
  align-items:center;
  gap:8px;
}

.preview-circle{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border-radius:50%;
  background:var(--preview-accent);
}

.preview-text{
  flex:1;
}

.preview-title{
  color:var(--preview-heading);
  font-family:"Playfair Display",serif;
  font-size:13px;
  font-weight:700;
}

.preview-sub{
  color:var(--preview-muted);
  font-size:9px;
  margin-top:2px;
}

.preview-price{
  color:var(--preview-price);
  font-family:"Playfair Display",serif;
  font-size:12px;
  font-weight:800;
}

/* =========================
   KATEGORİ ADMIN
========================= */

.category-admin{
  border:1px solid #DED3C3;
  background:#FAF6EE;
  border-radius:11px;
  padding:8px;
  margin-bottom:7px;
}

.category-head{
  display:flex;
  gap:6px;
}

.category-head input{
  flex:1;
}

.delete-button{
  min-height:33px;
  padding:0 9px;
  border-radius:7px;
  border:1px solid #CF8A83;
  background:#FFF7F5;
  color:#A94741;
  font-size:9px;
  font-weight:800;
}

.item-admin{
  margin-top:7px;
  padding:8px;
  background:#FFFDF8;
  border:1px solid #E3D9C9;
  border-radius:9px;
}

.item-admin-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.item-number{
  color:#978875;
  font-size:8px;
  font-weight:800;
}

.remove-item{
  border:0;
  background:none;
  color:#AF5C55;
  font-size:9px;
}

.item-grid{
  display:grid;
  grid-template-columns:1fr 85px;
  gap:6px;
}

.availability{
  display:flex;
  align-items:center;
  gap:5px;
  color:#756A5D;
  font-size:9px;
  margin-top:6px;
}

.add-button{
  width:100%;
  min-height:35px;
  border-radius:8px;
  border:1px dashed #BBAF9C;
  background:#FFFDF8;
  color:#6E6255;
  font-size:9px;
  font-weight:800;
}

/* =========================
   KAYDET
========================= */

.status{
  min-height:18px;
  text-align:center;
  color:#6E6255;
  font-size:9.5px;
  margin:7px 0;
}

.main-save{
  width:100%;
  min-height:45px;
  border:0;
  border-radius:11px;
  background:#7C8957;
  color:#fff;
  font-size:12px;
  font-weight:800;
  box-shadow:0 8px 20px rgba(124,137,87,.20);
}

/* =========================
   PIN
========================= */

.pin-panel{
  width:calc(100% - 24px);
  max-width:370px;
  background:#FFFDF8;
  color:#352D26;
  border-radius:18px;
  padding:18px;
  margin:auto;
}

.pin-title{
  text-align:center;
  font-family:"Playfair Display",serif;
  font-size:23px;
  margin:0 0 3px;
}

.pin-subtitle{
  text-align:center;
  color:#897D6E;
  font-size:10px;
  margin-bottom:13px;
}

.pin-input{
  text-align:center;
  letter-spacing:.35em;
  font-size:18px !important;
}

.pin-login{
  width:100%;
  margin-top:9px;
  min-height:42px;
  border:0;
  border-radius:9px;
  background:#7C8957;
  color:#fff;
  font-weight:800;
}

.error{
  text-align:center;
  color:#B14C46;
  font-size:10px;
  margin-top:7px;
}

/* =========================
   MOBİL
========================= */

@media(max-width:480px){

  .hero{
    padding-top:25px;
  }

  .logo-box{
    width:96px;
    height:96px;
  }

  .cafe-title{
    font-size:39px;
  }

  .category-area{
    padding-left:12px;
    padding-right:12px;
  }

  .product-card{
    min-height:71px;
  }

  .product-image,
  .product-no-image{
    width:54px;
    height:54px;
    flex-basis:54px;
  }

  .product-name{
    font-size:13px;
  }

  .product-desc{
    font-size:10px;
  }

  .product-price{
    font-size:14px;
  }

  .color-grid{
    gap:5px;
  }
}
</style>

========================================================= */

function uid(){

  return "id-" +
    Date.now().toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,8);

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"

        }[m];

      }
    );

}


function escapeAttr(value){

  return escapeHtml(value);

}


function money(value){

  return Number(value || 0)
    .toLocaleString("tr-TR") +
    " ₺";

}


function validColor(value){

  return /^#[0-9A-Fa-f]{6}$/.test(
    String(value || "")
  );

}


/* =========================================================
   VERİ NORMALİZASYON
========================================================= */

function normalizeData(data){

  if(
    !data ||
    typeof data !== "object"
  ){

    data =
      JSON.parse(
        JSON.stringify(DEFAULT_DATA)
      );

  }


  if(!data.cafeName){

    data.cafeName =
      DEFAULT_DATA.cafeName;

  }


  if(!data.subtitle){

    data.subtitle =
      DEFAULT_DATA.subtitle;

  }


  if(!Array.isArray(data.categories)){

    data.categories = [];

  }


  data.logo =
    data.logo || "";


  const oldTheme =
    data.theme || {};


  data.theme = {

    background:
      oldTheme.background ||
      DEFAULT_THEME.background,

    surface:
      oldTheme.surface ||
      DEFAULT_THEME.surface,

    surfaceRaised:
      oldTheme.surfaceRaised ||
      DEFAULT_THEME.surfaceRaised,

    heading:
      oldTheme.heading ||
      DEFAULT_THEME.heading,

    text:
      oldTheme.text ||
      DEFAULT_THEME.text,

    muted:
      oldTheme.muted ||
      DEFAULT_THEME.muted,

    accent:
      oldTheme.accent ||
      oldTheme.baseColor ||
      DEFAULT_THEME.accent,

    accentText:
      oldTheme.accentText ||
      DEFAULT_THEME.accentText,

    category:
      oldTheme.category ||
      DEFAULT_THEME.category,

    categoryText:
      oldTheme.categoryText ||
      DEFAULT_THEME.categoryText,

    price:
      oldTheme.price ||
      DEFAULT_THEME.price,

    border:
      oldTheme.border ||
      DEFAULT_THEME.border,

    danger:
      oldTheme.danger ||
      DEFAULT_THEME.danger

  };


  data.categories.forEach(
    category => {

      if(!category.id){

        category.id = uid();

      }


      if(!category.name){

        category.name =
          "Yeni kategori";

      }


      if(!Array.isArray(category.items)){

        category.items = [];

      }


      category.items.forEach(
        item => {

          if(!item.id){

            item.id = uid();

          }

          if(item.name === undefined){

            item.name = "Yeni ürün";

          }

          if(item.desc === undefined){

            item.desc = "";

          }

          if(item.price === undefined){

            item.price = 0;

          }

          if(item.available === undefined){

            item.available = true;

          }

          if(item.image === undefined){

            item.image = "";

          }

        }
      );

    }
  );


  return data;

}


/* =========================================================
   TEMA UYGULA
========================================================= */

function applyTheme(){

  if(!menuData) return;


  const t =
    menuData.theme;


  const root =
    document.documentElement.style;


  root.setProperty(
    "--bg",
    t.background
  );

  root.setProperty(
    "--surface",
    t.surface
  );

  root.setProperty(
    "--surface2",
    t.surfaceRaised
  );

  root.setProperty(
    "--heading",
    t.heading
  );

  root.setProperty(
    "--text",
    t.text
  );

  root.setProperty(
    "--muted",
    t.muted
  );

  root.setProperty(
    "--accent",
    t.accent
  );

  root.setProperty(
    "--accentText",

  );

  root.setProperty(

async function loadMenu(){

  try{

    const result =
      await supabaseClient
        .from("menus")
        .select("id,data")
        .eq("id",MENU_ID)
        .maybeSingle();


    if(result.error){

      throw result.error;

    }


    if(
      result.data &&
      result.data.data
    ){

      menuData =
        normalizeData(
          result.data.data
        );

    }else{

      menuData =
        normalizeData(
          JSON.parse(
            JSON.stringify(DEFAULT_DATA)
          )
        );

    }


    activeCategory =
      menuData.categories.length
        ? menuData.categories[0].id
        : null;


    applyTheme();

    console.error(error);


    document.getElementById("app")
      .innerHTML = `

function renderCustomer(){

  if(!menuData) return;


  applyTheme();


  const app =
    document.getElementById("app");


  const categories =
    menuData.categories;


  if(!categories.length){

    app.innerHTML = `

      <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        color:var(--muted);
      ">
        Menüde henüz kategori yok.
      </div>

    `;

    return;

  }


  let active =
    categories.find(
      category =>
        category.id === activeCategory
    );


  if(!active){

    active =
      categories[0];

    activeCategory =
      active.id;

  }


  const logoHTML =
    menuData.logo

      ? `

        <img
          src="${escapeAttr(menuData.logo)}"
          alt="${escapeAttr(menuData.cafeName)}"
        >

      `

      : `

        <div class="logo-placeholder">
          ${escapeHtml(menuData.cafeName)}
        </div>

      `;


  const tabsHTML =
    categories.map(
      category => `

        <button
          class="tab ${
            category.id === active.id
              ? "active"
              : ""
          }"
          data-category="${escapeAttr(category.id)}"
        >
          ${escapeHtml(category.name)}
        </button>

      `
    ).join("");


  const productsHTML =
    active.items.length

      ? active.items.map(
          item => {

            const sold =
              item.available === false;


            const imageHTML =
              item.image

                ? `

                  >

                : `

              ">

                ${imageHTML}

                <div class="product-info">

                  <div class="product-top">

                    </div>

                    <div class="dots"></div>

                    <div class="product-price">

                    </div>

                  </div>


                  ${
                    item.desc

                      ? `

                        <div class="product-desc">
                          ${escapeHtml(item.desc)}
                        </div>

                      `

                      : ""
                  }

                </div>

              </div>

            `;

          }
        ).join("")

      : `

        <div style="
          text-align:center;
          color:var(--muted);
          padding:25px 10px;
          font-size:12px;
        ">
          Bu kategoride henüz ürün yok.
        </div>

      `;


  app.innerHTML = `

    <div class="menu-wrap">

      <header class="hero">

        <div class="logo-box">
          ${logoHTML}
        </div>

        <div class="eyebrow">

        <nav class="tabs">
          ${tabsHTML}

      </div>


      <main class="category-area">

        <div class="category-heading">

          <span class="category-dot"></span>

        <div class="products">

      </main>


      <footer class="menu-footer">

        <div class="footer-line"></div>

        QR ile açıldı · Afiyet olsun

      </footer>

    </div>

  `;


  document
    .querySelectorAll("[data-category]")

      button.onclick = () => {

        activeCategory =
          button.dataset.category;

        renderCustomer();

function showPinPanel(){

  const overlay =
    document.createElement("div");


  overlay.className =
    "overlay";


  overlay.innerHTML = `

    <div class="pin-panel">

      <div class="admin-head">

        <div></div>

        <button
          class="close-button"
          id="pinClose"
        >
          ×
        </button>

      </div>


      <h2 class="pin-title">
        Yönetim Paneli
      </h2>


      <div class="pin-subtitle">
        PIN kodunuzu girin
      </div>


      <input
        id="pinInput"
        class="form-input pin-input"
        type="password"
        inputmode="numeric"
        maxlength="8"
        placeholder="••••"
      >


      <div
        id="pinError"
        class="error"
      ></div>


      <button
        id="pinLogin"
        class="pin-login"
      >
        Giriş Yap
      </button>

    </div>

  `;


  document.body.appendChild(
    overlay
  );


  document
    .getElementById("pinClose")
    .onclick = () =>
      overlay.remove();


  const login = async () => {

    const pin =
      document
        .getElementById("pinInput")
        .value
        .trim();


    const error =
      document.getElementById(
        "pinError"
      );


    if(pin.length < 4){

      error.textContent =
        "PIN en az 4 haneli olmalı.";

      return;

    }


    error.textContent =
      "Kontrol ediliyor…";


    try{

      const result =
        await supabaseClient.rpc(
          "check_menu_pin",
          {
            p_menu_id:MENU_ID,
            p_pin:pin
          }
        );


      if(result.error){

        console.error(
          result.error
        );

        error.textContent =
          result.error.message ||
          "PIN kontrolü başarısız.";

        return;

      }


      if(result.data === true){

        authenticatedPin =
          pin;

        adminUnlocked =
          true;

        overlay.remove();

        adminTab =
          "general";

        showAdminPanel();

      }else{

        error.textContent =
          "PIN hatalı.";

      }

    }catch(err){

      console.error(err);

      error.textContent =
        "Bağlantı hatası.";

    }

  };


  document
    .getElementById("pinLogin")
    .onclick = login;


  document
    .getElementById("pinInput")
    .addEventListener(
      "keydown",
      event => {

        if(event.key === "Enter"){

          login();

        }

      }
    );

}

/* =========================================================

========================================================= */

function bindColors(){

  document
    .querySelectorAll("[data-color-key]")
    .forEach(input => {

      input.oninput = () => {

        const key =
          input.dataset.colorKey;


        menuData.theme[key] =
          input.value;


        const hex =
          document.querySelector(
            `[data-hex-key="${key}"]`
          );


        if(hex){

          hex.value =
            input.value.toUpperCase();

        }


        applyTheme();


        const preview =
          document.querySelector(
            ".preview-box"
          );


        if(preview){

          preview.style.setProperty(
            "--preview-bg",
            menuData.theme.background
          );

          preview.style.setProperty(
            "--preview-border",
            menuData.theme.border
          );

          preview.style.setProperty(
            "--preview-accent",
            menuData.theme.accent
          );

          preview.style.setProperty(
            "--preview-heading",
            menuData.theme.heading
          );

          preview.style.setProperty(
            "--preview-muted",
            menuData.theme.muted
          );

          preview.style.setProperty(
            "--preview-price",
            menuData.theme.price
          );

        }

      };

    });


  document
    .querySelectorAll("[data-hex-key]")
    .forEach(input => {

      input.oninput = () => {

        let value =
          input.value
            .trim()
            .toUpperCase();


        if(
          value.length === 6 &&
          !value.startsWith("#")
        ){

          value =
            "#" + value;

        }


        if(validColor(value)){

          const key =
            input.dataset.hexKey;


          menuData.theme[key] =
            value;


          const picker =
            document.querySelector(
              `[data-color-key="${key}"]`
            );


          if(picker){

            picker.value =
              value;

          }


          applyTheme();

        }

      };

    });


  document
    .querySelectorAll("[data-reset-color]")
    .forEach(button => {

      button.onclick = () => {

        const key =
          button.dataset.resetColor;


        menuData.theme[key] =
          DEFAULT_THEME[key];


        applyTheme();

        renderAdmin();

      };

    });

}

function bindMenuEditor(){

  document
    .querySelectorAll("[data-category-name]")
    .forEach(input => {

      input.oninput = () => {

        const category =
          menuData.categories.find(
            c =>
              c.id ===
              input.dataset.categoryName
          );


        if(category){

          category.name =
            input.value;

        }

      };

    });


  document
    .querySelectorAll("[data-delete-category]")
    .forEach(button => {

      button.onclick = () => {

        const id =
          button.dataset.deleteCategory;


        const category =
          menuData.categories.find(
            c => c.id === id
          );


        if(!category) return;


        if(
          !confirm(
            `"${category.name}" kategorisi silinsin mi?`
          )
        ){

          return;

        }


        menuData.categories =
          menuData.categories.filter(
            c => c.id !== id
          );


        if(activeCategory === id){

          activeCategory =
            menuData.categories.length
              ? menuData.categories[0].id
              : null;

        }


        renderAdmin();

      };

    });


  document
    .querySelectorAll("[data-item-name]")
    .forEach(input => {

      input.oninput = () => {

        updateItem(
          input.dataset.itemName,
          "name",
          input.value
        );

      };

    });


  document
    .querySelectorAll("[data-item-desc]")
    .forEach(input => {

      input.oninput = () => {

        updateItem(
          input.dataset.itemDesc,
          "desc",
          input.value
        );

      };

  document
    .querySelectorAll("[data-item-price]")
    .forEach(input => {

        updateItem(
          input.dataset.itemPrice,

  document
    .querySelectorAll("[data-item-available]")
    .forEach(input => {

      input.onchange = () => {

        updateItem(
          input.dataset.itemAvailable,
          "available",
          input.checked
        );

    });


  document
    .querySelectorAll("[data-delete-item]")
    .forEach(button => {

      button.onclick = () => {

        const itemId =
          button.dataset.deleteItem;


        const categoryId =
          button.dataset.categoryId;


        const category =
          menuData.categories.find(
            c => c.id === categoryId
          );


        if(!category) return;


        category.items =
          category.items.filter(
            item =>
              item.id !== itemId
          );


        renderAdmin();

      };

    });


  document
    .querySelectorAll("[data-add-item]")
    .forEach(button => {

      button.onclick = () => {

        const category =
          menuData.categories.find(
            c =>
              c.id ===
              button.dataset.addItem
          );


        if(!category) return;


        category.items.push({

          id:uid(),

          name:"Yeni ürün",

          desc:"",

          price:0,

          available:true,

          image:""

        });


        renderAdmin();

      };

    });


  document
    .querySelectorAll("[data-item-file]")
    .forEach(input => {

      input.onchange = async () => {

        const file =
          input.files?.[0];

        if(!file) return;


        try{

          const image =
            await resizeImage(
              file,
              480,
              .78
            );


          updateItem(
            input.dataset.itemFile,
            "image",
            image
          );


          renderAdmin();

        }catch(error){

          );

    });


  document
    .querySelectorAll("[data-item-url]")
    .forEach(input => {

        updateItem(
          input.dataset.itemUrl,
          "image",
          input.value.trim()
        );

      };

    });


  document
    .querySelectorAll("[data-remove-image]")
    .forEach(button => {

      button.onclick = () => {

        updateItem(
          button.dataset.removeImage,
          "image",
          ""
        );


        renderAdmin();

      };

    });

}


/* =========================================================
   ÜRÜN GÜNCELLE
========================================================= */

function updateItem(
  id,
  field,
  value
){

  for(
    const category
    of menuData.categories
  ){

    const item =
      category.items.find(
        i => i.id === id
      );


    if(item){

      item[field] =
        value;

      return;

    }

  }

}


/* =========================================================
   KAYDET
========================================================= */

async function saveMenu(status){

  if(!authenticatedPin){

    status.textContent =
      "Oturum süresi doldu. Tekrar giriş yapın.";

    return;

  }


  status.textContent =
    "Kaydediliyor…";


  menuData =
    normalizeData(menuData);


  try{

    const result =
      await supabaseClient.rpc(
        "save_menu",
        {
          p_menu_id:MENU_ID,
          p_pin:authenticatedPin,
          p_data:menuData
        }
      );


    if(result.error){

      console.error(
        result.error
      );


      status.textContent =
        "Kaydedilemedi: " +
        (
          result.error.message ||
          "Supabase hatası"
        );


      return;

    }


    if(result.data !== true){

      status.textContent =
        "Kaydedilemedi. PIN doğrulanamadı.";

      return;

    }


    status.textContent =
      "✓ Başarıyla kaydedildi.";


    applyTheme();


    setTimeout(
      () => {

        if(adminOverlay){

          adminOverlay.remove();

          adminOverlay = null;

        }


        renderCustomer();

      },
      600
    );


  }catch(error){

    console.error(error);


    status.textContent =
      "Bağlantı hatası.";

  }

}


/* =========================================================
   FOTOĞRAF KÜÇÜLTME
========================================================= */

function resizeImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const image =
            new Image();


          image.onload =
            () => {

              let width =
                image.width;

              let height =
                image.height;


              if(
                width > maxSize ||
                height > maxSize
              ){

                const ratio =
                  Math.min(
                    maxSize / width,
                    maxSize / height
                  );


                width =
                  Math.round(
                    width * ratio
                  );


                height =
                  Math.round(
                    height * ratio
                  );

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          image.onerror =
            reject;


          image.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}
