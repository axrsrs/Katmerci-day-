<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://cwofalezjvuxppmwipmc.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_n9xGFNXF-wl4C-BFLBGmeg_hsKy9GtU";


const MENU_ID =
"00000000-0000-0000-0000-000000000001";


let supabaseClient;


try{

supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

}catch(error){

console.error(
"SUPABASE INIT ERROR:",
error
);

}


/* =========================================================
   DEFAULT TEMA
========================================================= */

const DEFAULT_THEME = {

background:"#F4EBDD",

surface:"#FFFDF8",

surfaceRaised:"#E9DDC9",

heading:"#4E282C",

text:"#493B32",

muted:"#817366",

accent:"#7C8957",

accentText:"#4D5933",

category:"#7C8957",

categoryText:"#FFFDF5",

price:"#A86143",

border:"#D8CBB8",

danger:"#B44E48"

};


/* =========================================================
   DEFAULT DATA
========================================================= */

const DEFAULT_DATA = {

cafeName:"Katmerci Dayı",

subtitle:"Gaziantepten gelen lezzet",

logo:"",

theme:{
...DEFAULT_THEME
},

categories:[]

};


/* =========================================================
   DEĞİŞKENLER
========================================================= */

let menuData=null;

let activeCategory=null;

let adminUnlocked=false;

let authenticatedPin="";

let adminOverlay=null;

let adminTab="general";


/* =========================================================
   YARDIMCI
========================================================= */

function uid(){

return "id-" +
Date.now().toString(36) +
"-" +
Math.random()
.toString(36)
.slice(2,8);

}


function escapeHtml(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
function(m){

return {

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#039;"

}[m];

}
);

}


function escapeAttr(value){

return escapeHtml(value);

}


function money(value){

return Number(value||0)
.toLocaleString("tr-TR")+
" ₺";

}


function validColor(value){

return /^#[0-9A-Fa-f]{6}$/.test(
String(value||"")
);

}


/* =========================================================
   VERİYİ DÜZENLE
========================================================= */

function normalizeData(data){

if(
!data ||
typeof data !== "object"
){

data =
JSON.parse(
JSON.stringify(DEFAULT_DATA)
);

}


if(!data.cafeName){

data.cafeName =
"Katmerci Dayı";

}


if(!data.subtitle){

data.subtitle =
"Gaziantepten gelen lezzet";

}


data.logo =
data.logo || "";


if(!Array.isArray(data.categories)){

data.categories=[];

}


const old =
data.theme || {};


data.theme={

background:
old.background ||
DEFAULT_THEME.background,

surface:
old.surface ||
DEFAULT_THEME.surface,

surfaceRaised:
old.surfaceRaised ||
DEFAULT_THEME.surfaceRaised,

heading:
old.heading ||
DEFAULT_THEME.heading,

text:
old.text ||
DEFAULT_THEME.text,

muted:
old.muted ||
DEFAULT_THEME.muted,

accent:
old.accent ||
old.baseColor ||
DEFAULT_THEME.accent,

accentText:
old.accentText ||
DEFAULT_THEME.accentText,

category:
old.category ||
old.categoryBg ||
DEFAULT_THEME.category,

categoryText:
old.categoryText ||
DEFAULT_THEME.categoryText,

price:
old.price ||
DEFAULT_THEME.price,

border:
old.border ||
DEFAULT_THEME.border,

danger:
old.danger ||
old.sold ||
DEFAULT_THEME.danger

};


data.categories.forEach(
category=>{

if(!category.id){

category.id=uid();

}

if(!category.name){

category.name="Yeni kategori";

}

if(!Array.isArray(category.items)){

category.items=[];

}

category.items.forEach(
item=>{

if(!item.id){

item.id=uid();

}

/* =========================================================

========================================================= */

async function loadMenu(){

const app =
document.getElementById("app");


app.innerHTML=`

<div class="loading-screen">

Menü yükleniyor…

</div>

`;


try{

if(!supabaseClient){

throw new Error(
"Supabase bağlantısı başlatılamadı."
);

}


/*
10 saniyelik güvenlik süresi.
Supabase cevap vermezse sonsuza kadar
yükleniyor ekranında kalmaz.
*/

const timeout =
new Promise(
(_,reject)=>{

setTimeout(
()=>{

reject(
new Error(
"Supabase bağlantısı zaman aşımına uğradı."
)
);

},
10000
);

}
);


const request =
supabaseClient
.from("menus")
.select("id,data")
.eq("id",MENU_ID)
.maybeSingle();


const result =
await Promise.race([
request,
timeout
]);


if(result.error){

throw result.error;

}


if(
result.data &&
result.data.data
){

menuData =
normalizeData(
result.data.data
);

}else{

menuData =
normalizeData(
JSON.parse(
JSON.stringify(DEFAULT_DATA)
)
);

}


if(menuData.categories.length){

activeCategory =
menuData.categories[0].id;

}else{

activeCategory=null;

}


applyTheme();

renderCustomer();


}catch(error){

console.error(
"MENU LOAD ERROR:",
error
);

showLoadError(
error.message ||
"Menü yüklenemedi."
);

}

}

function bindColorEvents(){

document
.querySelectorAll("[data-color-key]")
.forEach(input=>{

input.oninput=()=>{

const key =
input.dataset.colorKey;


menuData.theme[key] =
input.value;


const hex =
document.querySelector(
`[data-hex-key="${key}"]`
);


if(hex){

hex.value =
input.value.toUpperCase();

}


applyTheme();

updateThemePreview();

};

});


document
.querySelectorAll("[data-hex-key]")
.forEach(input=>{

input.oninput=()=>{

let value =
input.value
.trim()
.toUpperCase();


if(
value.length===6 &&
!value.startsWith("#")
){

value="#"+value;

}


if(validColor(value)){

const key =
input.dataset.hexKey;


menuData.theme[key] =
value;


const picker =
document.querySelector(
`[data-color-key="${key}"]`
);


if(picker){

picker.value =
value;

}


applyTheme();

updateThemePreview();

}

};

});


document
.querySelectorAll("[data-reset-color]")
.forEach(button=>{

button.onclick=()=>{

const key =
button.dataset.resetColor;


menuData.theme[key] =
DEFAULT_THEME[key];


renderAdmin();

};

});

}

/* =========================================================
   MENÜ EVENTLERİ
========================================================= */

function bindMenuEvents(){

/* KATEGORİ ADI */

document
.querySelectorAll("[data-category-name]")
.forEach(input=>{

input.oninput=()=>{

const category =
menuData.categories.find(
c =>
c.id ===
input.dataset.categoryName
);


if(category){

category.name =
input.value;

}

};

});


/* KATEGORİ SİL */

document
.querySelectorAll("[data-delete-category]")
.forEach(button=>{

button.onclick=()=>{

const id =
button.dataset.deleteCategory;


const category =
menuData.categories.find(
c=>c.id===id
);


if(!category)return;


if(
!confirm(
`"${category.name}" kategorisi silinsin mi?`
)
){

return;

}


menuData.categories =
menuData.categories.filter(
c=>c.id!==id
);


if(activeCategory===id){

activeCategory =
menuData.categories.length
?menuData.categories[0].id
:null;

}


renderAdmin();

};

});


/* ÜRÜN ADI */

document
.querySelectorAll("[data-item-name]")
.forEach(input=>{

input.oninput=()=>{

updateItem(
input.dataset.itemName,
"name",
input.value
);

};

});


/* AÇIKLAMA */

document
.querySelectorAll("[data-item-desc]")
.forEach(input=>{

input.oninput=()=>{

updateItem(
input.dataset.itemDesc,
"desc",
input.value
);

};

});


/* FİYAT */

document
.querySelectorAll("[data-item-price]")
.forEach(input=>{

input.oninput=()=>{

let value =
Number(input.value);


if(
!Number.isFinite(value) ||
value<0
){

value=0;

}


updateItem(
input.dataset.itemPrice,
"price",
value
);

};

});


/* SATIŞ DURUMU */

document
.querySelectorAll("[data-item-available]")
.forEach(input=>{

input.onchange=()=>{

updateItem(
input.dataset.itemAvailable,
"available",
input.checked
);

};

});


/* ÜRÜN SİL */

document
.querySelectorAll("[data-delete-item]")
.forEach(button=>{

button.onclick=()=>{

const itemId =
button.dataset.deleteItem;


const categoryId =
button.dataset.categoryId;


const category =
menuData.categories.find(
c=>c.id===categoryId
);


if(!category)return;


category.items =
category.items.filter(
item=>item.id!==itemId
);


renderAdmin();

};

});


/* ÜRÜN EKLE */

document
.querySelectorAll("[data-add-item]")
.forEach(button=>{

button.onclick=()=>{

const category =
menuData.categories.find(
c =>
c.id ===
button.dataset.addItem
);


if(!category)return;


category.items.push({

id:uid(),

name:"Yeni ürün",

desc:"",

price:0,

available:true,

image:""

});


renderAdmin();

};

});


/* FOTOĞRAF */

document
.querySelectorAll("[data-item-file]")
.forEach(input=>{

input.onchange=async()=>{

const file =
input.files?.[0];


if(!file)return;


try{

const image =
await resizeImage(
file,
480,
.78
);


updateItem(
input.dataset.itemFile,
"image",
image
);


renderAdmin();


}catch(error){

console.error(error);

alert(
"Fotoğraf yüklenemedi."
);

}

};

});


/* URL */

document
.querySelectorAll("[data-item-url]")
.forEach(input=>{

input.oninput=()=>{

updateItem(
input.dataset.itemUrl,
"image",
input.value.trim()
);

});


/* GÖRSEL SİL */

document
.querySelectorAll("[data-remove-image]")
.forEach(button=>{

button.onclick=()=>{

updateItem(
button.dataset.removeImage,
"image",
""
);


renderAdmin();

};

});

}


/* =========================================================
   ÜRÜN GÜNCELLE
========================================================= */

function updateItem(
id,
field,
value
){

for(
const category
of menuData.categories
){

const item =
category.items.find(
i=>i.id===id
);


if(item){

item[field]=value;

return;

}

}

}


/* =========================================================
   KAYDET
========================================================= */

async function saveMenu(status){

if(!authenticatedPin){

status.textContent =
"Oturum bulunamadı. Tekrar giriş yapın.";

return;

}


const buttons =
document.querySelectorAll(
".main-save"
);


buttons.forEach(
button=>{

button.disabled=true;

button.textContent =
"KAYDEDİLİYOR...";

}
);


status.textContent =
"Supabase'e kaydediliyor…";


try{

menuData =
normalizeData(menuData);


const result =
await supabaseClient.rpc(
"save_menu",
{
p_menu_id:MENU_ID,

p_pin:authenticatedPin,

p_data:menuData

}
);


if(result.error){

console.error(
"SAVE ERROR:",
result.error
);


throw new Error(
result.error.message ||
"Supabase kayıt hatası."
);

}


const ok =
result.data===true ||
result.data==="true" ||
result.data?.[0]===true ||
result.data?.[0]?.save_menu===true ||
result.data?.result===true;


if(!ok){

throw new Error(
"Menü kaydedilmedi. PIN veya save_menu yetkisini kontrol edin."
);

}


/* VERİYİ TEKRAR OKU */

const check =
await supabaseClient
.from("menus")
.select("id,data")
.eq("id",MENU_ID)
.maybeSingle();


if(check.error){

throw check.error;

}


if(
!check.data ||
!check.data.data
){

throw new Error(
"Kaydetme sonrası menü doğrulanamadı."
);

}


menuData =
normalizeData(
check.data.data
);


applyTheme();


status.textContent =
"✓ Başarıyla kaydedildi.";


setTimeout(
()=>{

if(adminOverlay){

adminOverlay.remove();

adminOverlay=null;

}


renderCustomer();

},
650
);


}catch(error){

console.error(
"MENU SAVE ERROR:",
error
);


status.textContent =
"Hata: "+
(
error.message ||
"Menü kaydedilemedi."
);


buttons.forEach(
button=>{

button.disabled=false;

button.textContent =
"✓ KAYDET";

}
);

}

}


/* =========================================================
   FOTOĞRAF BOYUTLANDIR
========================================================= */

function resizeImage(
file,
maxSize,
quality
){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();


reader.onload =
event=>{

const image =
new Image();


image.onload =
()=>{

let width =
image.width;


let height =
image.height;


if(
width>maxSize ||
height>maxSize
){

const ratio =
Math.min(
maxSize/width,
maxSize/height
);


width =
Math.round(
width*ratio
);


height =
Math.round(
height*ratio
);

}


const canvas =
document.createElement(
"canvas"
);


canvas.width =
width;


canvas.height =
height;


const ctx =
canvas.getContext("2d");


ctx.drawImage(
image,
0,
0,
width,
height
);


resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};


image.onerror =
reject;


image.src =
event.target.result;

};


reader.onerror =
reject;


reader.readAsDataURL(file);

}
);
